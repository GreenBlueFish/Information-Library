<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library of Alexandria</title>
    <meta
      name="description"
      content="Alexandria — a scalable, self-documenting static learning library."
    />
    <!-- Presentation layer: design tokens first, then component/layout styles that consume them. -->
    <!-- Theme before first paint, so a dark-mode reader never sees a white flash:
         the saved choice (src/theme.js), else the system setting. -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem("alexandria-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/alexandria.css" />
  </head>
  <body>
    <!-- Site header landmark: title + mission line, shared across every rendered view. -->
    <header class="site-header" role="banner">
      <a class="site-title" href="#/">Library of Alexandria</a>
      <p class="site-mission">
        A scalable, self-documenting library of knowledge — one shared renderer, any depth of topics.
      </p>
      <p class="lookup-hint">Highlight any term to see its meaning.</p>
      <button type="button" class="theme-toggle" id="theme-toggle" hidden></button>
    </header>

    <!-- Navigation landmark: the renderer fills this with the topic tree and breadcrumb. -->
    <nav id="nav" class="site-nav" aria-label="Topics"></nav>

    <!-- Main landmark: the renderer mounts the home page or a resolved page here. -->
    <main id="app" class="app" role="main"></main>

    <!-- Footer landmark: shared across every rendered view. -->
    <footer class="site-footer" role="contentinfo">
      <p>Library of Alexandria — a static, no-build-step learning library. <a href="#/credits">Image credits</a></p>
    </footer>

    <!-- Runtime entry: native ES module, no build step. Boots the renderer and reads the route. -->
    <script type="module" src="src/main.js"></script>
    <script type="module" src="src/theme.js"></script>
  </body>
</html>
