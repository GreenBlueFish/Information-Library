<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Understeer and oversteer in a right-hand corner, seen from above</title>
<rect width="760" height="440" fill="#ffffff"/>
<defs>
<g id="car">
<rect x="-15" y="-28" width="30" height="56" rx="8" fill="#243b53"/>
<rect x="-10" y="-14" width="20" height="14" rx="3" fill="#d6dbe3"/>
</g>
<g id="wheel"><rect x="-4" y="-8" width="8" height="16" rx="2" fill="#1a2230"/></g>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#e5533c"/></marker>
</defs>
<text x="24" y="34" font-size="18" font-weight="600" fill="#1a2230">Understeer and oversteer</text>
<g>
<text x="40" y="66" font-size="15" font-weight="600" fill="#1a2230">Understeer: the front runs out of grip</text>
<path d="M60 420 A270 270 0 0 1 330 150" fill="none" stroke="#5a6577" stroke-width="2" stroke-dasharray="7 6"/>
<path d="M60 420 C60 280 110 150 230 92" fill="none" stroke="#e5533c" stroke-width="3" marker-end="url(#ah)"/>
<g transform="translate(118 228) rotate(28)">
<use href="#wheel" transform="translate(-18 -17) rotate(28)"/><use href="#wheel" transform="translate(18 -17) rotate(28)"/>
<use href="#wheel" transform="translate(-18 17)"/><use href="#wheel" transform="translate(18 17)"/>
<use href="#car"/>
</g>
<g font-size="12" fill="#1a2230">
<text x="250" y="335" fill="#5a6577">the line the</text><text x="250" y="350" fill="#5a6577">driver wants</text>
<text x="245" y="105" fill="#e5533c">where the car goes:</text><text x="245" y="120" fill="#e5533c">wide, nose first</text>
<text x="160" y="258">front wheels turned</text><text x="160" y="273">hard, but sliding</text>
<text x="150" y="395" fill="#5a6577">Car turns less than the</text><text x="150" y="410" fill="#5a6577">steering asks ("pushes").</text>
</g>
</g>
<line x1="380" y1="60" x2="380" y2="420" stroke="#d6dbe3" stroke-width="1.5"/>
<g transform="translate(380 0)">
<text x="30" y="66" font-size="15" font-weight="600" fill="#1a2230">Oversteer: the rear runs out of grip</text>
<path d="M60 420 A270 270 0 0 1 330 150" fill="none" stroke="#5a6577" stroke-width="2" stroke-dasharray="7 6"/>
<path d="M60 420 C60 310 120 250 250 236" fill="none" stroke="#e5533c" stroke-width="3" marker-end="url(#ah)"/>
<path d="M118 268 Q98 292 74 286" fill="none" stroke="#e5533c" stroke-width="2" marker-end="url(#ah)"/>
<g transform="translate(140 236) rotate(78)">
<use href="#wheel" transform="translate(-18 -17) rotate(-22)"/><use href="#wheel" transform="translate(18 -17) rotate(-22)"/>
<use href="#wheel" transform="translate(-18 17)"/><use href="#wheel" transform="translate(18 17)"/>
<use href="#car"/>
</g>
<g font-size="12" fill="#1a2230">
<text x="250" y="335" fill="#5a6577">the line the</text><text x="250" y="350" fill="#5a6577">driver wants</text>
<text x="20" y="180" fill="#e5533c">nose points into the</text><text x="20" y="195" fill="#e5533c">corner too far</text>
<text x="150" y="285">rear steps out;</text><text x="150" y="300">driver counter-steers</text>
<text x="150" y="395" fill="#5a6577">Car turns more than the</text><text x="150" y="410" fill="#5a6577">steering asks ("loose").</text>
</g>
</g>
</svg>
