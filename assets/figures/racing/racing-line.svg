<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Two lines through a 90-degree right-hand corner: the geometric line and a late-apex line</title>
<rect width="760" height="450" fill="#ffffff"/>
<text x="24" y="34" font-size="18" font-weight="600" fill="#1a2230">Two lines through a 90° right-hander</text>
<path d="M100 440 V200 A140 140 0 0 1 240 60 H740 V160 H240 A40 40 0 0 0 200 200 V440 Z" fill="#eef1f6" stroke="#5a6577" stroke-width="2"/>
<path d="M200 230 V200 A40 40 0 0 1 240 160 H270" fill="none" stroke="#e5533c" stroke-width="6" stroke-dasharray="10 8"/>
<text x="250" y="190" font-size="12" fill="#5a6577">inside kerb</text>
<rect x="104" y="300" width="92" height="120" fill="#fff7e0" stroke="#d9a000" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="150" y="355" font-size="12" fill="#1a2230" text-anchor="middle">braking</text>
<text x="150" y="371" font-size="12" fill="#1a2230" text-anchor="middle">zone</text>
<path d="M110 440 V405 A335 335 0 0 1 445 70 H740" fill="none" stroke="#2f6fed" stroke-width="3"/>
<path d="M118 440 V285 C118 200 150 170 218 161 C300 149 420 78 600 72 H740" fill="none" stroke="#e5533c" stroke-width="3"/>
<g font-size="12" fill="#1a2230">
<circle cx="110" cy="405" r="5" fill="#2f6fed"/><text x="30" y="409">turn-in (G)</text>
<circle cx="208" cy="168" r="5" fill="#2f6fed"/><text x="128" y="196" fill="#2f6fed">apex (G)</text>
<circle cx="445" cy="70" r="5" fill="#2f6fed"/><text x="420" y="50" fill="#2f6fed">exit (G)</text>
<circle cx="118" cy="285" r="5" fill="#e5533c"/><text x="30" y="289">turn-in (L)</text>
<circle cx="220" cy="161" r="5" fill="#e5533c"/><text x="228" y="146" fill="#e5533c">apex (L)</text>
<circle cx="600" cy="72" r="5" fill="#e5533c"/><text x="575" y="50" fill="#e5533c">exit (L)</text>
</g>
<g font-size="13" fill="#1a2230">
<line x1="300" y1="250" x2="330" y2="250" stroke="#2f6fed" stroke-width="3"/>
<text x="340" y="254">G: geometric line, one constant radius, widest arc</text>
<line x1="300" y1="280" x2="330" y2="280" stroke="#e5533c" stroke-width="3"/>
<text x="340" y="284">L: late apex, brakes later and turns in later,</text>
<text x="340" y="302">tighter first half, then straightens early</text>
<text x="300" y="340" fill="#5a6577">The late-apex car is slower at the apex but can</text>
<text x="300" y="358" fill="#5a6577">open the throttle sooner, so it is faster all the</text>
<text x="300" y="376" fill="#5a6577">way down the straight that follows.</text>
<text x="300" y="404" fill="#5a6577">The car drives up the page, then to the right.</text>
</g>
</svg>
