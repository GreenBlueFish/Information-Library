<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>The friction circle, with the path a driver traces through one corner</title>
<rect width="760" height="420" fill="#ffffff"/>
<text x="24" y="34" font-size="18" font-weight="600" fill="#1a2230">The friction circle</text>
<circle cx="230" cy="225" r="150" fill="#eef1f6" stroke="#5a6577" stroke-width="2"/>
<line x1="60" y1="225" x2="400" y2="225" stroke="#d6dbe3" stroke-width="1.5"/>
<line x1="230" y1="60" x2="230" y2="390" stroke="#d6dbe3" stroke-width="1.5"/>
<line x1="120" y1="120" x2="340" y2="120" stroke="#d9a000" stroke-width="2" stroke-dasharray="6 5"/>
<text x="345" y="116" font-size="12" fill="#5a6577">engine limit</text>
<g font-size="13" fill="#5a6577" text-anchor="middle">
<text x="230" y="56">accelerating</text>
<text x="230" y="406">braking</text>
<text x="40" y="229" text-anchor="start">left</text>
<text x="420" y="229" text-anchor="end">right</text>
</g>
<path d="M230 225 V362 A137 137 0 0 0 367 225 A137 137 0 0 0 340 145 L300 128" fill="none" stroke="#e5533c" stroke-width="3"/>
<g font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">
<circle cx="230" cy="320" r="12" fill="#e5533c"/><text x="230" y="325">1</text>
<circle cx="327" cy="322" r="12" fill="#e5533c"/><text x="327" y="327">2</text>
<circle cx="367" cy="225" r="12" fill="#e5533c"/><text x="367" y="230">3</text>
<circle cx="346" cy="160" r="12" fill="#e5533c"/><text x="346" y="165">4</text>
</g>
<g font-size="13" fill="#1a2230">
<text x="440" y="80">The dot is the total force the tyres make,</text>
<text x="440" y="98">in g. It can go anywhere inside the circle</text>
<text x="440" y="116">but never outside: the edge is the grip limit.</text>
<text x="440" y="150">Through one right-hand corner:</text>
<text x="440" y="174">1  braking in a straight line</text>
<text x="440" y="198">2  trail braking: brake eases off as</text>
<text x="458" y="216">steering goes on, staying on the edge</text>
<text x="440" y="240">3  apex: all the grip is cornering grip</text>
<text x="440" y="264">4  exit: throttle comes in as the</text>
<text x="458" y="282">steering unwinds</text>
<text x="440" y="316" fill="#5a6577">A real car's shape is not a perfect circle,</text>
<text x="440" y="334" fill="#5a6577">and the top is cut off by engine power.</text>
<text x="440" y="358" fill="#5a6577">Any time spent in the middle is grip unused.</text>
</g>
</svg>
