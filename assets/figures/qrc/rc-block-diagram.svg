<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="940" height="340" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Reservoir computing: an input signal drives a fixed reservoir; only the linear readout that turns the reservoir state into the output is trained</title>
<rect width="940" height="340" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a2230"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7b8798"/></marker></defs>
<text x="20" y="30" font-size="17" font-weight="600" fill="#1a2230">Reservoir computing: a fixed reservoir, a trained readout</text>
<g transform="translate(0,0)"><polyline points="30,165.0 34,146.02751105064226 38,150.9472781810738 42,149.12127542279825 46,141.8208115331771 50,158.916858052852 54,174.82178629496815 58,168.42844697488226 62,171.70665591497672 66,181.21469166990525 70,167.95306895672115 74,158.61614514682762 78,170.71396243371632 82,170.34919776831322 86,162.40455452047325 90,174.30371377969547 94,178.07275895044714" fill="none" stroke="#2f6fb0" stroke-width="2.2"/></g>
<text x="70" y="215" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">input u(k)</text>
<text x="70" y="234" font-size="12" text-anchor="middle" fill="#5a6577">one number per step</text>
<line x1="112" y1="160" x2="262" y2="160" stroke="#1a2230" stroke-width="2" marker-end="url(#a)"/>
<rect x="262" y="55" width="330" height="208" rx="14" fill="#eef1f6" stroke="#9aa5b5" stroke-width="2"/>
<text x="427" y="78" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">reservoir: fixed, never trained</text>
<line x1="330" y1="144" x2="400" y2="114" stroke="#7b8798" stroke-width="1.5" marker-end="url(#g)"/>
<line x1="400" y1="114" x2="470" y2="154" stroke="#7b8798" stroke-width="1.5" marker-end="url(#g)"/>
<line x1="330" y1="144" x2="360" y2="214" stroke="#7b8798" stroke-width="1.5" marker-end="url(#g)"/>
<line x1="360" y1="214" x2="440" y2="224" stroke="#7b8798" stroke-width="1.5" marker-end="url(#g)"/>
<line x1="470" y1="154" x2="440" y2="224" stroke="#7b8798" stroke-width="1.5" marker-end="url(#g)"/>
<line x1="440" y1="224" x2="520" y2="209" stroke="#7b8798" stroke-width="1.5" marker-end="url(#g)"/>
<line x1="470" y1="154" x2="520" y2="209" stroke="#7b8798" stroke-width="1.5" marker-end="url(#g)"/>
<line x1="400" y1="114" x2="500" y2="119" stroke="#7b8798" stroke-width="1.5" marker-end="url(#g)"/>
<line x1="500" y1="119" x2="470" y2="154" stroke="#7b8798" stroke-width="1.5" marker-end="url(#g)"/>
<line x1="360" y1="214" x2="400" y2="114" stroke="#7b8798" stroke-width="1.5" marker-end="url(#g)"/>
<line x1="520" y1="209" x2="500" y2="119" stroke="#7b8798" stroke-width="1.5" marker-end="url(#g)"/>
<line x1="330" y1="144" x2="440" y2="224" stroke="#7b8798" stroke-width="1.5" marker-end="url(#g)"/>
<circle cx="330" cy="144" r="11" fill="#ffffff" stroke="#5a6577" stroke-width="2"/>
<circle cx="400" cy="114" r="11" fill="#ffffff" stroke="#5a6577" stroke-width="2"/>
<circle cx="470" cy="154" r="11" fill="#ffffff" stroke="#5a6577" stroke-width="2"/>
<circle cx="360" cy="214" r="11" fill="#ffffff" stroke="#5a6577" stroke-width="2"/>
<circle cx="440" cy="224" r="11" fill="#ffffff" stroke="#5a6577" stroke-width="2"/>
<circle cx="520" cy="209" r="11" fill="#ffffff" stroke="#5a6577" stroke-width="2"/>
<circle cx="500" cy="119" r="11" fill="#ffffff" stroke="#5a6577" stroke-width="2"/>
<text x="427" y="252" font-size="12" text-anchor="middle" fill="#5a6577">units pass signals to each other and to themselves: the past echoes on</text>
<line x1="592" y1="110" x2="668" y2="110" stroke="#1a2230" stroke-width="2" marker-end="url(#a)"/>
<line x1="592" y1="160" x2="668" y2="160" stroke="#1a2230" stroke-width="2" marker-end="url(#a)"/>
<line x1="592" y1="210" x2="668" y2="210" stroke="#1a2230" stroke-width="2" marker-end="url(#a)"/>
<text x="630" y="282" font-size="12" text-anchor="middle" fill="#5a6577">state x(k)</text>
<text x="630" y="298" font-size="12" text-anchor="middle" fill="#5a6577">(many numbers)</text>
<rect x="668" y="85" width="150" height="150" rx="14" fill="#fdf0e0" stroke="#d98a1f" stroke-width="2.5"/>
<text x="743" y="112" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">readout</text>
<text x="743" y="136" font-size="12" text-anchor="middle" fill="#1a2230">weighted sum:</text>
<text x="743" y="156" font-size="12" text-anchor="middle" fill="#1a2230">w1 x1 + w2 x2 + ...</text>
<text x="743" y="190" font-size="13" text-anchor="middle" fill="#a35f00" font-weight="600">the only part</text>
<text x="743" y="208" font-size="13" text-anchor="middle" fill="#a35f00" font-weight="600">that is trained</text>
<line x1="818" y1="160" x2="880" y2="160" stroke="#1a2230" stroke-width="2" marker-end="url(#a)"/>
<text x="876" y="195" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">output y(k)</text>
<text x="876" y="213" font-size="12" text-anchor="middle" fill="#5a6577">the prediction</text>
<text x="470" y="326" font-size="13" text-anchor="middle" fill="#1a2230">Training = choosing the weights w so that y(k) matches the wanted answer on example data (one linear fit, no looping back through time)</text>
</svg>
