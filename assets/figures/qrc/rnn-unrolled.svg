<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" width="940" height="360" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>A recurrent network drawn folded (a loop) and unrolled over three time steps: the same weights are used at every step and the state is passed along</title>
<rect width="940" height="360" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a2230"/></marker>
<marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs>
<text x="20" y="30" font-size="17" font-weight="600" fill="#1a2230">A recurrent network, folded and unrolled in time</text>
<text x="85" y="76" font-size="13" text-anchor="middle" fill="#5a6577">folded</text>
<rect x="50" y="150" width="70" height="60" rx="10" fill="#eef1f6" stroke="#9aa5b5" stroke-width="2"/>
<text x="85" y="186" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">cell</text>
<path d="M120 170 C170 170 170 120 85 120 C35 120 35 150 50 160" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#o)"/>
<text x="150" y="112" font-size="12" fill="#c0392b">state fed back</text>
<line x1="85" y1="270" x2="85" y2="212" stroke="#1a2230" stroke-width="2" marker-end="url(#a)"/>
<text x="85" y="290" font-size="13" text-anchor="middle" fill="#1a2230">input u</text>
<line x1="240" y1="40" x2="240" y2="330" stroke="#c9d1dc" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="262" y="76" font-size="13" fill="#5a6577">unrolled: one copy of the cell per time step, all with the same weights</text>
<circle cx="285" cy="180" r="24" fill="#ffffff" stroke="#c0392b" stroke-width="2"/><text x="285" y="185" font-size="14" text-anchor="middle" fill="#1a2230">h0</text>
<text x="285" y="222" font-size="11" text-anchor="middle" fill="#5a6577">start state</text>
<line x1="309" y1="180" x2="330" y2="180" stroke="#c0392b" stroke-width="2" marker-end="url(#o)"/>
<rect x="330" y="145" width="90" height="70" rx="10" fill="#eef1f6" stroke="#9aa5b5" stroke-width="2"/>
<text x="375" y="177" font-size="13" text-anchor="middle" fill="#1a2230" font-weight="600">cell</text><text x="375" y="197" font-size="11" text-anchor="middle" fill="#5a6577">W, v, b</text>
<line x1="375" y1="270" x2="375" y2="217" stroke="#1a2230" stroke-width="2" marker-end="url(#a)"/><text x="375" y="290" font-size="13" text-anchor="middle" fill="#1a2230">u1</text>
<line x1="375" y1="143" x2="375" y2="108" stroke="#1a2230" stroke-width="2" marker-end="url(#a)"/><text x="375" y="98" font-size="13" text-anchor="middle" fill="#1a2230">output 1</text>
<circle cx="444" cy="180" r="24" fill="#ffffff" stroke="#c0392b" stroke-width="2"/><text x="444" y="185" font-size="14" text-anchor="middle" fill="#1a2230">h1</text>
<line x1="420" y1="180" x2="420" y2="180" stroke="none"/>
<line x1="468" y1="180" x2="520" y2="180" stroke="#c0392b" stroke-width="2" marker-end="url(#o)"/>
<rect x="520" y="145" width="90" height="70" rx="10" fill="#eef1f6" stroke="#9aa5b5" stroke-width="2"/>
<text x="565" y="177" font-size="13" text-anchor="middle" fill="#1a2230" font-weight="600">cell</text><text x="565" y="197" font-size="11" text-anchor="middle" fill="#5a6577">W, v, b</text>
<line x1="565" y1="270" x2="565" y2="217" stroke="#1a2230" stroke-width="2" marker-end="url(#a)"/><text x="565" y="290" font-size="13" text-anchor="middle" fill="#1a2230">u2</text>
<line x1="565" y1="143" x2="565" y2="108" stroke="#1a2230" stroke-width="2" marker-end="url(#a)"/><text x="565" y="98" font-size="13" text-anchor="middle" fill="#1a2230">output 2</text>
<circle cx="634" cy="180" r="24" fill="#ffffff" stroke="#c0392b" stroke-width="2"/><text x="634" y="185" font-size="14" text-anchor="middle" fill="#1a2230">h2</text>
<line x1="610" y1="180" x2="610" y2="180" stroke="none"/>
<line x1="658" y1="180" x2="710" y2="180" stroke="#c0392b" stroke-width="2" marker-end="url(#o)"/>
<rect x="710" y="145" width="90" height="70" rx="10" fill="#eef1f6" stroke="#9aa5b5" stroke-width="2"/>
<text x="755" y="177" font-size="13" text-anchor="middle" fill="#1a2230" font-weight="600">cell</text><text x="755" y="197" font-size="11" text-anchor="middle" fill="#5a6577">W, v, b</text>
<line x1="755" y1="270" x2="755" y2="217" stroke="#1a2230" stroke-width="2" marker-end="url(#a)"/><text x="755" y="290" font-size="13" text-anchor="middle" fill="#1a2230">u3</text>
<line x1="755" y1="143" x2="755" y2="108" stroke="#1a2230" stroke-width="2" marker-end="url(#a)"/><text x="755" y="98" font-size="13" text-anchor="middle" fill="#1a2230">output 3</text>
<circle cx="824" cy="180" r="24" fill="#ffffff" stroke="#c0392b" stroke-width="2"/><text x="824" y="185" font-size="14" text-anchor="middle" fill="#1a2230">h3</text>
<line x1="800" y1="180" x2="800" y2="180" stroke="none"/>
<text x="520" y="335" font-size="13" text-anchor="middle" fill="#1a2230">h_k = tanh(W h_(k-1) + v u_k + b): each new state depends on the previous state and the new input</text>
</svg>
