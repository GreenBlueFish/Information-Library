<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" width="680" height="350" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Delay-locked loop: four voltage-controlled delay stages with a phase detector comparing input and last tap</title>
<rect width="680" height="350" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">Delay-locked loop</text>
<path d="M43.5 105 H48" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="40" cy="105" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="6.9" y="110" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">C</text>
<text x="14.2" y="110" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">K</text>
<text x="21.5" y="113.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">in</text>
<path d="M48 105 H100" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="80" cy="105" r="3.5" fill="#1a2230"/>
<rect x="100" y="80" width="60" height="50" rx="0" fill="#eef1f6"/>
<path d="M100 80 H160 V130 H100 Z" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="130.0" y="110.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">τ</text>
<path d="M160 105 H220" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="190" cy="105" r="3.5" fill="#1a2230"/>
<text x="190" y="96" font-size="11" text-anchor="middle" fill="#5a6577">CK1</text>
<path d="M130 170 V130" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="220" y="80" width="60" height="50" rx="0" fill="#eef1f6"/>
<path d="M220 80 H280 V130 H220 Z" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="250.0" y="110.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">τ</text>
<path d="M280 105 H340" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="310" cy="105" r="3.5" fill="#1a2230"/>
<text x="310" y="96" font-size="11" text-anchor="middle" fill="#5a6577">CK2</text>
<path d="M250 170 V130" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="340" y="80" width="60" height="50" rx="0" fill="#eef1f6"/>
<path d="M340 80 H400 V130 H340 Z" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="370.0" y="110.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">τ</text>
<path d="M400 105 H460" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="430" cy="105" r="3.5" fill="#1a2230"/>
<text x="430" y="96" font-size="11" text-anchor="middle" fill="#5a6577">CK3</text>
<path d="M370 170 V130" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="460" y="80" width="60" height="50" rx="0" fill="#eef1f6"/>
<path d="M460 80 H520 V130 H460 Z" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="490.0" y="110.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">τ</text>
<path d="M490 170 V130" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M520 105 H620" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="590" cy="105" r="3.5" fill="#1a2230"/>
<path d="M620 105 H624.5" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="628" cy="105" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="636" y="110" font-size="13" text-anchor="start" fill="#1a2230">CK4</text>
<path d="M130 170 H490" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="250" cy="170" r="3.5" fill="#1a2230"/>
<circle cx="370" cy="170" r="3.5" fill="#1a2230"/>
<circle cx="320" cy="170" r="3.5" fill="#1a2230"/>
<rect x="240" y="220" width="160" height="60" rx="0" fill="#eef1f6"/>
<path d="M240 220 H400 V280 H240 Z" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="320.0" y="255.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">PD / CP / LPF</text>
<path d="M320 220 V170" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M80 105 V250 H240" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M590 105 V250 H400" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="330.0" y="190" font-size="12" text-anchor="start" fill="#5a6577" xml:space="preserve">V</text>
<text x="336.7" y="193.0" font-size="8.6" text-anchor="start" fill="#5a6577" xml:space="preserve">cont</text>
<text x="340.0" y="320" font-size="12" text-anchor="middle" fill="#5a6577">The loop adjusts the stage delay until CK4 lines up with CKin: the line delays the clock by</text>
<text x="340.0" y="336" font-size="12" text-anchor="middle" fill="#5a6577">exactly one period, so the taps are Tin/4 apart.</text>

</svg>
