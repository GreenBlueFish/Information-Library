<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 415" width="660" height="415" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Sketch of a FinFET with a vertical silicon fin and a gate wrapping over it</title>
<rect width="660" height="415" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">A FinFET: the gate wraps three sides of a fin</text>
<polygon points="80,300 520,300 580,265 140,265" fill="#e3e7ee" stroke="#1a2230" stroke-width="1.5"/>
<polygon points="80,300 520,300 520,330 80,330" fill="#d3d9e3" stroke="#1a2230" stroke-width="1.5"/>
<polygon points="110,300 500,300 500,170 110,170" fill="#cfe0ff" stroke="#2f6fed" stroke-width="1.5"/>
<polygon points="110,170 500,170 515.6,149.0 125.6,149.0" fill="#b9d1fb" stroke="#2f6fed" stroke-width="1.5"/>
<polygon points="252,300 348,300 348,145 252,145" fill="#f4c9c9" stroke="#b33" stroke-width="1.5"/>
<polygon points="252,145 348,145 402.0,113.5 306.0,113.5" fill="#eab3b3" stroke="#b33" stroke-width="1.5"/>
<polygon points="348,300 348,145 402.0,113.5 402.0,268.5" fill="#e6a6a6" stroke="#b33" stroke-width="1.5"/>
<text x="160" y="240" font-size="13" text-anchor="middle" fill="#2f6fed" font-weight="600">source</text>
<text x="440" y="240" font-size="13" text-anchor="middle" fill="#2f6fed" font-weight="600">drain</text>
<text x="300" y="230" font-size="13" text-anchor="middle" fill="#7a1f1f" font-weight="600">gate</text>
<path d="M560 170 L560 300" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M560 300 L556.1 291.9 L563.9 291.9 z" fill="#5a6577"/>
<path d="M560 300 L560 170" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M560 170 L563.9 178.1 L556.1 178.1 z" fill="#5a6577"/>
<text x="572" y="236" font-size="13" text-anchor="start" fill="#1a2230">fin</text>
<text x="572" y="252" font-size="13" text-anchor="start" fill="#1a2230">height</text>
<text x="300" y="350" font-size="12" text-anchor="middle" fill="#5a6577">substrate</text>
<text x="330.0" y="380" font-size="12" text-anchor="middle" fill="#5a6577">Current flows along the fin on its top and both side walls, so the effective width is W = WF</text>
<text x="330.0" y="396" font-size="12" text-anchor="middle" fill="#5a6577">+ 2 HF per fin. More width means more fins.</text>

</svg>
