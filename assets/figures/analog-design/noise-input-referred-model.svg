<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>A source with impedance ZS feeds a series noise voltage source and a shunt noise current source, followed by a noiseless copy of the circuit</title>
<rect width="600" height="340" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">Input-referred noise: a voltage source and a current source</text>
<path d="M53.5 140 H58" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="50" cy="140" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="26.3" y="145" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="35.4" y="148.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">S</text>
<path d="M58 140 H70" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M70.0 140 H80.0 l5 -8 l10 16 l10 -16 l10 16 l5 -8 H130.0" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="92.2" y="124" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">Z</text>
<text x="101.3" y="127.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">S</text>
<path d="M130 140 H160" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="190" cy="140" r="14" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<path d="M180 140 H187 M183.5 136.5 V143.5" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M193 140 H200" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M160 140 H176" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M204 140 H220" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M220 140 H330" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="270" cy="140" r="3.5" fill="#1a2230"/>
<circle cx="270" cy="185" r="15" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<path d="M270 176 V194" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M265 189 L270 195 L275 189" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M270 140 V170" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M270 200 V230" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M270 230 V238" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M258 238 H282 M262 244 H278 M266 250 H274" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<rect x="330" y="100" width="130" height="80" rx="4" fill="#eef1f6"/>
<path d="M330 100 H460 V180 H330 Z" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="395" y="137" font-size="13" text-anchor="middle" fill="#1a2230" font-weight="600">noiseless</text>
<text x="395" y="155" font-size="13" text-anchor="middle" fill="#1a2230" font-weight="600">circuit</text>
<path d="M460 140 H532" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M532 140 H536.5" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="540" cy="140" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="548.0" y="145" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="557.1" y="148.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">out</text>
<text x="176.8" y="112" font-size="13" fill="#1a2230" xml:space="preserve">V</text>
<text x="185.9" y="115.6" font-size="9.4" fill="#1a2230">n,in</text>
<text x="185.9" y="106.1" font-size="9.4" fill="#1a2230">2</text>
<text x="292.0" y="190" font-size="13" fill="#1a2230" xml:space="preserve">I</text>
<text x="296.7" y="193.6" font-size="9.4" fill="#1a2230">n,in</text>
<text x="296.7" y="184.1" font-size="9.4" fill="#1a2230">2</text>
<text x="300.0" y="285" font-size="12" text-anchor="middle" fill="#5a6577">Short the input to find the voltage source (the current source is bypassed); open</text>
<text x="300.0" y="301" font-size="12" text-anchor="middle" fill="#5a6577">it to find the current source (the voltage source carries no current). Both are</text>
<text x="300.0" y="317" font-size="12" text-anchor="middle" fill="#5a6577">needed whenever the circuit is driven from a finite source impedance.</text>

</svg>
