<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 295" width="640" height="295" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Block diagram of a two-stage op amp with Miller capacitor</title>
<rect width="640" height="295" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">Two-stage op amp with Miller compensation</text>
<path d="M63.5 150 H68" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="60" cy="150" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="34.2" y="155" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="41.5" y="158.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">in</text>
<path d="M68 150 L118 150" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M118 150 L109.9 153.9 L109.9 146.1 z" fill="#1a2230"/>
<rect x="120" y="100" width="130" height="100" rx="6" fill="#eef1f6" stroke="#5a6577" stroke-width="1.5"/>
<text x="185.0" y="148.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">Stage 1</text>
<text x="185.0" y="165.0" font-size="11" text-anchor="middle" fill="#5a6577">gm1, R1 (differential)</text>
<path d="M250 150 L350 150" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M350 150 L341.9 153.9 L341.9 146.1 z" fill="#1a2230"/>
<circle cx="300" cy="150" r="3.5" fill="#1a2230"/>
<rect x="350" y="100" width="130" height="100" rx="6" fill="#eef1f6" stroke="#5a6577" stroke-width="1.5"/>
<text x="415.0" y="148.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">Stage 2</text>
<text x="415.0" y="165.0" font-size="11" text-anchor="middle" fill="#5a6577">gm2, R2 (common source)</text>
<path d="M480 150 L550 150" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M550 150 L541.9 153.9 L541.9 146.1 z" fill="#1a2230"/>
<path d="M550 150 H554.5" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="558" cy="150" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="566.0" y="155" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="573.3" y="158.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">out</text>
<path d="M300 150 V70 H515 V150" fill="none" stroke="#2f6fed" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="515" cy="150" r="3.5" fill="#2f6fed"/>
<rect x="395" y="58" width="40" height="24" fill="#ffffff"/>
<path d="M405 62 V78 M415 62 V78" fill="none" stroke="#2f6fed" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="403.7" y="50" font-size="13" text-anchor="start" fill="#2f6fed" xml:space="preserve">C</text>
<text x="411.0" y="53.2" font-size="9.4" text-anchor="start" fill="#2f6fed" xml:space="preserve">c</text>
<text x="57.1" y="250" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">The compensation capacitor </text>
<text x="253.7" y="250" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">C</text>
<text x="261.0" y="253.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">c</text>
<text x="266.2" y="250" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve"> is connected around the second stage.</text>
<text x="320.0" y="272" font-size="12" text-anchor="middle" fill="#5a6577">Miller effect makes it look much bigger at the first stage output, creating a low</text>
<text x="320.0" y="288" font-size="12" text-anchor="middle" fill="#5a6577">dominant pole.</text>

</svg>
