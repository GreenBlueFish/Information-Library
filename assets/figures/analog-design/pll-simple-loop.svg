<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" width="700" height="290" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Block diagram of a phase detector, low-pass filter and VCO in a loop</title>
<rect width="700" height="290" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">The simple (type I) PLL</text>
<path d="M53.5 120 H58" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="50" cy="120" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="24.2" y="125" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="31.5" y="128.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">in</text>
<path d="M58 120 L130 120" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M130 120 L121.9 123.9 L121.9 116.1 z" fill="#1a2230"/>
<rect x="130" y="90" width="90" height="60" rx="0" fill="#eef1f6"/>
<path d="M130 90 H220 V150 H130 Z" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="175.0" y="125.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">PD</text>
<path d="M220 120 L280 120" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M280 120 L271.9 123.9 L271.9 116.1 z" fill="#1a2230"/>
<rect x="280" y="90" width="100" height="60" rx="0" fill="#eef1f6"/>
<path d="M280 90 H380 V150 H280 Z" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="330.0" y="125.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">LPF</text>
<path d="M380 120 L440 120" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M440 120 L431.9 123.9 L431.9 116.1 z" fill="#1a2230"/>
<rect x="440" y="90" width="100" height="60" rx="0" fill="#eef1f6"/>
<path d="M440 90 H540 V150 H440 Z" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="490.0" y="125.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">VCO</text>
<path d="M540 120 L620 120" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M620 120 L611.9 123.9 L611.9 116.1 z" fill="#1a2230"/>
<circle cx="580" cy="120" r="3.5" fill="#1a2230"/>
<path d="M620 120 H624.5" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="628" cy="120" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="636.0" y="125" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="643.3" y="128.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">out</text>
<path d="M580 120 V210 H175" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M175 210 L175 150" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M175 150 L178.9 158.1 L171.1 158.1 z" fill="#1a2230"/>
<text x="241.8" y="110" font-size="12" text-anchor="start" fill="#5a6577" xml:space="preserve">V</text>
<text x="248.5" y="113.0" font-size="8.6" text-anchor="start" fill="#5a6577" xml:space="preserve">PD</text>
<text x="397.0" y="110" font-size="12" text-anchor="start" fill="#5a6577" xml:space="preserve">V</text>
<text x="403.7" y="113.0" font-size="8.6" text-anchor="start" fill="#5a6577" xml:space="preserve">cont</text>
<text x="350.0" y="255" font-size="12" text-anchor="middle" fill="#5a6577">The PD output's average tracks the phase difference; the LPF passes that average and removes the</text>
<text x="350.0" y="271" font-size="12" text-anchor="middle" fill="#5a6577">ripple; the VCO turns the control voltage back into phase.</text>

</svg>
