<text x="573.3" y="68.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">out</text>
<text x="320.0" y="440" font-size="12" text-anchor="middle" fill="#5a6577">The op amp forces X and Y to the same voltage, so VBE1 − VBE2 = VT ln n appears across</text>
<text x="320.0" y="456" font-size="12" text-anchor="middle" fill="#5a6577">R3. Vout = VBE2 + (1 + R2/R3) VT ln n.</text>

