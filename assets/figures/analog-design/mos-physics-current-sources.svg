<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 345" width="640" height="345" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>An NMOS current sink and a PMOS current source, each with a fixed gate bias</title>
<rect width="640" height="345" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">Saturated MOSFETs as current sources</text>
<circle cx="170" cy="60" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="180" y="65" font-size="13" text-anchor="start" fill="#1a2230">to the circuit</text>
<path d="M170 64 V110" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M186 85 L186 112" fill="none" stroke="#1a2230" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M186 112 L182.1 103.9 L189.9 103.9 z" fill="#1a2230"/>
<text x="196.0" y="102" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">I</text>
<text x="203.3" y="105.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">1</text>
<path d="M110 150 H140" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M140 134 V166" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M146 132 V144 M146 146 V154 M146 156 V168" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M146 138 H170 V110" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M146 162 H170 V190" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M162 162 L154 157.5 V166.5 z" fill="#1a2230"/>
<text x="182" y="155" font-size="13" text-anchor="start" fill="#1a2230">M1</text>
<path d="M110 150 H86" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="82" cy="150" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="59.5" y="155" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="66.7" y="158.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">b</text>
<path d="M170 190 V200" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M170 200 V208" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M158 208 H182 M162 214 H178 M166 220 H174" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="170" y="280" font-size="13" text-anchor="middle" fill="#1a2230" font-weight="600">NMOS sinks current to ground</text>
<path d="M470 50 V62" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M458 50 H482" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="486" y="54" font-size="13" text-anchor="start" fill="#1a2230">VDD</text>
<path d="M470 62 V110" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M410 150 H440" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M440 134 V166" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M446 132 V144 M446 146 V154 M446 156 V168" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M446 138 H470 V110" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M446 162 H470 V190" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M448 138 L456 133.5 V142.5 z" fill="#1a2230"/>
<text x="482" y="155" font-size="13" text-anchor="start" fill="#1a2230">M2</text>
<path d="M410 150 H386" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="382" cy="150" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="359.5" y="155" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="366.7" y="158.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">b</text>
<path d="M470 190 V236" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="470" cy="240" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="480" y="245" font-size="13" text-anchor="start" fill="#1a2230">to the circuit</text>
<path d="M486 200 L486 228" fill="none" stroke="#1a2230" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M486 228 L482.1 219.9 L489.9 219.9 z" fill="#1a2230"/>
<text x="496.0" y="220" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">I</text>
<text x="503.3" y="223.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">2</text>
<text x="470" y="280" font-size="13" text-anchor="middle" fill="#1a2230" font-weight="600">PMOS sources current from VDD</text>
<text x="320.0" y="305" font-size="12" text-anchor="middle" fill="#5a6577">Only one end of each source is free: the other is tied to a supply. A current source</text>
<text x="320.0" y="321" font-size="12" text-anchor="middle" fill="#5a6577">between two arbitrary nodes is much harder to build.</text>

</svg>
