<text x="338.5" y="290" font-size="13" text-anchor="start" fill="#b00020" xml:space="preserve">V</text>
<text x="345.7" y="293.2" font-size="9.4" text-anchor="start" fill="#b00020" xml:space="preserve">sub</text>
<path d="M350 300 V330" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M350 330 V336 a6 6 0 0 1 0 12 a6 6 0 0 1 0 12 a6 6 0 0 1 0 12 V390" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="366.0" y="365" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">L</text>
