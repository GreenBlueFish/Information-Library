<path d="M218 186 H242 M218 194 H242" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="248.0" y="195" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">C</text>
<text x="255.3" y="198.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">DB2</text>
