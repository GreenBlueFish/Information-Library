<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 490" width="660" height="490" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Switching transistor coupling into the substrate node, which has a bond-wire inductance to ground and drives the body of an analog transistor</title>
<rect width="660" height="490" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">Substrate noise reaches an analog transistor through its body</text>
