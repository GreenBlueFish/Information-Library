<circle cx="548" cy="140" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="556.0" y="145" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="563.3" y="148.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">out</text>
<path d="M410 190 H440" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M440 174 V206" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M446 172 V184 M446 186 V194 M446 196 V208" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M446 178 H470 V150" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M446 202 H470 V230" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M462 202 L454 197.5 V206.5 z" fill="#1a2230"/>
<text x="482" y="195" font-size="13" text-anchor="start" fill="#1a2230"></text>
<text x="428" y="168" font-size="13" text-anchor="end" fill="#1a2230">M1</text>
<path d="M410 190 H380" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M375.5 190 H380" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="372" cy="190" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="346.2" y="195" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="353.5" y="198.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">in</text>
<path d="M470 230 V238" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M458 238 H482 M462 244 H478 M466 250 H474" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M446 190 H520 V300 H470" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="528" y="250" font-size="12" text-anchor="start" fill="#5a6577">body</text>
<text x="330.0" y="450" font-size="12" text-anchor="middle" fill="#5a6577">Each clock edge on M2's drain kicks the substrate through its junction capacitance; the</text>
<text x="330.0" y="466" font-size="12" text-anchor="middle" fill="#5a6577">bond-wire inductance keeps the substrate from staying at ground. M1's threshold follows Vsub</text>
<text x="330.0" y="482" font-size="12" text-anchor="middle" fill="#5a6577">through body effect, so the kick appears at Vout like an input signal.</text>

</svg>
