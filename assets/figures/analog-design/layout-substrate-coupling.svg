<path d="M126 202 H150 V230" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M142 202 L134 197.5 V206.5 z" fill="#1a2230"/>
<text x="162" y="195" font-size="13" text-anchor="start" fill="#1a2230">M2</text>
<path d="M90 190 H60" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M55.5 190 H60" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="52" cy="190" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
