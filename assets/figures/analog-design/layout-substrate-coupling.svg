<path d="M350 400 V408" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M338 408 H362 M342 414 H358 M346 420 H354" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M470 50 V62" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M458 50 H482" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="486" y="54" font-size="13" text-anchor="start" fill="#1a2230">VDD</text>
<path d="M470 62 V70" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M470 70.0 V80.0 l8 5 l-16 10 l16 10 l-16 10 l8 5 V130.0" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="486.0" y="105" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">R</text>
<text x="493.3" y="108.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">D</text>
<path d="M470 130 V150" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
