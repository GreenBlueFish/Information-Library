<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 355" width="640" height="355" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Carrier and two sidebands at the VCO output</title>
<rect width="640" height="355" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">Small sinusoidal control voltage: spectrum of the VCO output</text>
<path d="M80 260 L570 260" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M570 260 L561.9 263.9 L561.9 256.1 z" fill="#5a6577"/>
<text x="566" y="286" font-size="13" text-anchor="end" fill="#1a2230">ω</text>
<path d="M320.0 260 V90" fill="none" stroke="#2f6fed" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<circle cx="320.0" cy="90" r="4" fill="#2f6fed"/>
<text x="320.0" y="280" font-size="12" text-anchor="middle" fill="#1a2230">ω0</text>
<path d="M200.0 260 V209.0" fill="none" stroke="#2f6fed" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<circle cx="200.0" cy="209.0" r="4" fill="#2f6fed"/>
<text x="200.0" y="280" font-size="12" text-anchor="middle" fill="#1a2230">ω0 − ωm</text>
<path d="M440.0 260 V209.0" fill="none" stroke="#2f6fed" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<circle cx="440.0" cy="209.0" r="4" fill="#2f6fed"/>
<text x="440.0" y="280" font-size="12" text-anchor="middle" fill="#1a2230">ω0 + ωm</text>
<text x="148.0" y="195.0" font-size="11" text-anchor="start" fill="#5a6577" xml:space="preserve">K</text>
<text x="154.2" y="197.8" font-size="7.9" text-anchor="start" fill="#5a6577" xml:space="preserve">VCO</text>
<text x="167.5" y="195.0" font-size="11" text-anchor="start" fill="#5a6577" xml:space="preserve"> </text>
<text x="173.6" y="195.0" font-size="11" text-anchor="start" fill="#5a6577" xml:space="preserve">V</text>
<text x="179.8" y="197.8" font-size="7.9" text-anchor="start" fill="#5a6577" xml:space="preserve">m</text>
<text x="184.2" y="195.0" font-size="11" text-anchor="start" fill="#5a6577" xml:space="preserve"> V0 / (2ωm)</text>
<text x="338.0" y="94" font-size="12" text-anchor="start" fill="#5a6577">V0</text>
<text x="320.0" y="320" font-size="12" text-anchor="middle" fill="#5a6577">With Vcont = Vm cos ωm t and KVCO Vm/ωm ≪ 1 rad, the output is the carrier plus two</text>
<text x="320.0" y="336" font-size="12" text-anchor="middle" fill="#5a6577">sidebands ωm away: the VCO acts as a frequency modulator.</text>

</svg>
