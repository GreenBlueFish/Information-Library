<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>The analog design octagon of competing specifications</title>
<rect width="660" height="400" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">The analog design octagon</text>
<polygon points="375.9,104.1 440.9,169.1 440.9,260.9 375.9,325.9 284.1,325.9 219.1,260.9 219.1,169.1 284.1,104.1" fill="#eef1f6" stroke="#2f6fed" stroke-width="2"/>
<circle cx="375.9220118838108" cy="104.13445609864559" r="4" fill="#2f6fed"/>
<text x="387.9220118838108" y="94.13445609864559" font-size="14" text-anchor="start" fill="#1a2230" font-weight="600">Gain</text>
<circle cx="440.8655439013544" cy="169.07798811618923" r="4" fill="#2f6fed"/>
<text x="452.8655439013544" y="174.07798811618923" font-size="14" text-anchor="start" fill="#1a2230" font-weight="600">Speed</text>
<circle cx="440.8655439013544" cy="260.9220118838108" r="4" fill="#2f6fed"/>
<text x="452.8655439013544" y="265.9220118838108" font-size="14" text-anchor="start" fill="#1a2230" font-weight="600">Power dissipation</text>
<circle cx="375.9220118838108" cy="325.8655439013544" r="4" fill="#2f6fed"/>
<text x="387.9220118838108" y="347.8655439013544" font-size="14" text-anchor="start" fill="#1a2230" font-weight="600">Supply voltage</text>
<circle cx="284.0779881161892" cy="325.8655439013544" r="4" fill="#2f6fed"/>
<text x="272.0779881161892" y="347.8655439013544" font-size="14" text-anchor="end" fill="#1a2230" font-weight="600">Linearity</text>
<circle cx="219.1344560986456" cy="260.9220118838108" r="4" fill="#2f6fed"/>
<text x="207.1344560986456" y="265.9220118838108" font-size="14" text-anchor="end" fill="#1a2230" font-weight="600">Noise</text>
<circle cx="219.13445609864556" cy="169.07798811618923" r="4" fill="#2f6fed"/>
<text x="207.13445609864556" y="174.07798811618923" font-size="14" text-anchor="end" fill="#1a2230" font-weight="600">Input/output impedance</text>
<circle cx="284.07798811618926" cy="104.13445609864557" r="4" fill="#2f6fed"/>
<text x="272.07798811618926" y="94.13445609864557" font-size="14" text-anchor="end" fill="#1a2230" font-weight="600">Voltage swings</text>
<text x="330.0" y="375" font-size="12" text-anchor="middle" fill="#5a6577">Eight competing specifications: improving one usually costs one or more of the others.</text>

</svg>
