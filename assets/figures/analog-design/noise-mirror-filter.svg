<text x="280.0" y="320" font-size="12" text-anchor="middle" fill="#5a6577">The diode-connected device's flicker noise reaches M1's gate through a low-</text>
<text x="280.0" y="336" font-size="12" text-anchor="middle" fill="#5a6577">pass filter with corner 1/[(1/gm,REF + RB) CB]. RB lets a modest CB do the</text>
<text x="280.0" y="352" font-size="12" text-anchor="middle" fill="#5a6577">job; RB can be a long, narrow MOSFET biased in triode.</text>
