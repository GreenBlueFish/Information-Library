<text x="344" y="386" font-size="12" text-anchor="start" fill="#5a6577">amplifier</text>
<text x="280.0" y="520" font-size="12" text-anchor="middle" fill="#5a6577">Both halves have output resistance of order gm ro², so the gain is of order</text>
<text x="280.0" y="536" font-size="12" text-anchor="middle" fill="#5a6577">(gm ro)² / 2. The output can only move within VDD minus four overdrives.</text>

