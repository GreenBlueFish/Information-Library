<path d="M288 48 H312" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="316" y="52" font-size="13" text-anchor="start" fill="#1a2230">VDD</text>
<path d="M300 60 V70" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M300 70.0 V80.0 l8 5 l-16 10 l16 10 l-16 10 l8 5 V130.0" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="316.0" y="105" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">R</text>
<text x="323.3" y="108.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">D</text>
<path d="M300 130 V150" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="300" cy="150" r="3.5" fill="#1a2230"/>
<path d="M300 150 H452" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M452 150 H456.5" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="460" cy="150" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="468.0" y="155" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="475.3" y="158.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">out</text>
<path d="M240 190 H270" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M270 174 V206" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M276 172 V184 M276 186 V194 M276 196 V208" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M276 178 H300 V150" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M276 202 H300 V230" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M292 202 L284 197.5 V206.5 z" fill="#1a2230"/>
<text x="312" y="195" font-size="13" text-anchor="start" fill="#1a2230">M1</text>
<path d="M300 230 V238" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M288 238 H312 M292 244 H308 M296 250 H304" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M130 190 H240" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="200" cy="190" r="3.5" fill="#1a2230"/>
<path d="M130 190 V195" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="130" cy="240" r="15" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<path d="M130 249 V231" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M125 236 L130 230 L135 236" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M130 195 V225" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M130 255 V285" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="91.2" y="245" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">I</text>
<text x="98.5" y="248.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">in</text>
<path d="M130 285 V293" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M118 293 H142 M122 299 H138 M126 305 H134" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M200 190 V300 H270" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M270 300 H280 l5 -8 l10 16 l10 -16 l10 16 l5 -8 H330" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="293.7" y="286" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">R</text>
<text x="301.0" y="289.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">F</text>
<path d="M330 300 H400 V150" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="400" cy="150" r="3.5" fill="#1a2230"/>
<text x="280.0" y="345" font-size="12" text-anchor="middle" fill="#5a6577">RF senses the output voltage and returns a current to the gate node. Loop</text>
<text x="280.0" y="361" font-size="12" text-anchor="middle" fill="#5a6577">gain gm RD (if RF ≫ RD); Rin = RF/(1 + gm RD), Rout = RD/(1 + gm RD),</text>
<text x="280.0" y="377" font-size="12" text-anchor="middle" fill="#5a6577">Vout/Iin ≈ −RF.</text>

</svg>
