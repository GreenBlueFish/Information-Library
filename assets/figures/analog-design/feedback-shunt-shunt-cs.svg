<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Common-source stage with a feedback resistor from drain to gate driven by an input current</title>
<rect width="560" height="400" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">Shunt-shunt feedback: a resistor from drain to gate</text>
