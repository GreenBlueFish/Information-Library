<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Cross-section of an NMOS and a PMOS transistor with substrate and well ties</title>
<rect width="760" height="400" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">Cross-section of a twin-device CMOS process</text>
<rect x="40" y="160" width="680" height="160" fill="#eef1f6" stroke="#5a6577" stroke-width="1.2"/>
<rect x="380" y="160" width="330" height="110" fill="#f6e7c8" stroke="#5a6577" stroke-width="1.2"/>
<rect x="110" y="160" width="30" height="40" fill="#d6dbe3" stroke="#5a6577" stroke-width="1.2"/>
<rect x="330" y="160" width="70" height="40" fill="#d6dbe3" stroke="#5a6577" stroke-width="1.2"/>
<rect x="620" y="160" width="30" height="40" fill="#d6dbe3" stroke="#5a6577" stroke-width="1.2"/>
<rect x="60" y="160" width="50" height="28" fill="#f7cfd4" stroke="#5a6577" stroke-width="1.2"/>
<text x="85" y="179" font-size="12" text-anchor="middle" fill="#1a2230" font-weight="600">p+</text>
<rect x="150" y="160" width="50" height="28" fill="#cfe0ff" stroke="#5a6577" stroke-width="1.2"/>
<rect x="270" y="160" width="50" height="28" fill="#cfe0ff" stroke="#5a6577" stroke-width="1.2"/>
<text x="175" y="179" font-size="12" text-anchor="middle" fill="#1a2230" font-weight="600">n+</text>
<text x="295" y="179" font-size="12" text-anchor="middle" fill="#1a2230" font-weight="600">n+</text>
<rect x="420" y="160" width="50" height="28" fill="#f7cfd4" stroke="#5a6577" stroke-width="1.2"/>
<rect x="540" y="160" width="50" height="28" fill="#f7cfd4" stroke="#5a6577" stroke-width="1.2"/>
<text x="445" y="179" font-size="12" text-anchor="middle" fill="#1a2230" font-weight="600">p+</text>
<text x="565" y="179" font-size="12" text-anchor="middle" fill="#1a2230" font-weight="600">p+</text>
<rect x="655" y="160" width="45" height="28" fill="#cfe0ff" stroke="#5a6577" stroke-width="1.2"/>
<text x="677" y="179" font-size="12" text-anchor="middle" fill="#1a2230" font-weight="600">n+</text>
<rect x="200" y="154" width="70" height="6" fill="#d6dbe3" stroke="#5a6577" stroke-width="1.2"/>
<rect x="200" y="128" width="70" height="26" fill="#b8c2d3" stroke="#1a2230" stroke-width="1.2"/>
<rect x="470" y="154" width="70" height="6" fill="#d6dbe3" stroke="#5a6577" stroke-width="1.2"/>
<rect x="470" y="128" width="70" height="26" fill="#b8c2d3" stroke="#1a2230" stroke-width="1.2"/>
<path d="M85 160 V100" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="85" y="92" font-size="12" text-anchor="middle" fill="#1a2230">B (GND)</text>
<path d="M175 160 V100" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="175" y="92" font-size="12" text-anchor="middle" fill="#1a2230">S</text>
<path d="M235 128 V100" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="235" y="92" font-size="12" text-anchor="middle" fill="#1a2230">G</text>
<path d="M295 160 V100" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="295" y="92" font-size="12" text-anchor="middle" fill="#1a2230">D</text>
<path d="M445 160 V100" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="445" y="92" font-size="12" text-anchor="middle" fill="#1a2230">S</text>
<path d="M505 128 V100" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="505" y="92" font-size="12" text-anchor="middle" fill="#1a2230">G</text>
<path d="M565 160 V100" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="565" y="92" font-size="12" text-anchor="middle" fill="#1a2230">D</text>
<path d="M677 160 V100" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="677" y="92" font-size="12" text-anchor="middle" fill="#1a2230">well (VDD)</text>
<text x="235" y="60" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">NMOS</text>
<text x="505" y="60" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">PMOS</text>
<text x="545" y="255" font-size="13" text-anchor="middle" fill="#8a6a1e">n-well</text>
<text x="200" y="290" font-size="13" text-anchor="middle" fill="#5a6577">p-substrate</text>
<text x="365" y="220" font-size="12" text-anchor="middle" fill="#5a6577">STI</text>
<text x="380.0" y="350" font-size="12" text-anchor="middle" fill="#5a6577">The PMOS sits in an n-well tied to VDD; the substrate is tied to ground by p+ contacts. Trench oxide (STI)</text>
<text x="380.0" y="366" font-size="12" text-anchor="middle" fill="#5a6577">separates the active areas. Each gate is self-aligned: its source and drain were implanted using the gate</text>
<text x="380.0" y="382" font-size="12" text-anchor="middle" fill="#5a6577">itself as the mask.</text>

</svg>
