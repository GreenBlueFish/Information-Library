<text x="280.0" y="340" font-size="12" text-anchor="middle" fill="#5a6577">C1 and C2 return a fraction of Vout to the gate. With a large gm rO the gain</text>
<text x="280.0" y="356" font-size="12" text-anchor="middle" fill="#5a6577">is close to −C1/C2, a ratio of two capacitors.</text>

