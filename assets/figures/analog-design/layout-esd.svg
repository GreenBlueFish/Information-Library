<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 385" width="640" height="385" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Input pad through series resistor to a node with diodes to VDD and ground</title>
<rect width="640" height="385" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">A basic ESD protection network at an input pad</text>
<path d="M83.5 200 H88" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="80" cy="200" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="72" y="205" font-size="13" text-anchor="end" fill="#1a2230">pad</text>
<path d="M88 200 H140" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M140 200 H165.0 l5 -8 l10 16 l10 -16 l10 16 l10 -16 l5 8 H240" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="190.0" y="186" font-size="13" text-anchor="middle" fill="#1a2230">R1</text>
<path d="M240 200 H300" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="300" cy="200" r="3.5" fill="#1a2230"/>
<path d="M300 200 H420" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M420 200 H424.5" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="428" cy="200" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="436" y="205" font-size="13" text-anchor="start" fill="#1a2230">to circuit</text>
<path d="M300 200 V174" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M300 126 V141" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M300 159 V174" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M290 159 H310 L300 142 Z" fill="#ffffff" stroke="#1a2230" stroke-width="2" data-sym="1"/>
<path d="M290 141 H310" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M290 141 H310 M290 159 H310" fill="none" stroke="#1a2230" stroke-width="0.01" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="316" y="155" font-size="13" text-anchor="start" fill="#1a2230">D1</text>
<path d="M300 126 V100" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M300 88 V100" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M288 88 H312" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="316" y="92" font-size="13" text-anchor="start" fill="#1a2230">VDD</text>
<path d="M300 200 V226" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M300 226 V241" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M300 259 V274" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M290 259 H310 L300 242 Z" fill="#ffffff" stroke="#1a2230" stroke-width="2" data-sym="1"/>
<path d="M290 241 H310" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M290 241 H310 M290 259 H310" fill="none" stroke="#1a2230" stroke-width="0.01" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="316" y="255" font-size="13" text-anchor="start" fill="#1a2230">D2</text>
<path d="M300 274 V290" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M300 290 V298" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M288 298 H312 M292 304 H308 M296 310 H304" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="320.0" y="345" font-size="12" text-anchor="middle" fill="#5a6577">A positive zap forward-biases D1 into VDD, a negative one forward-biases D2 from ground,</text>
<text x="320.0" y="361" font-size="12" text-anchor="middle" fill="#5a6577">clamping the node; R1 limits the current. The cost: picofarads of diode capacitance, R1</text>
<text x="320.0" y="377" font-size="12" text-anchor="middle" fill="#5a6577">noise, and supply noise coupled through the diodes.</text>

</svg>
