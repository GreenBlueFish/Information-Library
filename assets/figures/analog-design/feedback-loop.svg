<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" width="600" height="370" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Block diagram of a negative-feedback loop</title>
<rect width="600" height="370" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">The ideal negative-feedback loop</text>
<path d="M63.5 150 H68" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="60" cy="150" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="52" y="155" font-size="13" text-anchor="end" fill="#1a2230">x</text>
<path d="M68 150 L128 150" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M128 150 L119.9 153.9 L119.9 146.1 z" fill="#1a2230"/>
<circle cx="150" cy="150" r="20" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="150" y="155" font-size="16" text-anchor="middle" fill="#1a2230">Σ</text>
<text x="120" y="140" font-size="14" text-anchor="middle" fill="#1a2230">+</text>
<text x="162" y="186" font-size="16" text-anchor="middle" fill="#1a2230">−</text>
<path d="M170 150 L240 150" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M240 150 L231.9 153.9 L231.9 146.1 z" fill="#1a2230"/>
<rect x="240" y="120" width="120" height="60" rx="6" fill="#eef1f6" stroke="#5a6577" stroke-width="1.5"/>
<text x="300.0" y="148.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">A</text>
<text x="300.0" y="165.0" font-size="11" text-anchor="middle" fill="#5a6577">open-loop gain</text>
<path d="M360 150 L470 150" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M470 150 L461.9 153.9 L461.9 146.1 z" fill="#1a2230"/>
<circle cx="420" cy="150" r="3.5" fill="#1a2230"/>
<path d="M470 150 H474.5" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="478" cy="150" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="486" y="155" font-size="13" text-anchor="start" fill="#1a2230">y</text>
<path d="M420 150 V250 H360" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="240" y="220" width="120" height="60" rx="6" fill="#eef1f6" stroke="#5a6577" stroke-width="1.5"/>
<text x="300.0" y="248.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">β</text>
<text x="300.0" y="265.0" font-size="11" text-anchor="middle" fill="#5a6577">feedback network</text>
<path d="M240 250 H150 V215" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M150 215 L150 172" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M150 172 L153.9 180.1 L146.1 180.1 z" fill="#1a2230"/>
<text x="205" y="142" font-size="13" text-anchor="middle" fill="#5a6577">e</text>
<text x="300.0" y="320" font-size="13" text-anchor="middle" fill="#1a2230">y = A·e and e = x − βy, so the closed-loop gain is y/x = A / (1 + Aβ).</text>
<text x="300.0" y="345" font-size="12" text-anchor="middle" fill="#5a6577">When the loop gain Aβ is large, y/x ≈ 1/β: it is set by the feedback network, not</text>
<text x="300.0" y="361" font-size="12" text-anchor="middle" fill="#5a6577">by A.</text>

</svg>
