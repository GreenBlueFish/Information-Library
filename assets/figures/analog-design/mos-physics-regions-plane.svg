<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" width="640" height="410" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>VDS against VGS plane divided into off, saturation and triode regions</title>
<rect width="640" height="410" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">Regions of operation of an NMOS</text>
<path d="M90 330 L582 330" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M582 330 L573.9 333.9 L573.9 326.1 z" fill="#5a6577"/>
<path d="M90 330 L90 58" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M90 58 L93.9 66.1 L86.1 66.1 z" fill="#5a6577"/>
<text x="588.0" y="335" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="595.3" y="338.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">GS</text>
<text x="64.2" y="64" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="71.5" y="67.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">DS</text>
<path d="M210 330 V70" fill="none" stroke="#b00020" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" data-sym="1"/>
<path d="M210 330 V335" fill="none" stroke="#5a6577" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="202.5" y="349" font-size="11" text-anchor="start" fill="#5a6577" xml:space="preserve">V</text>
<text x="208.7" y="351.8" font-size="7.9" text-anchor="start" fill="#5a6577" xml:space="preserve">TH</text>
<path d="M210 330 L570 106.8" fill="none" stroke="#b00020" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="462.9" y="94.80000000000001" font-size="13" text-anchor="start" fill="#b00020" xml:space="preserve">V</text>
<text x="470.2" y="98.00000000000001" font-size="9.4" text-anchor="start" fill="#b00020" xml:space="preserve">DS</text>
<text x="480.7" y="94.80000000000001" font-size="13" text-anchor="start" fill="#b00020" xml:space="preserve"> = </text>
<text x="502.5" y="94.80000000000001" font-size="13" text-anchor="start" fill="#b00020" xml:space="preserve">V</text>
<text x="509.8" y="98.00000000000001" font-size="9.4" text-anchor="start" fill="#b00020" xml:space="preserve">GS</text>
<text x="520.4" y="94.80000000000001" font-size="13" text-anchor="start" fill="#b00020" xml:space="preserve"> − </text>
<text x="542.2" y="94.80000000000001" font-size="13" text-anchor="start" fill="#b00020" xml:space="preserve">V</text>
<text x="549.5" y="98.00000000000001" font-size="9.4" text-anchor="start" fill="#b00020" xml:space="preserve">TH</text>
<text x="150" y="200" font-size="16" text-anchor="middle" fill="#5a6577" font-weight="600">Off</text>
<text x="340" y="130" font-size="16" text-anchor="middle" fill="#2f6fed" font-weight="600">Saturation</text>
<text x="470" y="270" font-size="16" text-anchor="middle" fill="#2f6fed" font-weight="600">Triode</text>
<text x="320.0" y="370" font-size="12" text-anchor="middle" fill="#5a6577">Above the line the channel is pinched off (saturation); below it the channel reaches the</text>
<text x="320.0" y="386" font-size="12" text-anchor="middle" fill="#5a6577">drain (triode). At a fixed VDS, raising VGS eventually drives the device into triode.</text>

</svg>
