<text x="206.2" y="305" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="213.5" y="308.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">in</text>
<path d="M170 170.0 V230.0 L240 200 Z" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="180" y="193" font-size="14" text-anchor="middle" fill="#1a2230">+</text>
<text x="180" y="219" font-size="14" text-anchor="middle" fill="#1a2230">−</text>
<text x="189.2" y="205" font-size="12" text-anchor="start" fill="#5a6577" xml:space="preserve">A</text>
<text x="196.0" y="208.0" font-size="8.6" text-anchor="start" fill="#5a6577" xml:space="preserve">1</text>
<path d="M123.5 188 H128" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="120" cy="188" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="99.5" y="193" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="106.7" y="196.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">b</text>
<path d="M128 188 H170" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M300 250 H150 V212 H170" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="280.0" y="390" font-size="12" text-anchor="middle" fill="#5a6577">A1 compares node P with Vb and drives the cascode gate so that P barely</text>
<text x="280.0" y="406" font-size="12" text-anchor="middle" fill="#5a6577">moves. The output resistance rises to about (A1 + 1) gm2 rO2 rO1 without</text>
<text x="280.0" y="422" font-size="12" text-anchor="middle" fill="#5a6577">stacking another device.</text>

</svg>
