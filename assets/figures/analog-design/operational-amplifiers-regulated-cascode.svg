<path d="M276 288 H300 V260" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M276 312 H300 V340" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M292 312 L284 307.5 V316.5 z" fill="#1a2230"/>
