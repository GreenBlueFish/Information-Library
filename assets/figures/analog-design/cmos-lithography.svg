<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 345" width="780" height="345" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Four panels: resist coating, exposure through a mask, developed window, implantation through the window</title>
<rect width="780" height="345" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">One lithography sequence</text>
<rect x="30" y="170" width="165" height="70" fill="#eef1f6" stroke="#5a6577" stroke-width="1.2"/>
<rect x="30" y="154" width="165" height="16" fill="#9fb7e8" stroke="#5a6577" stroke-width="1.2"/>
<text x="112.5" y="270" font-size="12" text-anchor="middle" fill="#1a2230">1. coat with photoresist</text>
<rect x="215" y="170" width="165" height="70" fill="#eef1f6" stroke="#5a6577" stroke-width="1.2"/>
<rect x="215" y="154" width="165" height="16" fill="#9fb7e8" stroke="#5a6577" stroke-width="1.2"/>
<rect x="210" y="105" width="175" height="10" fill="#ffffff" stroke="#1a2230" stroke-width="1.2"/>
<rect x="265" y="105" width="65" height="10" fill="#1a2230" stroke="#1a2230" stroke-width="1.2"/>
<path d="M230 70 L230 148" fill="none" stroke="#2f6fed" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M230 148 L226.1 139.9 L233.9 139.9 z" fill="#2f6fed"/>
<path d="M245 70 L245 148" fill="none" stroke="#2f6fed" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M245 148 L241.1 139.9 L248.9 139.9 z" fill="#2f6fed"/>
<path d="M350 70 L350 148" fill="none" stroke="#2f6fed" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M350 148 L346.1 139.9 L353.9 139.9 z" fill="#2f6fed"/>
<path d="M365 70 L365 148" fill="none" stroke="#2f6fed" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M365 148 L361.1 139.9 L368.9 139.9 z" fill="#2f6fed"/>
<text x="297.5" y="64" font-size="12" text-anchor="middle" fill="#2f6fed">UV through mask</text>
<text x="297.5" y="270" font-size="12" text-anchor="middle" fill="#1a2230">2. expose through the mask</text>
<rect x="400" y="170" width="165" height="70" fill="#eef1f6" stroke="#5a6577" stroke-width="1.2"/>
<rect x="400" y="154" width="50" height="16" fill="#9fb7e8" stroke="#5a6577" stroke-width="1.2"/>
<rect x="515" y="154" width="50" height="16" fill="#9fb7e8" stroke="#5a6577" stroke-width="1.2"/>
<text x="482.5" y="270" font-size="12" text-anchor="middle" fill="#1a2230">3. develop: window opens</text>
<rect x="585" y="170" width="165" height="70" fill="#eef1f6" stroke="#5a6577" stroke-width="1.2"/>
<rect x="585" y="154" width="50" height="16" fill="#9fb7e8" stroke="#5a6577" stroke-width="1.2"/>
<rect x="700" y="154" width="50" height="16" fill="#9fb7e8" stroke="#5a6577" stroke-width="1.2"/>
<rect x="635" y="170" width="65" height="26" fill="#f6e7c8" stroke="#2f6fed" stroke-width="1.2"/>
<path d="M645 95 L645 160" fill="none" stroke="#b00020" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M645 160 L641.1 151.9 L648.9 151.9 z" fill="#b00020"/>
<path d="M660 95 L660 160" fill="none" stroke="#b00020" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M660 160 L656.1 151.9 L663.9 151.9 z" fill="#b00020"/>
<path d="M675 95 L675 160" fill="none" stroke="#b00020" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M675 160 L671.1 151.9 L678.9 151.9 z" fill="#b00020"/>
<path d="M690 95 L690 160" fill="none" stroke="#b00020" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M690 160 L686.1 151.9 L693.9 151.9 z" fill="#b00020"/>
<text x="667.5" y="88" font-size="12" text-anchor="middle" fill="#b00020">ions</text>
<text x="667.5" y="270" font-size="12" text-anchor="middle" fill="#1a2230">4. process the window (implant)</text>
<text x="110" y="230" font-size="12" text-anchor="middle" fill="#5a6577">wafer</text>
<text x="390.0" y="310" font-size="12" text-anchor="middle" fill="#5a6577">In this example exposed resist hardens and the shadowed area dissolves, opening a window over the silicon.</text>
<text x="390.0" y="326" font-size="12" text-anchor="middle" fill="#5a6577">Each mask layer repeats coat, expose, develop.</text>

</svg>
