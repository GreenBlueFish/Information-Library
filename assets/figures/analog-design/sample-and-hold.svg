<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 365" width="560" height="365" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Sampling switch followed by a hold capacitor</title>
<rect width="560" height="365" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">A sampling switch and hold capacitor</text>
<path d="M63.5 150 H68" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="60" cy="150" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="34.2" y="155" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="41.5" y="158.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">in</text>
<path d="M68 150 H160" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="160" cy="150" r="3.5" fill="#1a2230"/>
<path d="M160 150 L198 128" fill="none" stroke="#1a2230" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<circle cx="200" cy="150" r="3.5" fill="#1a2230"/>
<path d="M200 150 H380" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="300" cy="150" r="3.5" fill="#1a2230"/>
<path d="M300 150 V172" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M300 172 V192 M300 200 V220" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M288 192 H312 M288 200 H312" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="320.0" y="201" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">C</text>
<text x="327.3" y="204.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">H</text>
<path d="M300 220 V250" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M300 250 V258" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M288 258 H312 M292 264 H308 M296 270 H304" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M380 150 H384.5" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="388" cy="150" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="396.0" y="155" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="403.3" y="158.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">out</text>
<path d="M180 100 V132" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 3" data-sym="1"/>
<text x="180" y="92" font-size="13" text-anchor="middle" fill="#5a6577">clock φ</text>
<text x="280.0" y="320" font-size="12" text-anchor="middle" fill="#1a2230">Clock high: the switch is closed and Vout tracks Vin (track mode).</text>
<text x="280.0" y="342" font-size="12" text-anchor="middle" fill="#1a2230">Clock low: the switch opens and CH holds the last value (hold mode).</text>

</svg>
