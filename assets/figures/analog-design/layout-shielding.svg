<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Cross-sections of a signal wire between grounded wires and inside a box of ground metal</title>
<rect width="680" height="360" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">Shielding a sensitive line</text>
<rect x="40" y="230" width="280" height="40" fill="#eef1f6" stroke="#5a6577" stroke-width="1.2"/>
<text x="180" y="290" font-size="12" text-anchor="middle" fill="#1a2230">(a) grounded neighbours</text>
<rect x="70" y="140" width="50" height="30" fill="#cccccc" stroke="#1a2230" stroke-width="1.2"/>
<text x="95" y="160" font-size="11" text-anchor="middle" fill="#1a2230">GND</text>
<rect x="155" y="140" width="50" height="30" fill="#2f6fed" stroke="#1a2230" stroke-width="1.2"/>
<text x="180" y="160" font-size="11" text-anchor="middle" fill="#ffffff">signal</text>
<rect x="240" y="140" width="50" height="30" fill="#cccccc" stroke="#1a2230" stroke-width="1.2"/>
<text x="265" y="160" font-size="11" text-anchor="middle" fill="#1a2230">GND</text>
<rect x="360" y="230" width="280" height="40" fill="#eef1f6" stroke="#5a6577" stroke-width="1.2"/>
<text x="500" y="290" font-size="12" text-anchor="middle" fill="#1a2230">(b) ground planes above and below</text>
<rect x="390" y="80" width="220" height="18" fill="#cccccc" stroke="#1a2230" stroke-width="1.2"/>
<text x="500" y="93" font-size="11" text-anchor="middle" fill="#1a2230">upper ground metal</text>
<rect x="475" y="140" width="50" height="30" fill="#2f6fed" stroke="#1a2230" stroke-width="1.2"/>
<text x="500" y="160" font-size="11" text-anchor="middle" fill="#ffffff">signal</text>
<rect x="390" y="200" width="220" height="18" fill="#cccccc" stroke="#1a2230" stroke-width="1.2"/>
<text x="500" y="213" font-size="11" text-anchor="middle" fill="#1a2230">lower ground metal</text>
<rect x="400" y="98" width="12" height="102" fill="#cccccc" stroke="#1a2230" stroke-width="1.2"/>
<rect x="588" y="98" width="12" height="102" fill="#cccccc" stroke="#1a2230" stroke-width="1.2"/>
<text x="340.0" y="320" font-size="12" text-anchor="middle" fill="#5a6577">Field lines from noisy wires end on the grounded shields instead of the signal. (a) costs</text>
<text x="340.0" y="336" font-size="12" text-anchor="middle" fill="#5a6577">routing tracks and adds capacitance to ground; (b) isolates the line almost completely but uses</text>
<text x="340.0" y="352" font-size="12" text-anchor="middle" fill="#5a6577">three metal layers.</text>

</svg>
