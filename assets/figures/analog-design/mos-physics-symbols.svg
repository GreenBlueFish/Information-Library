<text x="345.0" y="305" font-size="12" text-anchor="middle" fill="#5a6577">The arrow sits on the source: out of an NMOS, into a PMOS. PMOS sources are drawn on top because</text>
<text x="345.0" y="321" font-size="12" text-anchor="middle" fill="#5a6577">they sit at the higher voltage. B is the bulk; when omitted it goes to ground (NMOS) or VDD</text>
<text x="345.0" y="337" font-size="12" text-anchor="middle" fill="#5a6577">(PMOS).</text>

