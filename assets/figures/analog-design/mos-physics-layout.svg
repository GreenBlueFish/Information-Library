<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">Layout (top view): one finger versus two fingers</text>
<rect x="70" y="80" width="200" height="160" fill="#d9f0dc" stroke="#3b8a4a" stroke-width="1.5"/>
<rect x="155" y="60" width="30" height="200" fill="#f4c9c9" stroke="#b33" stroke-width="1.5"/>
<rect x="99" y="104" width="12" height="12" fill="#1a2230"/>
<rect x="229" y="104" width="12" height="12" fill="#1a2230"/>
