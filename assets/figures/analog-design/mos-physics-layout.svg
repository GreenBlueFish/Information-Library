<rect x="229" y="154" width="12" height="12" fill="#1a2230"/>
<rect x="99" y="204" width="12" height="12" fill="#1a2230"/>
<rect x="229" y="204" width="12" height="12" fill="#1a2230"/>
<text x="105" y="275" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">S</text>
<text x="235" y="275" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">D</text>
<text x="170" y="52" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">G</text>
<path d="M52 80 V240" fill="none" stroke="#5a6577" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M46 80 H58 M46 240 H58" fill="none" stroke="#5a6577" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="42" y="165" font-size="13" text-anchor="end" fill="#1a2230">W</text>
<path d="M200 252 H270" fill="none" stroke="#5a6577" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M200 246 V258 M270 246 V258" fill="none" stroke="#5a6577" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="235" y="296" font-size="13" text-anchor="middle" fill="#1a2230">E</text>
<text x="170" y="325" font-size="13" text-anchor="middle" fill="#1a2230" font-weight="600">(a) one finger</text>
<rect x="360" y="120" width="320" height="80" fill="#d9f0dc" stroke="#3b8a4a" stroke-width="1.5"/>
<rect x="445" y="100" width="30" height="120" fill="#f4c9c9" stroke="#b33" stroke-width="1.5"/>
<rect x="565" y="100" width="30" height="120" fill="#f4c9c9" stroke="#b33" stroke-width="1.5"/>
