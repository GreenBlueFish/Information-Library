<text x="400" y="235" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">S</text>
<text x="520" y="235" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">D</text>
<text x="640" y="235" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">S</text>
<text x="460" y="92" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">G</text>
<text x="580" y="92" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">G</text>
<path d="M346 120 V200" fill="none" stroke="#5a6577" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M340 120 H352 M340 200 H352" fill="none" stroke="#5a6577" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="336" y="165" font-size="13" text-anchor="end" fill="#1a2230">W/2</text>
<text x="520" y="325" font-size="13" text-anchor="middle" fill="#1a2230" font-weight="600">(b) two fingers, shared drain</text>
<text x="360.0" y="352" font-size="12" text-anchor="middle" fill="#5a6577">Green: diffusion (source/drain), red: gate poly, black squares: contacts. In (b) both fingers share</text>
<text x="360.0" y="368" font-size="12" text-anchor="middle" fill="#5a6577">one drain strip, so the drain area and perimeter roughly halve while W/L stays the same.</text>

