<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 395" width="720" height="395" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Top-view layout of a one-finger transistor and a two-finger transistor with a shared drain</title>
