<text x="600" y="405" font-size="13" text-anchor="middle" fill="#1a2230" font-weight="600">(b) NMOS input, PMOS cascode</text>
<text x="430.0" y="440" font-size="12" text-anchor="middle" fill="#5a6577">The input device's signal current is steered (folded) into a cascode device of the opposite type. M1 and M2 each need their</text>
<text x="430.0" y="456" font-size="12" text-anchor="middle" fill="#5a6577">own bias current (I1 is shared between them), so the stage draws more current than a telescopic cascode, where one current</text>
<text x="430.0" y="472" font-size="12" text-anchor="middle" fill="#5a6577">serves both.</text>

