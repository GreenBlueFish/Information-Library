<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 410" width="660" height="410" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Gate-source and gate-drain capacitance against gate voltage in the off, saturation and triode regions</title>
<rect width="660" height="410" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">Gate capacitances against gate voltage (drain voltage fixed)</text>
<path d="M90 320 L602 320" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M602 320 L593.9 323.9 L593.9 316.1 z" fill="#5a6577"/>
<path d="M90 320 L90 68" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M90 68 L93.9 76.1 L86.1 76.1 z" fill="#5a6577"/>
<text x="608.0" y="325" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="615.3" y="328.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">GS</text>
<text x="82" y="74" font-size="13" text-anchor="end" fill="#1a2230">capacitance</text>
<path d="M90.0 290.0 L220.0 290.0 L245.0 130.0 L405.0 130.0 L435.0 190.0 L590.0 190.0" fill="none" stroke="#2f6fed" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M90.0 294.0 L405.0 294.0 L435.0 194.0 L590.0 194.0" fill="none" stroke="#b00020" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 5" data-sym="1"/>
<path d="M230 320 V325" fill="none" stroke="#5a6577" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="222.5" y="339" font-size="11" text-anchor="start" fill="#5a6577" xml:space="preserve">V</text>
<text x="228.7" y="341.8" font-size="7.9" text-anchor="start" fill="#5a6577" xml:space="preserve">TH</text>
<path d="M420 320 V325" fill="none" stroke="#5a6577" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="398.0" y="339" font-size="11" text-anchor="start" fill="#5a6577" xml:space="preserve">V</text>
<text x="404.1" y="341.8" font-size="7.9" text-anchor="start" fill="#5a6577" xml:space="preserve">D</text>
<text x="408.5" y="339" font-size="11" text-anchor="start" fill="#5a6577" xml:space="preserve"> + </text>
<text x="427.0" y="339" font-size="11" text-anchor="start" fill="#5a6577" xml:space="preserve">V</text>
<text x="433.2" y="341.8" font-size="7.9" text-anchor="start" fill="#5a6577" xml:space="preserve">TH</text>
<text x="96.0" y="280" font-size="12" text-anchor="start" fill="#1a2230" xml:space="preserve">W </text>
<text x="109.4" y="280" font-size="12" text-anchor="start" fill="#1a2230" xml:space="preserve">C</text>
<text x="116.2" y="283.0" font-size="8.6" text-anchor="start" fill="#1a2230" xml:space="preserve">ov</text>
<text x="260.0" y="120" font-size="12" text-anchor="start" fill="#1a2230" xml:space="preserve">(2/3) W L </text>
<text x="327.2" y="120" font-size="12" text-anchor="start" fill="#1a2230" xml:space="preserve">C</text>
<text x="333.9" y="123.0" font-size="8.6" text-anchor="start" fill="#1a2230" xml:space="preserve">ox</text>
<text x="343.6" y="120" font-size="12" text-anchor="start" fill="#1a2230" xml:space="preserve"> + W </text>
<text x="377.2" y="120" font-size="12" text-anchor="start" fill="#1a2230" xml:space="preserve">C</text>
<text x="383.9" y="123.0" font-size="8.6" text-anchor="start" fill="#1a2230" xml:space="preserve">ov</text>
<text x="465.9" y="178" font-size="12" text-anchor="start" fill="#1a2230" xml:space="preserve">W L </text>
<text x="492.8" y="178" font-size="12" text-anchor="start" fill="#1a2230" xml:space="preserve">C</text>
<text x="499.5" y="181.0" font-size="8.6" text-anchor="start" fill="#1a2230" xml:space="preserve">ox</text>
<text x="509.2" y="178" font-size="12" text-anchor="start" fill="#1a2230" xml:space="preserve"> / 2 + W </text>
<text x="569.6" y="178" font-size="12" text-anchor="start" fill="#1a2230" xml:space="preserve">C</text>
<text x="576.4" y="181.0" font-size="8.6" text-anchor="start" fill="#1a2230" xml:space="preserve">ov</text>
<text x="260.0" y="278" font-size="13" text-anchor="start" fill="#b00020" font-weight="600" xml:space="preserve">C</text>
<text x="267.3" y="281.2" font-size="9.4" text-anchor="start" fill="#b00020" font-weight="600" xml:space="preserve">GD</text>
<text x="260.0" y="152" font-size="13" text-anchor="start" fill="#2f6fed" font-weight="600" xml:space="preserve">C</text>
<text x="267.3" y="155.2" font-size="9.4" text-anchor="start" fill="#2f6fed" font-weight="600" xml:space="preserve">GS</text>
<text x="160.0" y="90" font-size="14" text-anchor="middle" fill="#5a6577" font-weight="600">off</text>
<text x="325.0" y="90" font-size="14" text-anchor="middle" fill="#5a6577" font-weight="600">saturation</text>
<text x="505.0" y="90" font-size="14" text-anchor="middle" fill="#5a6577" font-weight="600">triode</text>
<text x="330.0" y="368" font-size="12" text-anchor="middle" fill="#5a6577">Off: only overlap. Saturation: the channel is tied to the source, so CGS takes two thirds of</text>
<text x="330.0" y="384" font-size="12" text-anchor="middle" fill="#5a6577">the gate-channel capacitance. Deep triode: the channel splits evenly between source and</text>
<text x="330.0" y="400" font-size="12" text-anchor="middle" fill="#5a6577">drain.</text>

</svg>
