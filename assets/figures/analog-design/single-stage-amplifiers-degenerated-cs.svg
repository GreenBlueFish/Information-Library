<text x="280.0" y="395" font-size="12" text-anchor="middle" fill="#5a6577">Part of any change in Vin appears across RS instead of VGS, so the drain</text>
<text x="280.0" y="411" font-size="12" text-anchor="middle" fill="#5a6577">current depends less on the device's own gm.</text>

