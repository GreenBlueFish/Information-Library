<text x="350.0" y="410" font-size="12" text-anchor="middle" fill="#5a6577">The MOS varactor is monotonic and can swing to either polarity without forward-biasing anything,</text>
<text x="350.0" y="426" font-size="12" text-anchor="middle" fill="#5a6577">which is why modern LC VCOs use it.</text>

