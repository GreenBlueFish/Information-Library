<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" width="600" height="310" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Bridging capacitor across an inverting amplifier</title>
<rect width="600" height="310" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">Miller effect: a bridging capacitor looks larger at the input</text>
<path d="M43.5 140 H48" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="40" cy="140" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="32" y="145" font-size="13" text-anchor="end" fill="#1a2230">in</text>
<path d="M48 140 H150" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="100" cy="140" r="3.5" fill="#1a2230"/>
<rect x="150" y="90" width="110" height="100" rx="6" fill="#eef1f6" stroke="#5a6577" stroke-width="1.5"/>
<text x="205.0" y="138.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">−A</text>
<text x="205.0" y="155.0" font-size="11" text-anchor="middle" fill="#5a6577">inverting gain</text>
<path d="M260 140 H470" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="420" cy="140" r="3.5" fill="#1a2230"/>
<path d="M470 140 H474.5" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="478" cy="140" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="486" y="145" font-size="13" text-anchor="start" fill="#1a2230">out</text>
<path d="M100 140 V70 H236" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M236 70 H256 M264 70 H284" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M256 58 V82 M264 58 V82" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="253.7" y="52" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">C</text>
<text x="261.0" y="55.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">F</text>
<path d="M284 70 H420 V140" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="300.0" y="250" font-size="12" text-anchor="middle" fill="#1a2230">A change ΔV at the input produces a change of about −A·ΔV at the output, so CF</text>
<text x="300.0" y="266" font-size="12" text-anchor="middle" fill="#1a2230">carries a current of (1 + A)·CF·dV/dt. The input sees Cin = (1 + A)·CF.</text>

</svg>
