<text x="273.0" y="145.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">GD</text>
<path d="M299 160 H330" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="280.0" y="345" font-size="12" text-anchor="middle" fill="#5a6577">RS is the output resistance of the stage that drives the gate. CGD bridges</text>
<text x="280.0" y="361" font-size="12" text-anchor="middle" fill="#5a6577">input and output, so it is Miller-multiplied; CDB (plus any load) sits at the</text>
<text x="280.0" y="377" font-size="12" text-anchor="middle" fill="#5a6577">output.</text>
