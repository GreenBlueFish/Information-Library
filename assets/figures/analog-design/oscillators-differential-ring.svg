<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 385" width="700" height="385" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Four-stage differential ring oscillator with a crossed feedback link</title>
<rect width="700" height="385" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">Four differential stages: an even ring works if one link is crossed</text>
<rect x="90" y="90" width="80" height="80" rx="0" fill="#eef1f6"/>
<path d="M90 90 H170 V170 H90 Z" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="130.0" y="135.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">A1</text>
<text x="100" y="120" font-size="12" text-anchor="start" fill="#5a6577">+</text>
<text x="100" y="156" font-size="13" text-anchor="start" fill="#5a6577">−</text>
<text x="160" y="120" font-size="13" text-anchor="end" fill="#5a6577">−</text>
<text x="160" y="156" font-size="12" text-anchor="end" fill="#5a6577">+</text>
<rect x="230" y="90" width="80" height="80" rx="0" fill="#eef1f6"/>
<path d="M230 90 H310 V170 H230 Z" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="270.0" y="135.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">A2</text>
<text x="240" y="120" font-size="12" text-anchor="start" fill="#5a6577">+</text>
<text x="240" y="156" font-size="13" text-anchor="start" fill="#5a6577">−</text>
<text x="300" y="120" font-size="13" text-anchor="end" fill="#5a6577">−</text>
<text x="300" y="156" font-size="12" text-anchor="end" fill="#5a6577">+</text>
<rect x="370" y="90" width="80" height="80" rx="0" fill="#eef1f6"/>
<path d="M370 90 H450 V170 H370 Z" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="410.0" y="135.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">A3</text>
<text x="380" y="120" font-size="12" text-anchor="start" fill="#5a6577">+</text>
<text x="380" y="156" font-size="13" text-anchor="start" fill="#5a6577">−</text>
<text x="440" y="120" font-size="13" text-anchor="end" fill="#5a6577">−</text>
<text x="440" y="156" font-size="12" text-anchor="end" fill="#5a6577">+</text>
<rect x="510" y="90" width="80" height="80" rx="0" fill="#eef1f6"/>
<path d="M510 90 H590 V170 H510 Z" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="550.0" y="135.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">A4</text>
<text x="520" y="120" font-size="12" text-anchor="start" fill="#5a6577">+</text>
<text x="520" y="156" font-size="13" text-anchor="start" fill="#5a6577">−</text>
<text x="580" y="120" font-size="13" text-anchor="end" fill="#5a6577">−</text>
<text x="580" y="156" font-size="12" text-anchor="end" fill="#5a6577">+</text>
<path d="M170 115 H230" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M170 150 H230" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M310 115 H370" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M310 150 H370" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M450 115 H510" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M450 150 H510" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="620" cy="115" r="3.5" fill="#1a2230"/>
<path d="M590 115 H620 V240 H60 V150 H90" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M590 150 H640 V270 H40 V115 H90" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M620 115 H665" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M665 115 H669.5" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="673" cy="115" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="681" y="120" font-size="13" text-anchor="start" fill="#1a2230">out</text>
<text x="350.0" y="310" font-size="12" text-anchor="middle" fill="#5a6577">Each stage inverts differentially, giving four inversions; crossing the two wires of the return</text>
<text x="350.0" y="326" font-size="12" text-anchor="middle" fill="#5a6577">link adds a fifth. An odd total means the ring cannot latch.</text>
<text x="350.0" y="350" font-size="12" text-anchor="middle" fill="#5a6577">With four stages each stage supplies 45° at oscillation, so ωosc = ω0 and the gain needed per</text>
<text x="350.0" y="366" font-size="12" text-anchor="middle" fill="#5a6577">stage is only √2.</text>

</svg>
