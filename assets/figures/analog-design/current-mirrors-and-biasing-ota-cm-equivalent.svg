<circle cx="410" cy="172" r="3.5" fill="#1a2230"/>
<path d="M410 172 L330 172 L330 120 L350 120" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="410" cy="188" r="3.5" fill="#1a2230"/>
