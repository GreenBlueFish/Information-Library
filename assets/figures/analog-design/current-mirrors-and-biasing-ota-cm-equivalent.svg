<text x="308.9" y="248.6" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">in,CM</text>
<path d="M410 280 L410 290" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
