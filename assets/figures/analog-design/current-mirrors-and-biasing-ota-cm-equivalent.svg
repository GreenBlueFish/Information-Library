<text x="320.0" y="395" font-size="12" text-anchor="middle" fill="#5a6577">With matched devices Vout tracks the diode node F, so the circuit is a CS stage with a</text>
<text x="320.0" y="411" font-size="12" text-anchor="middle" fill="#5a6577">1/(2gm3,4) load and RSS degeneration: ACM ≈ −(gm1,2/gm3,4)/(1 + 2gm1,2RSS).</text>

