<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>CTAT and PTAT voltages adding to a flat reference</title>
<rect width="780" height="430" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">Bandgap reference: cancelling the temperature drift</text>
<path d="M90 330 L540 330" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M540 330 L531.9 333.9 L531.9 326.1 z" fill="#5a6577"/>
<path d="M90 330 L90 78" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M90 78 L93.9 86.1 L86.1 86.1 z" fill="#5a6577"/>
<text x="530" y="362" font-size="13" text-anchor="end" fill="#1a2230">temperature</text>
<text x="102" y="78" font-size="13" text-anchor="start" fill="#1a2230">voltage</text>
<path d="M90 146.0 L530 226.0" fill="none" stroke="#2f6fed" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M90 322.0 L530 242.0" fill="none" stroke="#b00020" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M90.0 144.0 L98.8 143.5 L107.6 143.1 L116.4 142.6 L125.2 142.2 L134.0 141.8 L142.8 141.5 L151.6 141.1 L160.4 140.8 L169.2 140.5 L178.0 140.2 L186.8 139.9 L195.6 139.6 L204.4 139.4 L213.2 139.2 L222.0 139.0 L230.8 138.8 L239.6 138.6 L248.4 138.5 L257.2 138.3 L266.0 138.2 L274.8 138.2 L283.6 138.1 L292.4 138.0 L301.2 138.0 L310.0 138.0 L318.8 138.0 L327.6 138.0 L336.4 138.1 L345.2 138.2 L354.0 138.2 L362.8 138.3 L371.6 138.5 L380.4 138.6 L389.2 138.8 L398.0 139.0 L406.8 139.2 L415.6 139.4 L424.4 139.6 L433.2 139.9 L442.0 140.2 L450.8 140.5 L459.6 140.8 L468.4 141.1 L477.2 141.5 L486.0 141.8 L494.8 142.2 L503.6 142.6 L512.4 143.1 L521.2 143.5 L530.0 144.0" fill="none" stroke="#1a2230" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="538.0" y="230.0" font-size="12" text-anchor="start" fill="#2f6fed" xml:space="preserve">V</text>
<text x="544.7" y="233.0" font-size="8.6" text-anchor="start" fill="#2f6fed" xml:space="preserve">BE</text>
<text x="554.4" y="230.0" font-size="12" text-anchor="start" fill="#2f6fed" xml:space="preserve"> (falls with T: CTAT)</text>
<text x="538.0" y="254.0" font-size="12" text-anchor="start" fill="#b00020" xml:space="preserve">k·Δ</text>
<text x="558.2" y="254.0" font-size="12" text-anchor="start" fill="#b00020" xml:space="preserve">V</text>
<text x="564.9" y="257.0" font-size="8.6" text-anchor="start" fill="#b00020" xml:space="preserve">BE</text>
<text x="574.5" y="254.0" font-size="12" text-anchor="start" fill="#b00020" xml:space="preserve"> (rises with T: PTAT)</text>
<text x="222.0" y="126.0" font-size="13" text-anchor="start" fill="#1a2230" font-weight="600" xml:space="preserve">V</text>
<text x="229.3" y="129.2" font-size="9.4" text-anchor="start" fill="#1a2230" font-weight="600" xml:space="preserve">ref</text>
<text x="245.1" y="126.0" font-size="13" text-anchor="start" fill="#1a2230" font-weight="600" xml:space="preserve"> ≈ 1.2 V, nearly flat</text>
<text x="390.0" y="390" font-size="12" text-anchor="middle" fill="#5a6577">Adding a rising term to a falling term of equal slope leaves a flat sum at about the silicon bandgap, 1.2 V.</text>

</svg>
