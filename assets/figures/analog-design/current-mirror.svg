<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 425" width="560" height="425" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Basic current mirror schematic</title>
<rect width="560" height="425" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">Basic NMOS current mirror</text>
<path d="M180 40 V52" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M168 40 H192" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="196" y="44" font-size="13" text-anchor="start" fill="#1a2230">VDD</text>
<path d="M180 52 V78" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="180" cy="123" r="15" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<path d="M180 114 V132" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M175 127 L180 133 L185 127" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M180 78 V108" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M180 138 V168" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="201.0" y="128" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">I</text>
<text x="208.3" y="131.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">ref</text>
<path d="M180 168 V200" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="180" cy="190" r="3.5" fill="#1a2230"/>
<path d="M120 230 H150" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M150 214 V246" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M156 212 V224 M156 226 V234 M156 236 V248" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M156 218 H180 V190" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M156 242 H180 V270" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M172 242 L164 237.5 V246.5 z" fill="#1a2230"/>
<text x="192" y="235" font-size="13" text-anchor="start" fill="#1a2230">M1</text>
<path d="M180 270 V278" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M180 278 V286" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M168 286 H192 M172 292 H188 M176 298 H184" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M180 190 H100 V230 H120" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="100" cy="230" r="3.5" fill="#1a2230"/>
<path d="M320 230 H350" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M350 214 V246" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M356 212 V224 M356 226 V234 M356 236 V248" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M356 218 H380 V190" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M356 242 H380 V270" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M372 242 L364 237.5 V246.5 z" fill="#1a2230"/>
<text x="392" y="235" font-size="13" text-anchor="start" fill="#1a2230">M2</text>
<path d="M380 270 V278" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M380 278 V286" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M368 286 H392 M372 292 H388 M376 298 H384" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M380 190 V96" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M380 118 L380 150" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M380 150 L376.1 141.9 L383.9 141.9 z" fill="#1a2230"/>
<text x="396.0" y="140" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">I</text>
<text x="403.3" y="143.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">out</text>
<circle cx="380" cy="92" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<path d="M100 230 V320 H290 V230 H320" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="280.0" y="365" font-size="12" text-anchor="middle" fill="#5a6577">Both transistors have the same VGS, so Iout ≈ Iref, scaled by the ratio of</text>
<text x="280.0" y="381" font-size="12" text-anchor="middle" fill="#5a6577">their W/L.</text>
<text x="280.0" y="405" font-size="12" text-anchor="middle" fill="#5a6577">M1 is diode-connected: its gate and drain are tied together.</text>

</svg>
