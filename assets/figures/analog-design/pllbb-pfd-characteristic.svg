<text x="360.3" y="119" font-size="12" text-anchor="start" fill="#5a6577" xml:space="preserve">+I<tspan dy="3.0" font-size="8.6">P</tspan><tspan dy="-3.0">​</tspan></text>
<path d="M385 415.0 H390" fill="none" stroke="#5a6577" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="360.3" y="419" font-size="12" text-anchor="start" fill="#5a6577" xml:space="preserve">−I<tspan dy="3.0" font-size="8.6">P</tspan><tspan dy="-3.0">​</tspan></text>
<path d="M120.0 415.0 L660.0 115.0" fill="none" stroke="#5a6577" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4" data-sym="1"/>
