<text x="525.0" y="287" font-size="12" text-anchor="middle" fill="#5a6577" xml:space="preserve">π</text>
<path d="M660.0 265 V271" fill="none" stroke="#5a6577" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
