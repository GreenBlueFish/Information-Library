<text x="589.5" y="315" font-size="11" text-anchor="start" fill="#b00020" xml:space="preserve">2π(1 − t<tspan dy="2.8" font-size="7.9">rst</tspan><tspan dy="-2.8">/</tspan>T<tspan dy="2.8" font-size="7.9">ref</tspan><tspan dy="-2.8">)</tspan></text>
<text x="111.3" y="315" font-size="11" text-anchor="start" fill="#b00020" xml:space="preserve">−2π(1 − t<tspan dy="2.8" font-size="7.9">rst</tspan><tspan dy="-2.8">/</tspan>T<tspan dy="2.8" font-size="7.9">ref</tspan><tspan dy="-2.8">)</tspan></text>
<text x="674.0" y="105" font-size="12" text-anchor="end" fill="#b00020" font-weight="600" xml:space="preserve">blind zone</text>
<text x="106.0" y="433" font-size="12" text-anchor="start" fill="#b00020" font-weight="600" xml:space="preserve">blind zone</text>
<text x="470" y="190" font-size="12" text-anchor="start" fill="#2f6fed" font-weight="600" xml:space="preserve">real PFD</text>
<rect x="24" y="52" width="321" height="186" fill="#ffffff" stroke="#5a6577" stroke-width="1.2"/>
<text x="34" y="70" font-size="12" text-anchor="start" fill="#1a2230" font-weight="600" xml:space="preserve">zoom near Δφ = 0</text>
<path d="M80 128 L302 128" fill="none" stroke="#5a6577" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M302 128 L293.9 131.9 L293.9 124.1 z" fill="#5a6577"/>
<path d="M190 164 L190 78" fill="none" stroke="#5a6577" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M190 78 L193.9 86.1 L186.1 86.1 z" fill="#5a6577"/>
<text x="302" y="142" font-size="11" text-anchor="end" fill="#5a6577" xml:space="preserve">Δφ</text>
<path d="M110 168 L270 88" fill="none" stroke="#2f6fed" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M110 156 L166 128 H214 L270 100" fill="none" stroke="#b00020" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M166 124 V132" fill="none" stroke="#5a6577" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="156.9" y="150" font-size="12" text-anchor="start" fill="#5a6577" xml:space="preserve">−φ<tspan dy="3.0" font-size="8.6">0</tspan><tspan dy="-3.0">​</tspan></text>
<path d="M214 124 V132" fill="none" stroke="#5a6577" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="208.2" y="150" font-size="12" text-anchor="start" fill="#5a6577" xml:space="preserve">φ<tspan dy="3.0" font-size="8.6">0</tspan><tspan dy="-3.0">​</tspan></text>
<path d="M36 200 H58" fill="none" stroke="#b00020" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="66" y="204" font-size="11" text-anchor="start" fill="#1a2230" xml:space="preserve">dead zone (no reset pulse)</text>
<path d="M36 220 H58" fill="none" stroke="#2f6fed" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="66.0" y="224" font-size="11" text-anchor="start" fill="#1a2230" xml:space="preserve">with reset pulse t<tspan dy="2.8" font-size="7.9">rst</tspan><tspan dy="-2.8"> > switch turn-on time</tspan></text>
<path d="M345 238 L378 259" fill="none" stroke="#5a6577" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4" data-sym="1"/>
<circle cx="390" cy="265" r="13" fill="none" stroke="#5a6577" stroke-width="1" stroke-dasharray="3 3"/>
<text x="390.0" y="478" font-size="12" text-anchor="middle" fill="#5a6577" xml:space="preserve">Beyond the blind-zone edge the PFD cannot see the edge that arrives during the reset pulse, so the current jumps to</text>
<text x="390.0" y="494" font-size="12" text-anchor="middle" fill="#5a6577" xml:space="preserve">the other sign. The dead zone near zero is avoided by a reset pulse longer than the charge-pump switch turn-on time.</text>

</svg>
