<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 525" width="780" height="525" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Average charge-pump current against phase error for an ideal and a real PFD</title>
