<path d="M615 90 V210" fill="none" stroke="#5a6577" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="622" y="154.0" font-size="12" text-anchor="start" fill="#5a6577">W/N</text>
<text x="340.0" y="260" font-size="12" text-anchor="middle" fill="#5a6577">Six fingers share their sources and drains, so each diffusion strip serves two gates. Narrow</text>
<text x="340.0" y="276" font-size="12" text-anchor="middle" fill="#5a6577">fingers cut the gate resistance (∝ W/N²); more fingers add perimeter. The grounded dummy gates</text>
<text x="340.0" y="292" font-size="12" text-anchor="middle" fill="#5a6577">at the ends shield the active fingers from trench stress and give them identical surroundings.</text>

