<text x="300.0" y="400" font-size="12" text-anchor="middle" fill="#5a6577">VOS is the input that brings the output back to zero. Mismatched thresholds enter</text>
<text x="300.0" y="416" font-size="12" text-anchor="middle" fill="#5a6577">one-for-one; mismatched W/L and loads enter scaled by (VGS − VTH)/2.</text>

