<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Timing diagram of a tristate phase-frequency detector</title>
<rect width="780" height="500" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">Tristate PFD: timing diagram</text>
<rect x="582" y="80" width="24" height="330" fill="#b00020" fill-opacity="0.10"/>
<text x="122" y="114" font-size="13" text-anchor="end" fill="#1a2230" xml:space="preserve">A (ref)</text>
<path d="M130 120 H750" fill="none" stroke="#e1e5ec" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4" data-sym="1"/>
<text x="122" y="184" font-size="13" text-anchor="end" fill="#1a2230" xml:space="preserve">B (feedback)</text>
<path d="M130 190 H750" fill="none" stroke="#e1e5ec" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4" data-sym="1"/>
<text x="75.0" y="254" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">Q<tspan dy="3.2" font-size="9.4">A</tspan><tspan dy="-3.2"> (UP)</tspan></text>
<path d="M130 260 H750" fill="none" stroke="#e1e5ec" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4" data-sym="1"/>
<text x="75.0" y="324" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">Q<tspan dy="3.2" font-size="9.4">B</tspan><tspan dy="-3.2"> (DN)</tspan></text>
<path d="M130 330 H750" fill="none" stroke="#e1e5ec" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4" data-sym="1"/>
<text x="122" y="394" font-size="13" text-anchor="end" fill="#1a2230" xml:space="preserve">Reset</text>
<path d="M130 400 H750" fill="none" stroke="#e1e5ec" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4" data-sym="1"/>
<path d="M130 120 H150 V94 H246 V120 H330" fill="none" stroke="#2f6fed" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M380 120 H410 V94 H506 V120 H602 V94 H698 V120 H750" fill="none" stroke="#2f6fed" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M130 190 H195 V164 H291 V190 H330" fill="none" stroke="#2f6fed" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M380 190 H582 V164 H678 V190 H750" fill="none" stroke="#2f6fed" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M130 260 H150 V234 H219 V260 H330" fill="none" stroke="#2f6fed" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M380 260 H410 V234 H606 V260 H750" fill="none" stroke="#2f6fed" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M130 330 H195 V304 H219 V330 H330" fill="none" stroke="#2f6fed" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M380 330 H582 V304 H606 V330 H750" fill="none" stroke="#2f6fed" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M130 400 H195 V374 H219 V400 H330" fill="none" stroke="#b00020" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M380 400 H582 V374 H606 V400 H750" fill="none" stroke="#b00020" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M355 66 V420" fill="none" stroke="#5a6577" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4" data-sym="1"/>
<text x="230" y="52" font-size="13" text-anchor="middle" fill="#1a2230" font-weight="600" xml:space="preserve">case 1: A leads B by Δt (small error)</text>
<text x="565" y="52" font-size="13" text-anchor="middle" fill="#1a2230" font-weight="600" xml:space="preserve">case 2: large phase error</text>
<path d="M150 84 V410" fill="none" stroke="#c9ced8" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4" data-sym="1"/>
<path d="M195 84 V410" fill="none" stroke="#c9ced8" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4" data-sym="1"/>
<path d="M219 84 V410" fill="none" stroke="#c9ced8" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4" data-sym="1"/>
<path d="M172.5 142 L150 142" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M150 142 L158.1 138.1 L158.1 145.9 z" fill="#5a6577"/>
<path d="M172.5 142 L195 142" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M195 142 L186.9 145.9 L186.9 138.1 z" fill="#5a6577"/>
<text x="172.5" y="136" font-size="12" text-anchor="middle" fill="#1a2230" xml:space="preserve">Δt</text>
<path d="M150 276 L219 276" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M219 276 L210.9 279.9 L210.9 272.1 z" fill="#5a6577"/>
<path d="M219 276 L150 276" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M150 276 L158.1 272.1 L158.1 279.9 z" fill="#5a6577"/>
<text x="226.0" y="280" font-size="12" text-anchor="start" fill="#1a2230" xml:space="preserve">Δt + t<tspan dy="3.0" font-size="8.6">rst</tspan><tspan dy="-3.0">​</tspan></text>
<path d="M175 346 L195 346" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M195 346 L186.9 349.9 L186.9 342.1 z" fill="#5a6577"/>
<path d="M239 346 L219 346" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M219 346 L227.1 342.1 L227.1 349.9 z" fill="#5a6577"/>
<text x="245.0" y="350" font-size="12" text-anchor="start" fill="#1a2230" xml:space="preserve">t<tspan dy="3.0" font-size="8.6">rst</tspan><tspan dy="-3.0">​</tspan></text>
<path d="M410 84 V270" fill="none" stroke="#c9ced8" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4" data-sym="1"/>
<path d="M582 84 V410" fill="none" stroke="#c9ced8" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4" data-sym="1"/>
<path d="M496 142 L410 142" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M410 142 L418.1 138.1 L418.1 145.9 z" fill="#5a6577"/>
<path d="M496 142 L582 142" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M582 142 L573.9 145.9 L573.9 138.1 z" fill="#5a6577"/>
<text x="472.5" y="136" font-size="12" text-anchor="start" fill="#1a2230" xml:space="preserve">Δt ≈ T<tspan dy="3.0" font-size="8.6">ref</tspan><tspan dy="-3.0">​</tspan></text>
<path d="M562 416 L582 416" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M582 416 L573.9 419.9 L573.9 412.1 z" fill="#5a6577"/>
<path d="M626 416 L606 416" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M606 416 L614.1 412.1 L614.1 419.9 z" fill="#5a6577"/>
<text x="632.0" y="420" font-size="12" text-anchor="start" fill="#1a2230" xml:space="preserve">t<tspan dy="3.0" font-size="8.6">rst</tspan><tspan dy="-3.0">​</tspan></text>
<path d="M602 80 V410" fill="none" stroke="#b00020" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4" data-sym="1"/>
<path d="M594 99 L610 115 M610 99 L594 115" fill="none" stroke="#b00020" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="602" y="72" font-size="13" text-anchor="middle" fill="#b00020" font-weight="600" xml:space="preserve">edge missed (blind zone)</text>
<text x="82.6" y="452" font-size="12" text-anchor="start" fill="#5a6577" xml:space="preserve">UP lasts Δt + t<tspan dy="3.0" font-size="8.6">rst</tspan><tspan dy="-3.0">, DN lasts </tspan>t<tspan dy="3.0" font-size="8.6">rst</tspan><tspan dy="-3.0">; an edge that arrives during the reset pulse is lost, which limits the PFD's</tspan></text>
<text x="390.0" y="468" font-size="12" text-anchor="middle" fill="#5a6577" xml:space="preserve">range and top frequency.</text>

</svg>
