<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" width="560" height="390" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>PMOS current source regulated by sensing its current with a small series resistor</title>
<rect width="560" height="390" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">Current-voltage feedback: a regulated current source</text>
<path d="M300 58 V70" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M288 58 H312" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="316" y="62" font-size="13" text-anchor="start" fill="#1a2230">VDD</text>
<path d="M240 110 H270" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M270 94 V126" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M276 92 V104 M276 106 V114 M276 116 V128" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M276 98 H300 V70" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M276 122 H300 V150" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M278 98 L286 93.5 V102.5 z" fill="#1a2230"/>
<text x="312" y="115" font-size="13" text-anchor="start" fill="#1a2230">M1</text>
<path d="M300 150 V160" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M300 160.0 V170.0 l8 5 l-16 10 l16 10 l-16 10 l8 5 V220.0" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="316.0" y="195" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">Z</text>
<text x="323.3" y="198.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">L</text>
<path d="M300 220 V240" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="300" cy="230" r="3.5" fill="#1a2230"/>
<text x="312" y="245" font-size="13" text-anchor="start" fill="#5a6577">P</text>
<path d="M300 240.0 V250.0 l8 5 l-16 10 l16 10 l-16 10 l8 5 V300.0" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="316.0" y="275" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">r</text>
<text x="323.3" y="278.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">M</text>
<path d="M300 300 V308" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M288 308 H312 M292 314 H308 M296 320 H304" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M350 162 L350 210" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M350 210 L346.1 201.9 L353.9 201.9 z" fill="#1a2230"/>
<text x="360.0" y="192" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">I</text>
<text x="367.3" y="195.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">out</text>
<path d="M130 150.0 V210.0 L200 180 Z" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="140" y="173" font-size="14" text-anchor="middle" fill="#1a2230">−</text>
<text x="140" y="199" font-size="14" text-anchor="middle" fill="#1a2230">+</text>
<text x="149.2" y="185" font-size="12" text-anchor="start" fill="#5a6577" xml:space="preserve">A</text>
<text x="156.0" y="188.0" font-size="8.6" text-anchor="start" fill="#5a6577" xml:space="preserve">1</text>
<path d="M200 180 H220 V110 H240" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M300 230 H110 V192 H130" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M85.5 168 H90" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="82" cy="168" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="61.5" y="173" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="68.7" y="176.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">b</text>
<path d="M90 168 H130" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="280.0" y="345" font-size="12" text-anchor="middle" fill="#5a6577">rM turns Iout into a voltage that A1 compares with Vb. With a large loop gain</text>
<text x="280.0" y="361" font-size="12" text-anchor="middle" fill="#5a6577">Iout ≈ Vb / rM, and the impedance seen by ZL rises by 1 + A1 gm rM.</text>

</svg>
