<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Switched-capacitor amplifier with sampling and amplification switches</title>
<rect width="600" height="400" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">Switched-capacitor amplifier</text>
<path d="M45.5 200 H50" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="42" cy="200" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="16.2" y="205" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="23.5" y="208.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">in</text>
<path d="M50 200 H80" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="83" cy="200" r="3" fill="#1a2230"/>
<circle cx="137" cy="200" r="3" fill="#1a2230"/>
<path d="M83 200 L135 187" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="110.0" y="180" font-size="13" text-anchor="middle" fill="#1a2230">S1</text>
<path d="M137 200 H186" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="160" cy="200" r="3.5" fill="#1a2230"/>
<path d="M186 200 H206 M214 200 H234" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M206 188 V212 M214 188 V212" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="210" y="182" font-size="13" text-anchor="middle" fill="#1a2230">C1</text>
<path d="M234 200 H320" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="270" cy="200" r="3.5" fill="#1a2230"/>
<text x="262" y="220" font-size="13" text-anchor="end" fill="#5a6577">X</text>
<path d="M160 200 V218" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="160" cy="218" r="3" fill="#1a2230"/>
<circle cx="160" cy="252" r="3" fill="#1a2230"/>
<path d="M160 218 L173 250" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="150" y="240.0" font-size="13" text-anchor="end" fill="#1a2230">S3</text>
<path d="M160 252 V260" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M148 260 H172 M152 266 H168 M156 272 H164" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="150" y="192" font-size="13" text-anchor="end" fill="#5a6577">P</text>
<path d="M320 180.0 V250.0 L390 215 Z" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="330" y="205" font-size="15" text-anchor="middle" fill="#1a2230">−</text>
<text x="330" y="235" font-size="15" text-anchor="middle" fill="#1a2230">+</text>
<path d="M320 230 H300 V250" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M300 250 V258" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M288 258 H312 M292 264 H308 M296 270 H304" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M390 215 H504" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="450" cy="215" r="3.5" fill="#1a2230"/>
<circle cx="470" cy="215" r="3.5" fill="#1a2230"/>
<circle cx="508" cy="215" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="518.0" y="220" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="525.3" y="223.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">out</text>
<path d="M270 200 V80 H333" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="270" cy="140" r="3.5" fill="#1a2230"/>
<path d="M270 140 H356" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M356 140 H376 M384 140 H404" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M376 128 V152 M384 128 V152" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="380" y="122" font-size="13" text-anchor="middle" fill="#1a2230">C2</text>
<path d="M404 140 H450 V215" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="333" cy="80" r="3" fill="#1a2230"/>
<circle cx="377" cy="80" r="3" fill="#1a2230"/>
<path d="M333 80 L375 67" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="355.0" y="60" font-size="13" text-anchor="middle" fill="#1a2230">S2</text>
<path d="M377 80 H470 V215" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="300.0" y="320" font-size="12" text-anchor="middle" fill="#5a6577">Sample: S1 and S2 closed, C1 charges to Vin while the op amp holds X at virtual</text>
<text x="300.0" y="336" font-size="12" text-anchor="middle" fill="#5a6577">ground.</text>
<text x="300.0" y="362" font-size="12" text-anchor="middle" fill="#5a6577">Amplify: S1, S2 open, S3 closed. The charge on C1 moves onto C2, so Vout = (C1/C2)</text>
<text x="300.0" y="378" font-size="12" text-anchor="middle" fill="#5a6577">Vin.</text>

</svg>
