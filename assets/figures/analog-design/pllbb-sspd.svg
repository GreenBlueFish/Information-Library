<text x="63.6" y="412" font-size="12" text-anchor="start" fill="#5a6577" xml:space="preserve">The reference samples the VCO directly, so no divider is needed in lock; the gain A·ω<tspan dy="3.0" font-size="8.6">VCO</tspan><tspan dy="-3.0"> is large, so the charge</tspan></text>
<text x="390.0" y="428" font-size="12" text-anchor="middle" fill="#5a6577" xml:space="preserve">pump's noise is suppressed and not multiplied by N².</text>

