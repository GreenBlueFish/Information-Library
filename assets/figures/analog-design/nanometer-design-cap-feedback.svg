<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" width="600" height="370" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Op amp with capacitive feedback, input capacitance and load capacitance</title>
<rect width="600" height="370" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">Closed-loop amplifier with capacitive feedback</text>
<path d="M45.5 200 H50" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="42" cy="200" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="16.2" y="205" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="23.5" y="208.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">in</text>
<path d="M50 200 H156" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M156 200 H176 M184 200 H204" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M176 188 V212 M184 188 V212" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="180" y="182" font-size="13" text-anchor="middle" fill="#1a2230">C1</text>
<path d="M204 200 H320" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="250" cy="200" r="3.5" fill="#1a2230"/>
<text x="244" y="192" font-size="13" text-anchor="end" fill="#5a6577">X</text>
<path d="M250 200 V226" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M250 226 V246 M250 254 V274" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M238 246 H262 M238 254 H262" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="214.2" y="255" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">C</text>
<text x="221.5" y="258.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">in</text>
<path d="M250 274 V282" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M238 282 H262 M242 288 H258 M246 294 H254" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M320 180.0 V250.0 L390 215 Z" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="330" y="205" font-size="15" text-anchor="middle" fill="#1a2230">−</text>
<text x="330" y="235" font-size="15" text-anchor="middle" fill="#1a2230">+</text>
<text x="343.1" y="220" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">A</text>
<text x="350.4" y="223.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">0</text>
<path d="M300 230 H320" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M300 230 V250" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M300 250 V258" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M288 258 H312 M292 264 H308 M296 270 H304" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M390 215 H504" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="450" cy="215" r="3.5" fill="#1a2230"/>
<circle cx="480" cy="215" r="3.5" fill="#1a2230"/>
<circle cx="507.5" cy="215" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="518.0" y="220" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="525.3" y="223.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">out</text>
<path d="M250 200 V130 H356" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M356 130 H376 M384 130 H404" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M376 118 V142 M384 118 V142" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="380" y="112" font-size="13" text-anchor="middle" fill="#1a2230">C2</text>
<path d="M404 130 H450 V215" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M480 215 V241" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M480 241 V261 M480 269 V289" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M468 261 H492 M468 269 H492" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="498.0" y="270" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">C</text>
<text x="505.3" y="273.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">L</text>
<path d="M480 289 V297" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M468 297 H492 M472 303 H488 M476 309 H484" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="300.0" y="335" font-size="12" text-anchor="middle" fill="#5a6577">Gain ≈ −C1/C2. The feedback factor is β = C2/(C1 + C2 + Cin), and the op amp drives</text>
<text x="300.0" y="351" font-size="12" text-anchor="middle" fill="#5a6577">CL in parallel with C2 in series with (C1 + Cin).</text>

</svg>
