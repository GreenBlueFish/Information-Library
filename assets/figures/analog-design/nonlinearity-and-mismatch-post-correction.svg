<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" width="600" height="460" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Differential pair with diode-connected NMOS loads for post-correction</title>
<rect width="600" height="460" fill="#ffffff"/>
