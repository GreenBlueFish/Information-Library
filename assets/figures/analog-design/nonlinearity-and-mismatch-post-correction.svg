<text x="49.7" y="160" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="56.9" y="163.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">out1</text>
<circle cx="440" cy="155" r="3.5" fill="#1a2230"/>
<path d="M440 155 H508" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="512" cy="155" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="522.0" y="160" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="529.3" y="163.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">out2</text>
<path d="M100 210 H130" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M130 194 V226" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M136 192 V204 M136 206 V214 M136 216 V228" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M136 198 H160 V170" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M136 222 H160 V250" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M152 222 L144 217.5 V226.5 z" fill="#1a2230"/>
<text x="172" y="215" font-size="13" text-anchor="start" fill="#1a2230">M1</text>
<path d="M500 210 H470" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M470 194 V226" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M464 192 V204 M464 206 V214 M464 216 V228" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M464 198 H440 V170" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M464 222 H440 V250" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M448 222 L456 217.5 V226.5 z" fill="#1a2230"/>
<text x="428" y="215" font-size="13" text-anchor="end" fill="#1a2230">M2</text>
<path d="M100 210 H92" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="88" cy="210" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="54.9" y="215" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="62.2" y="218.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">in1</text>
<path d="M500 210 H508" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="512" cy="210" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="522.0" y="215" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="529.3" y="218.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">in2</text>
<path d="M160 250 V270 H440 V250" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="300" cy="270" r="3.5" fill="#1a2230"/>
<circle cx="300" cy="315" r="15" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<path d="M300 306 V324" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M295 319 L300 325 L305 319" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M300 270 V300" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M300 330 V360" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="321.0" y="320" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">I</text>
<text x="328.3" y="323.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">SS</text>
<path d="M300 360 V368" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M288 368 H312 M292 374 H308 M296 380 H304" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="300.0" y="415" font-size="12" text-anchor="middle" fill="#5a6577">M1-M2 turn the input voltage into currents through a square root; M3-M4 turn those</text>
<text x="300.0" y="431" font-size="12" text-anchor="middle" fill="#5a6577">currents back into voltage through the inverse function, so the gain sqrt((W/L)1,2</text>
<text x="300.0" y="447" font-size="12" text-anchor="middle" fill="#5a6577">/ (W/L)3,4) does not depend on the currents.</text>

</svg>
