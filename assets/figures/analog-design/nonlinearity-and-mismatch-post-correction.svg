<path d="M152 112 L144 107.5 V116.5 z" fill="#1a2230"/>
<text x="172" y="105" font-size="13" text-anchor="start" fill="#1a2230">M3</text>
<path d="M500 100 H470" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M470 84 V116" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M464 82 V94 M464 96 V104 M464 106 V118" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M464 88 H440 V60" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M464 112 H440 V140" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M448 112 L456 107.5 V116.5 z" fill="#1a2230"/>
<text x="428" y="105" font-size="13" text-anchor="end" fill="#1a2230">M4</text>
<path d="M100 100 V50 H160" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="160" cy="50" r="3.5" fill="#1a2230"/>
