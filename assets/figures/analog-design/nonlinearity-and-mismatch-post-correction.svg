<circle cx="440" cy="50" r="3.5" fill="#1a2230"/>
<path d="M160 140 V170" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M440 140 V170" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="160" cy="155" r="3.5" fill="#1a2230"/>
<path d="M160 155 H92" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
