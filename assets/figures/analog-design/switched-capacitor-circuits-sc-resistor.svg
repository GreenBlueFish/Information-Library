<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" width="620" height="320" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Switched-capacitor resistor and its resistor equivalent</title>
<rect width="620" height="320" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">A switched capacitor behaves like a resistor</text>
<path d="M55.5 150 H60" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="52" cy="150" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="31.5" y="155" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="38.7" y="158.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">A</text>
<path d="M60 150 H83" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="83" cy="150" r="3" fill="#1a2230"/>
<circle cx="127" cy="150" r="3" fill="#1a2230"/>
<path d="M83 150 L125 137" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="105.0" y="130" font-size="13" text-anchor="middle" fill="#1a2230">S1 (φ1)</text>
<path d="M127 150 H213" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="170" cy="150" r="3.5" fill="#1a2230"/>
<circle cx="213" cy="150" r="3" fill="#1a2230"/>
<circle cx="257" cy="150" r="3" fill="#1a2230"/>
<path d="M213 150 L255 137" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="235.0" y="130" font-size="13" text-anchor="middle" fill="#1a2230">S2 (φ2)</text>
<path d="M257 150 H292" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M292 150 H296.5" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="300" cy="150" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="308.0" y="155" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="315.3" y="158.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">B</text>
<path d="M170 150 V176" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M170 176 V196 M170 204 V224" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M158 196 H182 M158 204 H182" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="188.0" y="205" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">C</text>
<text x="195.3" y="208.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">S</text>
<path d="M170 224 V232" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M158 232 H182 M162 238 H178 M166 244 H174" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="370" y="155" font-size="22" text-anchor="middle" fill="#5a6577">≈</text>
<path d="M423.5 150 H428" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="420" cy="150" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="399.5" y="155" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="406.7" y="158.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">A</text>
<path d="M428 150 H450" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M450.0 150 H460.0 l5 -8 l10 16 l10 -16 l10 16 l5 -8 H510.0" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="471.1" y="136" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">R</text>
<text x="478.4" y="139.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">eq</text>
<path d="M510 150 H532" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M532 150 H536.5" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="540" cy="150" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="548.0" y="155" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="555.3" y="158.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">B</text>
<text x="310.0" y="290" font-size="12" text-anchor="middle" fill="#5a6577">Each clock period CS carries CS(VA − VB) from A to B, an average current CS fCK (VA −</text>
<text x="310.0" y="306" font-size="12" text-anchor="middle" fill="#5a6577">VB), so Req = 1/(CS fCK).</text>

</svg>
