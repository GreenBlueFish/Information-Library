<path d="M408 433 H432 M412 439 H428 M416 445 H424" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<circle cx="300" cy="36.5" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="312" y="41" font-size="12" text-anchor="start" fill="#5a6577">external VDD</text>
<text x="320.0" y="470" font-size="12" text-anchor="middle" fill="#5a6577">Charging CL by ΔV in Δt draws I ≈ CLΔV/Δt through LD (and discharging it, through LG).</text>
<text x="320.0" y="486" font-size="12" text-anchor="middle" fill="#5a6577">The on-chip rails then move by L·dI/dt: with CL = 0.5 pF, 1.2 V in 0.4 ns (1.5 mA) and 5</text>
<text x="320.0" y="502" font-size="12" text-anchor="middle" fill="#5a6577">nH that is about 19 mV per edge, multiplied by every gate switching at once.</text>
</g>

</svg>
