<text x="300.0" y="340" font-size="12" text-anchor="middle" fill="#5a6577">M2 copies IREF scaled by α = (W/L)2/(W/L)1; the PMOS pair M3–M4 copies that with β</text>
<text x="300.0" y="356" font-size="12" text-anchor="middle" fill="#5a6577">= (W/L)4/(W/L)3, so |Iout| = αβ·IREF.</text>

