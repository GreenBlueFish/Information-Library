<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 335" width="640" height="335" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Three inverters connected in a ring</title>
<rect width="640" height="335" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">A three-stage ring oscillator</text>
<path d="M110 116 V164 L154 140 Z" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="159" cy="140" r="5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<path d="M260 116 V164 L304 140 Z" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="309" cy="140" r="5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<path d="M410 116 V164 L454 140 Z" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="459" cy="140" r="5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<path d="M154 140" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M164 140 H260" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M314 140 H410" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M464 140 H520 V230 H70 V140 H110" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="520" cy="140" r="3.5" fill="#1a2230"/>
<path d="M520 140 H560" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M560 140 H564.5" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="568" cy="140" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="576" y="145" font-size="13" text-anchor="start" fill="#1a2230">out</text>
<text x="212" y="106" font-size="12" text-anchor="middle" fill="#5a6577">a</text>
<text x="362" y="106" font-size="12" text-anchor="middle" fill="#5a6577">b</text>
<text x="512" y="106" font-size="12" text-anchor="middle" fill="#5a6577">c</text>
<text x="300" y="290" font-size="13" text-anchor="middle" fill="#1a2230">An odd number of inverting stages never settles: each inverter flips the one before it.</text>
<text x="320.0" y="312" font-size="12" text-anchor="middle" fill="#5a6577">Period ≈ 2 · N · td for N stages with delay td each, so f ≈ 1/(2N·td).</text>

</svg>
