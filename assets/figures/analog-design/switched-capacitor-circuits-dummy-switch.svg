<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 375" width="560" height="375" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Sampling switch with a dummy transistor for charge-injection cancellation</title>
<rect width="560" height="375" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">Charge injection and a half-size dummy switch</text>
<path d="M55.5 188 H60" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="52" cy="188" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="26.2" y="193" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="33.5" y="196.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">in</text>
<path d="M60 188 H110" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M134 170 H166" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M150 170 V144" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M132 176 H144 M146 176 H154 M156 176 H168" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M138 176 V188 H110" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M162 176 V188 H190" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="150" cy="140.5" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="150" y="130" font-size="13" text-anchor="middle" fill="#1a2230">CK</text>
<text x="150" y="210" font-size="13" text-anchor="middle" fill="#1a2230">M1 (width W)</text>
<path d="M190 188 H270" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="230" cy="188" r="3.5" fill="#1a2230"/>
<circle cx="250" cy="188" r="3.5" fill="#1a2230"/>
<path d="M294 170 H326" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M310 170 V144" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M292 176 H304 M306 176 H314 M316 176 H328" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M298 176 V188 H270" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M322 176 V188 H350" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="310" cy="140.5" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="310" y="130" font-size="13" text-anchor="middle" fill="#1a2230" text-decoration="overline">CK</text>
<text x="310" y="210" font-size="13" text-anchor="middle" fill="#1a2230">M2 (width W/2)</text>
<path d="M350 188 V230 H250 V188" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="350" cy="188" r="3.5" fill="#1a2230"/>
<path d="M350 188 H400" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="404" cy="188" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="414.0" y="193" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="421.3" y="196.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">out</text>
<path d="M230 188 V216" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M230 216 V236 M230 244 V264" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M218 236 H242 M218 244 H242" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="199.5" y="245" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">C</text>
<text x="206.7" y="248.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">H</text>
<path d="M230 264 V272" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M218 272 H242 M222 278 H238 M226 284 H234" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="280.0" y="320" font-size="12" text-anchor="middle" fill="#5a6577">When M1 turns off, part of its channel charge lands on CH as an error. M2,</text>
<text x="280.0" y="336" font-size="12" text-anchor="middle" fill="#5a6577">with source and drain both on the output and driven by the complementary</text>
<text x="280.0" y="352" font-size="12" text-anchor="middle" fill="#5a6577">clock, turns on at the same moment and soaks up roughly that charge.</text>

</svg>
