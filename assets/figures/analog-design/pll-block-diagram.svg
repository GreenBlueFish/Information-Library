<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 375" width="700" height="375" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>PLL block diagram: PFD, charge pump, loop filter, VCO and divider</title>
<rect width="700" height="375" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">Phase-locked loop: blocks</text>
<path d="M53.5 140 H58" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="50" cy="140" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="18.9" y="145" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">f</text>
<text x="26.2" y="148.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">ref</text>
<path d="M58 140 L108 140" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M108 140 L99.9 143.9 L99.9 136.1 z" fill="#1a2230"/>
<rect x="110" y="100" width="100" height="80" rx="6" fill="#eef1f6" stroke="#5a6577" stroke-width="1.5"/>
<text x="160.0" y="138.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">PFD</text>
<text x="160.0" y="155.0" font-size="11" text-anchor="middle" fill="#5a6577">phase detector</text>
<path d="M210 140 L250 140" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M250 140 L241.9 143.9 L241.9 136.1 z" fill="#1a2230"/>
<rect x="250" y="100" width="90" height="80" rx="6" fill="#eef1f6" stroke="#5a6577" stroke-width="1.5"/>
<text x="295.0" y="138.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">CP</text>
<text x="295.0" y="155.0" font-size="11" text-anchor="middle" fill="#5a6577">charge pump</text>
<path d="M340 140 L380 140" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M380 140 L371.9 143.9 L371.9 136.1 z" fill="#1a2230"/>
<rect x="380" y="100" width="90" height="80" rx="6" fill="#eef1f6" stroke="#5a6577" stroke-width="1.5"/>
<text x="425.0" y="138.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">LF</text>
<text x="425.0" y="155.0" font-size="11" text-anchor="middle" fill="#5a6577">loop filter</text>
<path d="M470 140 L510 140" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M510 140 L501.9 143.9 L501.9 136.1 z" fill="#1a2230"/>
<rect x="510" y="100" width="90" height="80" rx="6" fill="#eef1f6" stroke="#5a6577" stroke-width="1.5"/>
<text x="555.0" y="145.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">VCO</text>
<path d="M600 140 L650 140" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M650 140 L641.9 143.9 L641.9 136.1 z" fill="#1a2230"/>
<circle cx="625" cy="140" r="3.5" fill="#1a2230"/>
<path d="M650 140 H654.5" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="658" cy="140" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="666.0" y="145" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">f</text>
<text x="673.3" y="148.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">out</text>
<path d="M625 140 V250 H320" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M330 250 L282 250" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M282 250 L290.1 246.1 L290.1 253.9 z" fill="#1a2230"/>
<rect x="190" y="220" width="90" height="60" rx="6" fill="#eef1f6" stroke="#5a6577" stroke-width="1.5"/>
<text x="235.0" y="248.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">÷ N</text>
<text x="235.0" y="265.0" font-size="11" text-anchor="middle" fill="#5a6577">divider</text>
<path d="M190 250 H160 V212" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M160 230 L160 182" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M160 182 L163.9 190.1 L156.1 190.1 z" fill="#1a2230"/>
<text x="350.0" y="330" font-size="12" text-anchor="middle" fill="#1a2230">The loop adjusts the VCO until fout / N has the same frequency and phase as fref,</text>
<text x="350.0" y="350" font-size="12" text-anchor="middle" fill="#1a2230">so fout = N · fref and the output inherits the reference's accuracy.</text>

</svg>
