<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Parasitic pnp and npn bipolar transistors with well and substrate resistances forming a latch</title>
<rect width="640" height="480" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">The parasitic thyristor behind latch-up</text>
<path d="M150 70 H354" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M250 58 V70" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M238 58 H262" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="266" y="62" font-size="13" text-anchor="start" fill="#1a2230">VDD</text>
<path d="M150 70 V85" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M150 85.0 V95.0 l8 5 l-16 10 l16 10 l-16 10 l8 5 V145.0" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="134" y="120" font-size="13" text-anchor="end" fill="#1a2230">R1 (n-well)</text>
<path d="M150 145 V160" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M150 160 H300" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="206" cy="160" r="3.5" fill="#1a2230"/>
<text x="196" y="152" font-size="13" text-anchor="end" fill="#2f6fed" font-weight="600">Y</text>
<path d="M300 160 H330" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M330 142 V178" fill="none" stroke="#1a2230" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M330 152 L354 136 V120" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M330 168 L354 184 V200" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M334.0 149.3 L338.6 141.5 L342.9 148.1 z" fill="#1a2230"/>
<path d="M354 120 V70" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="370" y="150" font-size="13" text-anchor="start" fill="#1a2230">Q1 (pnp)</text>
<text x="370" y="168" font-size="11" text-anchor="start" fill="#5a6577">PMOS source / n-well / p-sub</text>
<path d="M260 310 H230" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M230 292 V328" fill="none" stroke="#1a2230" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M230 302 L206 286 V270" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M230 318 L206 334 V350" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M210.0 331.3 L214.6 323.5 L218.9 330.1 z" fill="#1a2230"/>
<path d="M206 270 V160" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="190" y="300" font-size="13" text-anchor="end" fill="#1a2230">Q2 (npn)</text>
<text x="190" y="318" font-size="11" text-anchor="end" fill="#5a6577">NMOS source / p-sub / n-well</text>
<path d="M354 200 V310 H260" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="354" cy="310" r="3.5" fill="#1a2230"/>
<text x="366" y="304" font-size="13" text-anchor="start" fill="#2f6fed" font-weight="600">X</text>
<path d="M354 310 H440 V325" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M440 325.0 V335.0 l8 5 l-16 10 l16 10 l-16 10 l8 5 V385.0" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="456" y="360" font-size="13" text-anchor="start" fill="#1a2230">R2 (substrate)</text>
<path d="M440 385 V400" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M440 400 V408" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M428 408 H452 M432 414 H448 M436 420 H444" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M206 350 V400" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M206 400 V408" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M194 408 H218 M198 414 H214 M202 420 H210" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="320.0" y="445" font-size="12" text-anchor="middle" fill="#5a6577">Each transistor's collector drives the other's base: a positive-feedback loop. If a</text>
<text x="320.0" y="461" font-size="12" text-anchor="middle" fill="#5a6577">disturbance lifts X or pulls Y down and the loop gain reaches one, both turn fully on and</text>
<text x="320.0" y="477" font-size="12" text-anchor="middle" fill="#5a6577">short VDD to ground.</text>

</svg>
