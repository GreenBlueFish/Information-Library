<text x="280.0" y="330" font-size="12" text-anchor="middle" fill="#5a6577">Both noise currents flow into RD: the output noise is (4kTγgm + 4kT/RD) RD²</text>
<text x="280.0" y="346" font-size="12" text-anchor="middle" fill="#5a6577">per hertz. Dividing by (gm RD)² refers it to the gate.</text>
