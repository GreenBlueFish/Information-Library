<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 750" width="800" height="750" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Three loop filters: second-order passive, third-order passive and active op-amp</title>
<rect width="800" height="750" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">Loop filters for a charge-pump PLL</text>
<text x="30" y="66" font-size="13" text-anchor="start" fill="#1a2230" font-weight="600" xml:space="preserve">(a) second-order passive</text>
<path d="M40 118 L100 118" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M100 118 L91.9 121.9 L91.9 114.1 z" fill="#1a2230"/>
<text x="56.1" y="106" font-size="12" text-anchor="start" fill="#1a2230" xml:space="preserve">I<tspan dy="3.0" font-size="8.6">CP</tspan><tspan dy="-3.0">​</tspan></text>
<circle cx="100" cy="118" r="3.5" fill="#1a2230"/>
<path d="M100 118 H190" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="190" cy="118" r="3.5" fill="#1a2230"/>
<text x="132.1" y="108" font-size="12" text-anchor="start" fill="#1a2230" xml:space="preserve">V<tspan dy="3.0" font-size="8.6">cont</tspan><tspan dy="-3.0">​</tspan></text>
<path d="M100 118 V178" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M100 178 V198 M100 206 V226" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M88 198 H112 M88 206 H112" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="118.0" y="207" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">C</text>
<text x="126.8" y="210.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">2</text>
<path d="M100 226 V234" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M88 234 H112 M92 240 H108 M96 246 H104" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M190 118.0 V128.0 l8 5 l-16 10 l16 10 l-16 10 l8 5 V178.0" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="206" y="153" font-size="13" text-anchor="start" fill="#1a2230">R</text>
<path d="M190 178 V198 M190 206 V226" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M178 198 H202 M178 206 H202" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="208.0" y="207" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">C</text>
<text x="216.8" y="210.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">1</text>
<path d="M190 226 V234" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M178 234 H202 M182 240 H198 M186 246 H194" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="520" y="120" font-size="12" text-anchor="start" fill="#1a2230" font-weight="600" xml:space="preserve">Second order</text>
<text x="520.0" y="137" font-size="12" text-anchor="start" fill="#5a6577" xml:space="preserve">R with C<tspan dy="3.0" font-size="8.6">1</tspan><tspan dy="-3.0"> gives a zero for phase</tspan></text>
<text x="520.0" y="154" font-size="12" text-anchor="start" fill="#5a6577" xml:space="preserve">margin; C<tspan dy="3.0" font-size="8.6">2</tspan><tspan dy="-3.0"> adds a pole that smooths</tspan></text>
<text x="520.0" y="171" font-size="12" text-anchor="start" fill="#5a6577" xml:space="preserve">the charge-pump ripple on V<tspan dy="3.0" font-size="8.6">cont</tspan><tspan dy="-3.0">.</tspan></text>
<text x="30" y="281" font-size="13" text-anchor="start" fill="#1a2230" font-weight="600" xml:space="preserve">(b) third-order passive</text>
<path d="M40 333 L100 333" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M100 333 L91.9 336.9 L91.9 329.1 z" fill="#1a2230"/>
<text x="56.1" y="321" font-size="12" text-anchor="start" fill="#1a2230" xml:space="preserve">I<tspan dy="3.0" font-size="8.6">CP</tspan><tspan dy="-3.0">​</tspan></text>
<circle cx="100" cy="333" r="3.5" fill="#1a2230"/>
<path d="M100 333 H190" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="190" cy="333" r="3.5" fill="#1a2230"/>
<text x="132.1" y="323" font-size="12" text-anchor="start" fill="#1a2230" xml:space="preserve">V<tspan dy="3.0" font-size="8.6">cont</tspan><tspan dy="-3.0">​</tspan></text>
<path d="M100 333 V393" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M100 393 V413 M100 421 V441" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M88 413 H112 M88 421 H112" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="118.0" y="422" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">C</text>
<text x="126.8" y="425.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">2</text>
<path d="M100 441 V449" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M88 449 H112 M92 455 H108 M96 461 H104" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M190 333.0 V343.0 l8 5 l-16 10 l16 10 l-16 10 l8 5 V393.0" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="206" y="368" font-size="13" text-anchor="start" fill="#1a2230">R</text>
<path d="M190 393 V413 M190 421 V441" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M178 413 H202 M178 421 H202" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="208.0" y="422" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">C</text>
<text x="216.8" y="425.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">1</text>
<path d="M190 441 V449" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M178 449 H202 M182 455 H198 M186 461 H194" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M190 333 H220" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M220.0 333 H230.0 l5 -8 l10 16 l10 -16 l10 16 l5 -8 H280.0" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="243.5" y="317" font-size="12" text-anchor="start" fill="#1a2230" xml:space="preserve">R<tspan dy="3.0" font-size="8.6">3</tspan><tspan dy="-3.0">​</tspan></text>
<path d="M280 333 H310" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="310" cy="333" r="3.5" fill="#1a2230"/>
<path d="M310 333 V393" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M310 393 V413 M310 421 V441" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M298 413 H322 M298 421 H322" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="328.0" y="422" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">C</text>
<text x="336.8" y="425.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">3</text>
<path d="M310 441 V449" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M298 449 H322 M302 455 H318 M306 461 H314" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M310 333 H362" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M362 333 H366.5" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="370" cy="333" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="378.0" y="338" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="386.8" y="341.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">tune</text>
<text x="520" y="335" font-size="12" text-anchor="start" fill="#1a2230" font-weight="600" xml:space="preserve">Third order</text>
<text x="520.0" y="352" font-size="12" text-anchor="start" fill="#5a6577" xml:space="preserve">R<tspan dy="3.0" font-size="8.6">3</tspan><tspan dy="-3.0"> and </tspan>C<tspan dy="3.0" font-size="8.6">3</tspan><tspan dy="-3.0"> add one more pole, so the</tspan></text>
<text x="520.0" y="369" font-size="12" text-anchor="start" fill="#5a6577" xml:space="preserve">reference spur on V<tspan dy="3.0" font-size="8.6">tune</tspan><tspan dy="-3.0"> is smaller,</tspan></text>
<text x="520" y="386" font-size="12" text-anchor="start" fill="#5a6577" xml:space="preserve">at some cost in phase margin.</text>
<text x="30" y="496" font-size="13" text-anchor="start" fill="#1a2230" font-weight="600" xml:space="preserve">(c) active (op-amp) filter</text>
<path d="M50 593 L150 593" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M150 593 L141.9 596.9 L141.9 589.1 z" fill="#1a2230"/>
<text x="90.1" y="585" font-size="12" text-anchor="start" fill="#1a2230" xml:space="preserve">I<tspan dy="3.0" font-size="8.6">CP</tspan><tspan dy="-3.0">​</tspan></text>
<circle cx="150" cy="593" r="3.5" fill="#1a2230"/>
<path d="M150 593 H230" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M93.5 621 H98" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="90" cy="621" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="61.1" y="626" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="70.0" y="629.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">ref</text>
<path d="M98 621 H230" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M230 577 V637 L290 607 Z" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="240" y="597" font-size="14" text-anchor="middle" fill="#5a6577" xml:space="preserve">−</text>
<text x="240" y="625" font-size="14" text-anchor="middle" fill="#5a6577" xml:space="preserve">+</text>
<path d="M150 593 V522" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="150" cy="562" r="3.5" fill="#1a2230"/>
<path d="M150 562 H180" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M180.0 562 H190.0 l5 -8 l10 16 l10 -16 l10 16 l5 -8 H240.0" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="210" y="546" font-size="12" text-anchor="middle" fill="#1a2230" xml:space="preserve">R</text>
<path d="M240 562 H261" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M261 562 H281 M289 562 H309" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M281 550 V574 M289 550 V574" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="278.9" y="544" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">C</text>
<text x="287.7" y="547.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">1</text>
<path d="M309 562 H360" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M150 522 H231" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M231 522 H251 M259 522 H279" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M251 510 V534 M259 510 V534" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="247.9" y="504" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">C</text>
<text x="256.8" y="507.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">2</text>
<path d="M279 522 H360" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M290 607 H360" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="360" cy="607" r="3.5" fill="#1a2230"/>
<path d="M360 607 V522" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="360" cy="562" r="3.5" fill="#1a2230"/>
<path d="M360 607 H410" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M410 607 H414.5" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="418" cy="607" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="426.0" y="612" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="434.8" y="615.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">cont</text>
<text x="520" y="560" font-size="12" text-anchor="start" fill="#1a2230" font-weight="600" xml:space="preserve">Active</text>
<text x="520.0" y="577" font-size="12" text-anchor="start" fill="#5a6577" xml:space="preserve">The op-amp holds the pump node at V<tspan dy="3.0" font-size="8.6">ref</tspan><tspan dy="-3.0">,</tspan></text>
<text x="520.0" y="594" font-size="12" text-anchor="start" fill="#5a6577" xml:space="preserve">so the pump sees a fixed voltage and V<tspan dy="3.0" font-size="8.6">cont</tspan><tspan dy="-3.0">​</tspan></text>
<text x="520" y="611" font-size="12" text-anchor="start" fill="#5a6577" xml:space="preserve">can swing wider. The sign inverts, so</text>
<text x="520" y="628" font-size="12" text-anchor="start" fill="#5a6577" xml:space="preserve">UP and DN are swapped.</text>
<text x="400.0" y="706" font-size="12" text-anchor="middle" fill="#5a6577" xml:space="preserve">(a) is the usual choice; (b) buys extra spur filtering; (c) is used when the control range must exceed the charge pump's</text>
<text x="400.0" y="722" font-size="12" text-anchor="middle" fill="#5a6577" xml:space="preserve">output compliance.</text>

</svg>
