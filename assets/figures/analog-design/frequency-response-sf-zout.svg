<text x="483.4" y="368.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">m</text>
<text x="491.5" y="365" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">)</text>
<text x="300.0" y="400" font-size="12" text-anchor="middle" fill="#5a6577">When RS > 1/gm the output impedance rises from 1/gm at low frequency to RS at high</text>
<text x="300.0" y="416" font-size="12" text-anchor="middle" fill="#5a6577">frequency: it behaves like an inductor.</text>

