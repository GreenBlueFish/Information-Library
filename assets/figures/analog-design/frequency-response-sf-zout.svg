<text x="437.6" y="368.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">S</text>
<text x="444.2" y="365" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve"> − 1/</text>
