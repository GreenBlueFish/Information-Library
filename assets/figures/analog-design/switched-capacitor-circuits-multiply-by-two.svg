<text x="135.0" y="130" font-size="13" text-anchor="middle" fill="#1a2230">S1</text>
<circle cx="113" cy="230" r="3" fill="#1a2230"/>
<circle cx="157" cy="230" r="3" fill="#1a2230"/>
<path d="M113 230 L155 217" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="135.0" y="252" font-size="13" text-anchor="middle" fill="#1a2230">S2</text>
<path d="M157 150 H201" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="180" cy="150" r="3.5" fill="#1a2230"/>
<path d="M201 150 H221 M229 150 H249" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M221 138 V162 M229 138 V162" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="225" y="132" font-size="13" text-anchor="middle" fill="#1a2230">C1</text>
<path d="M249 150 H290 V230 H249" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M201 230 H221 M229 230 H249" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M221 218 V242 M229 218 V242" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="225" y="260" font-size="13" text-anchor="middle" fill="#1a2230">C2</text>
<path d="M157 230 H201" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="180" cy="230" r="3.5" fill="#1a2230"/>
<circle cx="290" cy="190" r="3.5" fill="#1a2230"/>
<path d="M290 190 H340" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="300" y="182" font-size="13" text-anchor="start" fill="#5a6577">X</text>
<circle cx="290" cy="150" r="3.5" fill="#1a2230"/>
<path d="M340 170.0 V240.0 L410 205 Z" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="350" y="195" font-size="15" text-anchor="middle" fill="#1a2230">−</text>
<text x="350" y="225" font-size="15" text-anchor="middle" fill="#1a2230">+</text>
<path d="M340 220 H320 V240" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M320 240 V248" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M308 248 H332 M312 254 H328 M316 260 H324" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M410 205 H544" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="480" cy="205" r="3.5" fill="#1a2230"/>
<circle cx="500" cy="205" r="3.5" fill="#1a2230"/>
<circle cx="548" cy="205" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="558.0" y="210" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="565.3" y="213.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">out</text>
<path d="M290 150 V100 H353" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="353" cy="100" r="3" fill="#1a2230"/>
<circle cx="397" cy="100" r="3" fill="#1a2230"/>
<path d="M353 100 L395 87" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="375.0" y="80" font-size="13" text-anchor="middle" fill="#1a2230">S3</text>
<path d="M397 100 H480 V205" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M180 150 V60 H353" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="353" cy="60" r="3" fill="#1a2230"/>
<circle cx="397" cy="60" r="3" fill="#1a2230"/>
<path d="M353 60 L395 47" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="375.0" y="40" font-size="13" text-anchor="middle" fill="#1a2230">S4</text>
<path d="M397 60 H500 V205" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M180 230 V258" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="180" cy="258" r="3" fill="#1a2230"/>
<circle cx="180" cy="292" r="3" fill="#1a2230"/>
<path d="M180 258 L193 290" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="170" y="280.0" font-size="13" text-anchor="end" fill="#1a2230">S5</text>
<path d="M180 292 V300" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M168 300 H192 M172 306 H188 M176 312 H184" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="310.0" y="345" font-size="12" text-anchor="middle" fill="#5a6577">Sample: S1, S2, S3 closed; C1 = C2 = C both charge to Vin. Amplify: S3 opens first, S4</text>
<text x="310.0" y="361" font-size="12" text-anchor="middle" fill="#5a6577">puts C1 around the op amp and S5 grounds C2. C2's charge moves onto C1, so Vout ≈ 2</text>
<text x="310.0" y="377" font-size="12" text-anchor="middle" fill="#5a6577">Vin with a feedback factor of about 1/2.</text>

</svg>
