<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 390" width="620" height="390" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Multiply-by-two switched-capacitor circuit</title>
<rect width="620" height="390" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">Precision multiply-by-two circuit</text>
<path d="M35.5 190 H40" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="32" cy="190" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="6.2" y="195" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="13.5" y="198.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">in</text>
<path d="M40 190 H90 V150 H113" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M90 190 V230 H113" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="90" cy="190" r="3.5" fill="#1a2230"/>
<circle cx="113" cy="150" r="3" fill="#1a2230"/>
<circle cx="157" cy="150" r="3" fill="#1a2230"/>
