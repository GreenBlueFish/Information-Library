<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 365" width="660" height="365" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>LC tank with a varactor for frequency tuning</title>
<rect width="660" height="365" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">The LC tank of a VCO, tuned by a varactor</text>
<path d="M200 120 H460" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M200 120 V150" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M200 150 V156 a6 6 0 0 1 0 12 a6 6 0 0 1 0 12 a6 6 0 0 1 0 12 V210" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="184" y="185" font-size="13" text-anchor="end" fill="#1a2230">L</text>
<path d="M200 210 V270 H460" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="330" cy="120" r="3.5" fill="#1a2230"/>
<path d="M330 120 V151" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M330 151 V171 M330 179 V199" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M318 171 H342 M318 179 H342" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="352.0" y="180" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">C</text>
<text x="359.3" y="183.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">fixed</text>
<path d="M330 199 V270" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="330" cy="270" r="3.5" fill="#1a2230"/>
<path d="M460 120 V151" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M460 151 V171 M460 179 V199" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M448 171 H472 M448 179 H472" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M460 199 V270" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M440 205 L482 145" fill="none" stroke="#2f6fed" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M482 145 l-9 3 l5 6 z" fill="#2f6fed"/>
<text x="500.0" y="172" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">C</text>
<text x="507.3" y="175.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">var</text>
<text x="500" y="190" font-size="11" text-anchor="start" fill="#5a6577">(its value follows</text>
<text x="500" y="205" font-size="11" text-anchor="start" fill="#5a6577">the tuning voltage)</text>
<text x="330.0" y="320" font-size="12" text-anchor="middle" fill="#5a6577">f0 = 1 / (2π√(L·Ctotal)). Changing the tuning voltage changes Cvar, which moves the</text>
<text x="330.0" y="336" font-size="12" text-anchor="middle" fill="#5a6577">oscillation frequency.</text>

</svg>
