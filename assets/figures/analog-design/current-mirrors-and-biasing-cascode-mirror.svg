<text x="375.3" y="103.6" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">out</text>
<path d="M396 130 L396 160" fill="none" stroke="#2f6fed" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M396 160 L392.1 151.9 L399.9 151.9 z" fill="#2f6fed"/>
<text x="148" y="262" font-size="13" text-anchor="end" fill="#5a6577">X</text>
<text x="392" y="270" font-size="13" text-anchor="start" fill="#5a6577">Y</text>
<text x="262" y="203" font-size="13" text-anchor="start" fill="#5a6577">N</text>
<text x="270.0" y="410" font-size="12" text-anchor="middle" fill="#5a6577">VN = VGS0 + VGS1, so VY = VX and M2 copies IREF without channel-length</text>
<text x="270.0" y="426" font-size="12" text-anchor="middle" fill="#5a6577">error. The output needs Vout ≥ 2Vov + VTH.</text>

</svg>
