<text x="320.0" y="380" font-size="12" text-anchor="middle" fill="#5a6577">Below threshold ID is exponential in VGS: each S (about 70 to 100 mV) of gate voltage</text>
<text x="320.0" y="396" font-size="12" text-anchor="middle" fill="#5a6577">changes it tenfold. A higher drain voltage lowers the barrier (DIBL), shifting the curve</text>
<text x="320.0" y="412" font-size="12" text-anchor="middle" fill="#5a6577">left.</text>

