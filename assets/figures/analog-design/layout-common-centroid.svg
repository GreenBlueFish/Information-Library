<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Top views of an ABBA row with dummies and a two-by-two cross-quad</title>
<rect width="720" height="320" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">Cancelling gradients: 1-D cross-coupling and the 2-D common centroid</text>
<text x="200" y="62" font-size="13" text-anchor="middle" fill="#1a2230" font-weight="600">(a) one row: A B B A</text>
<rect x="40" y="90" width="48" height="80" fill="#e6e6e6" stroke="#5a6577" stroke-width="1.2"/>
<text x="64" y="136" font-size="12" text-anchor="middle" fill="#5a6577">d</text>
<rect x="95" y="90" width="48" height="80" fill="#cfe0ff" stroke="#5a6577" stroke-width="1.2"/>
<text x="119" y="136" font-size="16" text-anchor="middle" fill="#1a2230" font-weight="600">A</text>
<rect x="150" y="90" width="48" height="80" fill="#f7cfd4" stroke="#5a6577" stroke-width="1.2"/>
<text x="174" y="136" font-size="16" text-anchor="middle" fill="#1a2230" font-weight="600">B</text>
<rect x="205" y="90" width="48" height="80" fill="#f7cfd4" stroke="#5a6577" stroke-width="1.2"/>
<text x="229" y="136" font-size="16" text-anchor="middle" fill="#1a2230" font-weight="600">B</text>
<rect x="260" y="90" width="48" height="80" fill="#cfe0ff" stroke="#5a6577" stroke-width="1.2"/>
<text x="284" y="136" font-size="16" text-anchor="middle" fill="#1a2230" font-weight="600">A</text>
<rect x="315" y="90" width="48" height="80" fill="#e6e6e6" stroke="#5a6577" stroke-width="1.2"/>
<text x="339" y="136" font-size="12" text-anchor="middle" fill="#5a6577">d</text>
<path d="M60 200 L350 200" fill="none" stroke="#b00020" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M350 200 L341.9 203.9 L341.9 196.1 z" fill="#b00020"/>
<text x="205" y="222" font-size="12" text-anchor="middle" fill="#b00020">linear gradient (e.g. oxide thickness)</text>
<text x="560" y="62" font-size="13" text-anchor="middle" fill="#1a2230" font-weight="600">(b) two rows: cross-quad</text>
<rect x="480" y="90" width="78" height="62" fill="#cfe0ff" stroke="#5a6577" stroke-width="1.2"/>
<text x="519" y="128" font-size="16" text-anchor="middle" fill="#1a2230" font-weight="600">A</text>
<rect x="565" y="90" width="78" height="62" fill="#f7cfd4" stroke="#5a6577" stroke-width="1.2"/>
<text x="604" y="128" font-size="16" text-anchor="middle" fill="#1a2230" font-weight="600">B</text>
<rect x="480" y="160" width="78" height="62" fill="#f7cfd4" stroke="#5a6577" stroke-width="1.2"/>
<text x="519" y="198" font-size="16" text-anchor="middle" fill="#1a2230" font-weight="600">B</text>
<rect x="565" y="160" width="78" height="62" fill="#cfe0ff" stroke="#5a6577" stroke-width="1.2"/>
<text x="604" y="198" font-size="16" text-anchor="middle" fill="#1a2230" font-weight="600">A</text>
<text x="360.0" y="270" font-size="12" text-anchor="middle" fill="#5a6577">In (a) each device's two halves sit symmetrically about the centre, so a linear gradient adds the</text>
<text x="360.0" y="286" font-size="12" text-anchor="middle" fill="#5a6577">same total to A and B. In (b) the diagonal placement cancels gradients along both axes. Dummies (d)</text>
<text x="360.0" y="302" font-size="12" text-anchor="middle" fill="#5a6577">give the outer units the same neighbours as the inner ones.</text>

</svg>
