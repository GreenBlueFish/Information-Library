<text x="280.0" y="390" font-size="12" text-anchor="middle" fill="#5a6577">M3 needs about one overdrive and M2 a full VGS on top of it, so node X cannot</text>
<text x="280.0" y="406" font-size="12" text-anchor="middle" fill="#5a6577">swing as low as it could without the follower: the level shift costs about</text>
<text x="280.0" y="422" font-size="12" text-anchor="middle" fill="#5a6577">VGS2 of headroom.</text>

