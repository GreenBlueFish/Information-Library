<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 345" width="600" height="345" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Feedback model of an oscillator</title>
<rect width="600" height="345" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">An oscillator seen as a feedback loop</text>
<path d="M63.5 130 H68" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="60" cy="130" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="52" y="135" font-size="13" text-anchor="end" fill="#1a2230">noise</text>
<path d="M68 130 L132 130" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M132 130 L123.9 133.9 L123.9 126.1 z" fill="#1a2230"/>
<circle cx="150" cy="130" r="18" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<path d="M143 130 H157 M150 123 V137" fill="none" stroke="#1a2230" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="126" y="122" font-size="13" text-anchor="middle" fill="#5a6577">+</text>
<text x="158" y="163" font-size="15" text-anchor="middle" fill="#5a6577">−</text>
<path d="M168 130 L250 130" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M250 130 L241.9 133.9 L241.9 126.1 z" fill="#1a2230"/>
<rect x="250" y="100" width="130" height="60" rx="0" fill="#eef1f6"/>
<path d="M250 100 H380 V160 H250 Z" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="315.0" y="128.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">H(s)</text>
<text x="315.0" y="145.0" font-size="11" text-anchor="middle" fill="#5a6577">amplifier</text>
<path d="M380 130 L500 130" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M500 130 L491.9 133.9 L491.9 126.1 z" fill="#1a2230"/>
<circle cx="450" cy="130" r="3.5" fill="#1a2230"/>
<path d="M500 130 H504.5" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="508" cy="130" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="516.0" y="135" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="523.3" y="138.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">out</text>
<path d="M450 130 V220 H150" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M150 220 L150 148" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M150 148 L153.9 156.1 L146.1 156.1 z" fill="#1a2230"/>
<text x="300.0" y="270" font-size="13" text-anchor="middle" fill="#1a2230">Oscillation at ω0 needs |H(jω0)| ≥ 1 and an extra 180° of phase from H, so</text>
<text x="300.0" y="287" font-size="13" text-anchor="middle" fill="#1a2230">the fed-back signal adds to itself.</text>
<text x="300.0" y="312" font-size="12" text-anchor="middle" fill="#5a6577">In practice the small-signal loop gain is made two to three times the minimum so</text>
<text x="300.0" y="328" font-size="12" text-anchor="middle" fill="#5a6577">the circuit starts over all corners.</text>

</svg>
