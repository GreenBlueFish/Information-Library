<text x="330.0" y="395" font-size="12" text-anchor="middle" fill="#5a6577">The dominant pole is placed so the loop gain, not the open-loop gain, falls to one at the</text>
<text x="330.0" y="411" font-size="12" text-anchor="middle" fill="#5a6577">second pole (about 45° of phase margin). The closed-loop bandwidth then extends to about</text>
<text x="330.0" y="427" font-size="12" text-anchor="middle" fill="#5a6577">ωp2.</text>

