<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" width="680" height="270" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Cascade of two ideal amplifiers with an RC at each node</title>
<rect width="680" height="270" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">A cascade of stages: one pole per node</text>
