<circle cx="50" cy="110" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="24.3" y="115" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="33.4" y="118.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">in</text>
<path d="M58 110 H80" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M80.0 110 H90.0 l5 -8 l10 16 l10 -16 l10 16 l5 -8 H140.0" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="102.2" y="94" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">R</text>
<text x="111.3" y="97.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">S</text>
<path d="M140 110 H190" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="165" cy="110" r="3.5" fill="#1a2230"/>
<path d="M165 110 V136" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M165 136 V156 M165 164 V184" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M153 156 H177 M153 164 H177" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="183.0" y="165" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">C</text>
<text x="192.1" y="168.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">in</text>
<path d="M165 184 V192" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M153 192 H177 M157 198 H173 M161 204 H169" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<rect x="190" y="85" width="60" height="50" rx="4" fill="#eef1f6"/>
<path d="M190 85 H250 V135 H190 Z" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="212.0" y="115.0" font-size="14" text-anchor="start" fill="#1a2230" font-weight="600" xml:space="preserve">A</text>
<text x="221.8" y="118.5" font-size="10.1" text-anchor="start" fill="#1a2230" font-weight="600" xml:space="preserve">1</text>
<path d="M250 110 H260" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M260.0 110 H270.0 l5 -8 l10 16 l10 -16 l10 16 l5 -8 H320.0" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="282.5" y="94" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">R</text>
<text x="291.6" y="97.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">1</text>
<path d="M320 110 H370" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="345" cy="110" r="3.5" fill="#1a2230"/>
<path d="M345 110 V136" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M345 136 V156 M345 164 V184" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M333 156 H357 M333 164 H357" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="363.0" y="165" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">C</text>
<text x="372.1" y="168.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">N</text>
<path d="M345 184 V192" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M333 192 H357 M337 198 H353 M341 204 H349" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<rect x="370" y="85" width="60" height="50" rx="4" fill="#eef1f6"/>
<path d="M370 85 H430 V135 H370 Z" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="392.0" y="115.0" font-size="14" text-anchor="start" fill="#1a2230" font-weight="600" xml:space="preserve">A</text>
<text x="401.8" y="118.5" font-size="10.1" text-anchor="start" fill="#1a2230" font-weight="600" xml:space="preserve">2</text>
<path d="M430 110 H440" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M440.0 110 H450.0 l5 -8 l10 16 l10 -16 l10 16 l5 -8 H500.0" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="462.5" y="94" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">R</text>
<text x="471.6" y="97.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">2</text>
<path d="M500 110 H592" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="530" cy="110" r="3.5" fill="#1a2230"/>
<path d="M530 110 V136" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M530 136 V156 M530 164 V184" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M518 156 H542 M518 164 H542" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<text x="548.0" y="165" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">C</text>
<text x="557.1" y="168.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">P</text>
<path d="M530 184 V192" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M518 192 H542 M522 198 H538 M526 204 H534" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M592 110 H596.5" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="600" cy="110" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="608.0" y="115" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="617.1" y="118.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">out</text>
<text x="165" y="74" font-size="12" text-anchor="middle" fill="#5a6577">M</text>
<text x="345" y="74" font-size="12" text-anchor="middle" fill="#5a6577">N</text>
<text x="530" y="74" font-size="12" text-anchor="middle" fill="#5a6577">P</text>
<text x="340.0" y="235" font-size="12" text-anchor="middle" fill="#5a6577">Each node has a resistance R and a capacitance C to ground and gives a pole at 1/(RC): here</text>
<text x="340.0" y="251" font-size="12" text-anchor="middle" fill="#5a6577">1/(RS Cin), 1/(R1 CN) and 1/(R2 CP).</text>

</svg>
