<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Small-signal degenerated common-source stage with the transistor drawn as a current source I1</title>
<rect width="560" height="420" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">Bode's method: the transistor as a controlled source</text>
