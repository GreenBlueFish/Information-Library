<text x="180" y="190" font-size="12" text-anchor="middle" fill="#5a6577">G</text>
<circle cx="380" cy="140" r="3.5" fill="#1a2230"/>
<path d="M380 140 H452" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M452 140 H456.5" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="460" cy="140" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="468.0" y="145" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="475.3" y="148.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">out</text>
<text x="205.0" y="236" font-size="12" text-anchor="start" fill="#2f6fed" xml:space="preserve">V</text>
<text x="211.7" y="239.0" font-size="8.6" text-anchor="start" fill="#2f6fed" xml:space="preserve">1</text>
<text x="216.5" y="236" font-size="12" text-anchor="start" fill="#2f6fed" xml:space="preserve"> = </text>
<text x="236.7" y="236" font-size="12" text-anchor="start" fill="#2f6fed" xml:space="preserve">V</text>
<text x="243.4" y="239.0" font-size="8.6" text-anchor="start" fill="#2f6fed" xml:space="preserve">in</text>
<text x="253.0" y="236" font-size="12" text-anchor="start" fill="#2f6fed" xml:space="preserve"> − </text>
<text x="273.2" y="236" font-size="12" text-anchor="start" fill="#2f6fed" xml:space="preserve">V</text>
<text x="279.9" y="239.0" font-size="8.6" text-anchor="start" fill="#2f6fed" xml:space="preserve">S</text>
<text x="280.0" y="370" font-size="12" text-anchor="middle" fill="#5a6577">In the real circuit I1 = gm V1. Bode's method first treats I1 as an</text>
<text x="280.0" y="386" font-size="12" text-anchor="middle" fill="#5a6577">independent source, finds Vout and V1 as linear functions of Vin and I1, and</text>
<text x="280.0" y="402" font-size="12" text-anchor="middle" fill="#5a6577">only then imposes I1 = gm V1.</text>

</svg>
