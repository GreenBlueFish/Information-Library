<text x="403.3" y="208.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">O</text>
<path d="M380 230 V260 H300" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="300" cy="200" r="15" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<path d="M300 191 V209" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M295 204 L300 210 L305 204" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M300 155 V185" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M300 215 V245" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="266.5" y="205" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">I</text>
<text x="273.7" y="208.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">1</text>
<path d="M300 245 V270" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="300" cy="260" r="3.5" fill="#1a2230"/>
<path d="M300 270.0 V280.0 l8 5 l-16 10 l16 10 l-16 10 l8 5 V330.0" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="271.5" y="305" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">R</text>
<text x="278.7" y="308.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">S</text>
<path d="M300 330 V338" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M288 338 H312 M292 344 H308 M296 350 H304" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M113.5 200 H118" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="110" cy="200" r="3.5" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="84.2" y="205" font-size="13" text-anchor="start" fill="#1a2230" xml:space="preserve">V</text>
<text x="91.5" y="208.2" font-size="9.4" text-anchor="start" fill="#1a2230" xml:space="preserve">in</text>
<path d="M118 200 H176" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
