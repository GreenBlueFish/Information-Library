<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>A MOSFET cross-section and the same device scaled down by alpha</title>
<rect width="640" height="330" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">Constant-field scaling by a factor α</text>
<rect x="60.0" y="110.0" width="260.0" height="110.0" fill="#eef1f6" stroke="#5a6577" stroke-width="1.5"/>
<rect x="80.0" y="110.0" width="70.0" height="34.0" fill="#cfe0ff" stroke="#2f6fed" stroke-width="1.2"/>
<rect x="230.0" y="110.0" width="70.0" height="34.0" fill="#cfe0ff" stroke="#2f6fed" stroke-width="1.2"/>
<rect x="142.0" y="102.0" width="96.0" height="8.0" fill="#d6dbe3" stroke="#5a6577" stroke-width="1"/>
<rect x="142.0" y="72.0" width="96.0" height="30.0" fill="#b8c2d3" stroke="#1a2230" stroke-width="1.2"/>
<text x="190.0" y="242.0" font-size="13" text-anchor="middle" fill="#1a2230">original: L, W, tox, xj, VDD, VTH</text>
<rect x="420.0" y="150.0" width="130.0" height="55.0" fill="#eef1f6" stroke="#5a6577" stroke-width="1.5"/>
<rect x="430.0" y="150.0" width="35.0" height="17.0" fill="#cfe0ff" stroke="#2f6fed" stroke-width="1.2"/>
<rect x="505.0" y="150.0" width="35.0" height="17.0" fill="#cfe0ff" stroke="#2f6fed" stroke-width="1.2"/>
<rect x="461.0" y="146.0" width="48.0" height="4.0" fill="#d6dbe3" stroke="#5a6577" stroke-width="1"/>
<rect x="461.0" y="131.0" width="48.0" height="15.0" fill="#b8c2d3" stroke="#1a2230" stroke-width="1.2"/>
<text x="485.0" y="227.0" font-size="13" text-anchor="middle" fill="#1a2230">scaled: all ÷ α, doping × α</text>
<path d="M345 165 L400 165" fill="none" stroke="#5a6577" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M400 165 L391.9 168.9 L391.9 161.1 z" fill="#5a6577"/>
<text x="320.0" y="290" font-size="12" text-anchor="middle" fill="#5a6577">Every dimension and voltage shrinks by α, so all fields stay the same. Current and</text>
<text x="320.0" y="306" font-size="12" text-anchor="middle" fill="#5a6577">capacitance fall by α, delay by α, power per gate by α² (at frequency × α) and density</text>
<text x="320.0" y="322" font-size="12" text-anchor="middle" fill="#5a6577">rises by α².</text>

</svg>
