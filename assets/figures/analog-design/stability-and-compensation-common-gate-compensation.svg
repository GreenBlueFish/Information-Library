<text x="310.0" y="420" font-size="12" text-anchor="middle" fill="#5a6577">Output current through CC enters the low-impedance source of Mc and is passed to node</text>
<text x="310.0" y="436" font-size="12" text-anchor="middle" fill="#5a6577">A, giving Miller-like feedback; but node A cannot push signal forward through CC, so</text>
<text x="310.0" y="452" font-size="12" text-anchor="middle" fill="#5a6577">the right-half-plane zero is gone.</text>

