<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Rectangle of accepted wafers with corners SS, FF, FS, SF and typical TT</title>
<rect width="640" height="420" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">Process corners on the NMOS/PMOS speed plane</text>
<path d="M110 330 L540 330" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M540 330 L531.9 333.9 L531.9 326.1 z" fill="#5a6577"/>
<path d="M110 330 L110 58" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" data-sym="1"/>
<path d="M110 58 L113.9 66.1 L106.1 66.1 z" fill="#5a6577"/>
<text x="536" y="356" font-size="13" text-anchor="end" fill="#1a2230">NMOS speed</text>
<text x="118" y="54" font-size="13" text-anchor="start" fill="#1a2230">PMOS speed</text>
<rect x="180.0" y="115.0" width="280" height="170" fill="#e8effd" stroke="#2f6fed" stroke-width="1.5"/>
<circle cx="180.0" cy="285.0" r="5" fill="#b00020"/>
<text x="166.0" y="305.0" font-size="13" text-anchor="end" fill="#1a2230" font-weight="600">SS</text>
<circle cx="460.0" cy="115.0" r="5" fill="#b00020"/>
<text x="474.0" y="105.0" font-size="13" text-anchor="start" fill="#1a2230" font-weight="600">FF</text>
<circle cx="460.0" cy="285.0" r="5" fill="#b00020"/>
<text x="474.0" y="305.0" font-size="13" text-anchor="start" fill="#1a2230" font-weight="600">FS</text>
<circle cx="180.0" cy="115.0" r="5" fill="#b00020"/>
<text x="166.0" y="105.0" font-size="13" text-anchor="end" fill="#1a2230" font-weight="600">SF</text>
<circle cx="320.0" cy="200.0" r="5" fill="#1a2230"/>
<text x="334.0" y="190.0" font-size="13" text-anchor="start" fill="#1a2230" font-weight="600">TT</text>
<text x="320.0" y="230.0" font-size="12" text-anchor="middle" fill="#2f6fed">accepted wafers</text>
<text x="320.0" y="380" font-size="12" text-anchor="middle" fill="#5a6577">First letter NMOS, second PMOS: F = fast (thin oxide, low VTH), S = slow. Designs are</text>
<text x="320.0" y="396" font-size="12" text-anchor="middle" fill="#5a6577">simulated at all corners together with supply and temperature extremes.</text>

</svg>
