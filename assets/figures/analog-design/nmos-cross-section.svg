<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 345" width="600" height="345" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Cross-section of an n-channel MOSFET</title>
<rect width="600" height="345" fill="#ffffff"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">Cross-section of an n-channel MOSFET</text>
<rect x="80" y="170" width="440" height="110" fill="#eef1f6" stroke="#5a6577" stroke-width="1.5"/>
<text x="300.0" y="262" font-size="12" text-anchor="middle" fill="#5a6577">p-type substrate (body, B)</text>
<rect x="130" y="170" width="90" height="42" fill="#cfe0ff" stroke="#2f6fed" stroke-width="1.5"/>
<rect x="380" y="170" width="90" height="42" fill="#cfe0ff" stroke="#2f6fed" stroke-width="1.5"/>
<text x="175" y="196" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">n+</text>
<text x="425" y="196" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">n+</text>
<rect x="220" y="150" width="160" height="20" fill="#d6dbe3" stroke="#5a6577" stroke-width="1.5"/>
<text x="300" y="164" font-size="11" text-anchor="middle" fill="#1a2230">gate oxide (SiO₂)</text>
<rect x="220" y="110" width="160" height="40" fill="#b8c2d3" stroke="#1a2230" stroke-width="1.5"/>
<text x="300" y="135" font-size="13" text-anchor="middle" fill="#1a2230">polysilicon gate</text>
<path d="M220 172 H380" fill="none" stroke="#2f6fed" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/>
<text x="300" y="232" font-size="12" text-anchor="middle" fill="#2f6fed">channel (forms when Vgs &gt; Vth)</text>
<path d="M175 170 V90" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M300 110 V70" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M425 170 V90" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M300 280 V312" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="175" y="82" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">Source (S)</text>
<text x="300" y="62" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">Gate (G)</text>
<text x="425" y="82" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">Drain (D)</text>
<text x="300" y="330" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">Body (B)</text>
<path d="M220 100 H380" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M220 94 V106 M380 94 V106" fill="none" stroke="#5a6577" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="300.0" y="96" font-size="12" text-anchor="middle" fill="#5a6577">channel length L</text>
<text x="560" y="138" font-size="12" text-anchor="end" fill="#5a6577">current flows</text>
<text x="560" y="154" font-size="12" text-anchor="end" fill="#5a6577">from D to S</text>

</svg>
