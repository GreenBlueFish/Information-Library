<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Probability tree for a test: 1 percent have the condition; positives come from 99 percent of those and 5 percent of the rest</title>
<rect width="720" height="330" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a2230"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2a9d5c"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e5533c"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f6fed"/></marker></defs>
<text x="20.0" y="30.0" font-size="17" text-anchor="start" fill="#1a2230" font-weight="600">Where the positive results come from (per 10 000 people)</text>
<rect x="20" y="150" width="120" height="50" rx="6" fill="#eef1f6" stroke="#d6dbe3" stroke-width="2"/>
<text x="80.0" y="180.0" font-size="15" text-anchor="middle" fill="#1a2230" font-weight="600">10 000</text>
<path d="M140 175 C 180 175, 190 90, 240 90" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="245" y="65" width="140" height="50" rx="6" fill="#ffffff" stroke="#e5533c" stroke-width="2"/>
<text x="315.0" y="86.0" font-size="12" text-anchor="middle" fill="#5a6577" font-weight="400">condition</text>
<text x="315.0" y="105.0" font-size="15" text-anchor="middle" fill="#1a2230" font-weight="600">100</text>
<path d="M140 175 C 180 175, 190 260, 240 260" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="245" y="235" width="140" height="50" rx="6" fill="#ffffff" stroke="#2f6fed" stroke-width="2"/>
<text x="315.0" y="256.0" font-size="12" text-anchor="middle" fill="#5a6577" font-weight="400">no condition</text>
<text x="315.0" y="275.0" font-size="15" text-anchor="middle" fill="#1a2230" font-weight="600">9 900</text>
<path d="M385 90 C 420 90, 430 55, 465 55" fill="none" stroke="#1a2230" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="470" y="35" width="120" height="40" rx="6" fill="#ffffff" stroke="#e5533c" stroke-width="2"/>
<text x="530.0" y="60.0" font-size="13" text-anchor="middle" fill="#1a2230" font-weight="600">positive: 99</text>
<path d="M385 90 C 420 90, 430 125, 465 125" fill="none" stroke="#1a2230" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="470" y="105" width="120" height="40" rx="6" fill="#ffffff" stroke="#5a6577" stroke-width="2"/>
<text x="530.0" y="130.0" font-size="13" text-anchor="middle" fill="#1a2230" font-weight="400">negative: 1</text>
<path d="M385 260 C 420 260, 430 225, 465 225" fill="none" stroke="#1a2230" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="470" y="205" width="120" height="40" rx="6" fill="#ffffff" stroke="#2f6fed" stroke-width="2"/>
<text x="530.0" y="230.0" font-size="13" text-anchor="middle" fill="#1a2230" font-weight="600">positive: 495</text>
<path d="M385 260 C 420 260, 430 295, 465 295" fill="none" stroke="#1a2230" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="470" y="275" width="120" height="40" rx="6" fill="#ffffff" stroke="#5a6577" stroke-width="2"/>
<text x="530.0" y="300.0" font-size="13" text-anchor="middle" fill="#1a2230" font-weight="400">negative: 9 405</text>
<text x="655.0" y="150.0" font-size="13" text-anchor="middle" fill="#5a6577" font-weight="400">positives:</text>
<text x="655.0" y="172.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">99 + 495 = 594</text>
<text x="655.0" y="196.0" font-size="13" text-anchor="middle" fill="#5a6577" font-weight="400">P(condition | +)</text>
<text x="655.0" y="218.0" font-size="14" text-anchor="middle" fill="#e5533c" font-weight="600">= 99/594 ≈ 0.17</text>
</svg>
