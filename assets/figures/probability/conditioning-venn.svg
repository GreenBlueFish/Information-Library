<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Two overlapping events A and B inside the sample space; conditioning on B keeps only B and rescales it</title>
<rect width="700" height="330" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a2230"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2a9d5c"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e5533c"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f6fed"/></marker></defs>
<text x="20.0" y="30.0" font-size="17" text-anchor="start" fill="#1a2230" font-weight="600">Conditioning shrinks the sample space</text>
<rect x="20" y="50" width="300" height="230" rx="6" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="36.0" y="72.0" font-size="16" text-anchor="start" fill="#1a2230" font-weight="600">Ω</text>
<circle cx="135" cy="170" r="75" fill="#2f6fed" fill-opacity="0.18" stroke="#2f6fed" stroke-width="2"/>
<circle cx="215" cy="170" r="75" fill="#e5533c" fill-opacity="0.18" stroke="#e5533c" stroke-width="2"/>
<text x="105.0" y="175.0" font-size="18" text-anchor="middle" fill="#2f6fed" font-weight="600">A</text>
<text x="245.0" y="175.0" font-size="18" text-anchor="middle" fill="#e5533c" font-weight="600">B</text>
<text x="175.0" y="175.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">AB</text>
<line x1="330.0" y1="165.0" x2="380.0" y2="165.0" stroke="#1a2230" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="355.0" y="150.0" font-size="13" text-anchor="middle" fill="#5a6577" font-weight="400">given B</text>
<rect x="390" y="50" width="290" height="230" rx="6" fill="#ffffff" stroke="#d6dbe3" stroke-width="2"/>
<circle cx="535" cy="165" r="95" fill="#e5533c" fill-opacity="0.12" stroke="#e5533c" stroke-width="2"/>
<clipPath id="cb"><circle cx="535" cy="165" r="95"/></clipPath>
<circle cx="435" cy="165" r="95" fill="#2f6fed" fill-opacity="0.22" stroke="#2f6fed" stroke-width="2" stroke-dasharray="5 4" clip-path="url(#cb)"/>
<text x="480.0" y="170.0" font-size="15" text-anchor="middle" fill="#1a2230" font-weight="600">AB</text>
<text x="585.0" y="170.0" font-size="18" text-anchor="middle" fill="#e5533c" font-weight="600">B</text>
<text x="350.0" y="312.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="400">P(A | B) = P(AB) / P(B): the share of B that is also A</text>
</svg>
