<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Map of relationships between distributions: Bernoulli sums to binomial, binomial tends to Poisson and normal, Poisson gaps are exponential, exponentials sum to gamma, squared normals give chi-square, and normal over chi-square gives t</title>
<rect width="760" height="420" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a2230"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2a9d5c"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e5533c"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f6fed"/></marker></defs>
<text x="20.0" y="30.0" font-size="17" text-anchor="start" fill="#1a2230" font-weight="600">How the standard distributions are related</text>
<rect x="30" y="68" width="140" height="44" rx="6" fill="#ffffff" stroke="#2f6fed" stroke-width="2"/>
<text x="100.0" y="95.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">Bernoulli(p)</text>
<rect x="260" y="68" width="140" height="44" rx="6" fill="#ffffff" stroke="#2f6fed" stroke-width="2"/>
<text x="330.0" y="95.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">Binomial(n, p)</text>
<rect x="30" y="178" width="140" height="44" rx="6" fill="#ffffff" stroke="#2f6fed" stroke-width="2"/>
<text x="100.0" y="205.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">Geometric(p)</text>
<rect x="490" y="68" width="140" height="44" rx="6" fill="#ffffff" stroke="#2a9d5c" stroke-width="2"/>
<text x="560.0" y="95.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">Poisson(λ)</text>
<rect x="490" y="188" width="140" height="44" rx="6" fill="#ffffff" stroke="#2a9d5c" stroke-width="2"/>
<text x="560.0" y="215.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">Exponential(λ)</text>
<rect x="490" y="308" width="140" height="44" rx="6" fill="#ffffff" stroke="#2a9d5c" stroke-width="2"/>
<text x="560.0" y="335.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">Gamma(k, λ)</text>
<rect x="260" y="208" width="140" height="44" rx="6" fill="#ffffff" stroke="#e5533c" stroke-width="2"/>
<text x="330.0" y="235.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">Normal</text>
<rect x="260" y="338" width="140" height="44" rx="6" fill="#ffffff" stroke="#e5533c" stroke-width="2"/>
<text x="330.0" y="365.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">Chi-square(k)</text>
<rect x="50" y="338" width="140" height="44" rx="6" fill="#ffffff" stroke="#e5533c" stroke-width="2"/>
<text x="120.0" y="365.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">Student t</text>
<line x1="175.0" y1="90.0" x2="255.0" y2="90.0" stroke="#1a2230" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="215.0" y="82.0" font-size="12" text-anchor="middle" fill="#5a6577" font-weight="400">sum of n</text>
<line x1="100.0" y1="114.0" x2="100.0" y2="176.0" stroke="#1a2230" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="170.0" y="145.0" font-size="12" text-anchor="middle" fill="#5a6577" font-weight="400">trials to 1st success</text>
<line x1="405.0" y1="90.0" x2="485.0" y2="90.0" stroke="#1a2230" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="445.0" y="82.0" font-size="12" text-anchor="middle" fill="#5a6577" font-weight="400">n → ∞, np = λ</text>
<line x1="560.0" y1="114.0" x2="560.0" y2="186.0" stroke="#1a2230" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="640.0" y="150.0" font-size="12" text-anchor="middle" fill="#5a6577" font-weight="400">gaps between events</text>
<line x1="560.0" y1="234.0" x2="560.0" y2="306.0" stroke="#1a2230" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="605.0" y="270.0" font-size="12" text-anchor="middle" fill="#5a6577" font-weight="400">sum of k</text>
<line x1="330.0" y1="114.0" x2="330.0" y2="206.0" stroke="#1a2230" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="385.0" y="160.0" font-size="12" text-anchor="middle" fill="#5a6577" font-weight="400">CLT, large n</text>
<line x1="330.0" y1="254.0" x2="330.0" y2="336.0" stroke="#1a2230" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="395.0" y="295.0" font-size="12" text-anchor="middle" fill="#5a6577" font-weight="400">sum of k squares</text>
<line x1="406.8" y1="356.4" x2="483.2" y2="333.6" stroke="#1a2230" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="475.0" y="371.0" font-size="12" text-anchor="middle" fill="#5a6577" font-weight="400">= Gamma(k/2, 1/2)</text>
<line x1="265.0" y1="247.7" x2="185.0" y2="342.3" stroke="#1a2230" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="165.0" y="295.0" font-size="12" text-anchor="middle" fill="#5a6577" font-weight="400">Z / √(χ²/k)</text>
<text x="380.0" y="410.0" font-size="12" text-anchor="middle" fill="#5a6577" font-weight="400">Discrete trials (blue), Poisson-process family (green), normal-theory family (red).</text>
</svg>
