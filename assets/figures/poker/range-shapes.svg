<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Four shapes of betting range drawn along a scale of hand strength: polarised, linear, condensed and capped</title>
<rect width="760" height="360" fill="#ffffff"/>
<text x="24" y="34" font-size="18" font-weight="600" fill="#1a2230">Shapes of a range</text>
<text x="200" y="62" font-size="13" fill="#5a6577">weakest hands</text><text x="720" y="62" font-size="13" text-anchor="end" fill="#5a6577">strongest hands (the nuts)</text>
<text x="24" y="105" font-size="15" font-weight="600" fill="#1a2230">polarised</text>
<rect x="200" y="86" width="520" height="28" rx="4" fill="#eef1f6" stroke="#d6dbe3"/>
<rect x="200" y="86" width="114" height="28" rx="4" fill="#2f6fed"/>
<rect x="606" y="86" width="114" height="28" rx="4" fill="#2f6fed"/>
<text x="24" y="124" font-size="12" fill="#5a6577">strong hands and bluffs, no middle</text>
<text x="24" y="163" font-size="15" font-weight="600" fill="#1a2230">linear (merged)</text>
<rect x="200" y="144" width="520" height="28" rx="4" fill="#eef1f6" stroke="#d6dbe3"/>
<rect x="434" y="144" width="286" height="28" rx="4" fill="#2f6fed"/>
<text x="24" y="182" font-size="12" fill="#5a6577">the best hands down to a cut-off</text>
<text x="24" y="221" font-size="15" font-weight="600" fill="#1a2230">condensed</text>
<rect x="200" y="202" width="520" height="28" rx="4" fill="#eef1f6" stroke="#d6dbe3"/>
<rect x="356" y="202" width="234" height="28" rx="4" fill="#2f6fed"/>
<text x="24" y="240" font-size="12" fill="#5a6577">mostly medium hands</text>
<text x="24" y="279" font-size="15" font-weight="600" fill="#1a2230">capped</text>
<rect x="200" y="260" width="520" height="28" rx="4" fill="#eef1f6" stroke="#d6dbe3"/>
<rect x="200" y="260" width="364" height="28" rx="4" fill="#2f6fed"/>
<text x="24" y="298" font-size="12" fill="#5a6577">the strongest hands removed</text>
<rect x="24" y="330" width="16" height="16" rx="3" fill="#2f6fed"/><text x="46" y="343" font-size="13" fill="#1a2230">hands in the range</text>
<rect x="200" y="330" width="16" height="16" rx="3" fill="#eef1f6" stroke="#d6dbe3"/><text x="222" y="343" font-size="13" fill="#1a2230">hands not in it</text>
</svg>
