<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Positions at a nine-handed poker table, in the order they act before the flop</title>
<rect width="760" height="520" fill="#ffffff"/>
<text x="24" y="34" font-size="18" font-weight="600" fill="#1a2230">Table positions (nine-handed)</text>
<ellipse cx="380" cy="262" rx="250" ry="140" fill="#e3f1e7" stroke="#2f8a4f" stroke-width="3"/>
<text x="380" y="256" font-size="14" text-anchor="middle" fill="#5a6577">action moves clockwise</text>
<text x="380" y="278" font-size="13" text-anchor="middle" fill="#5a6577">numbers: order of action before the flop</text>
<circle cx="380" cy="440" r="30" fill="#2f8a4f"/>
<text x="380" y="445" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">BTN</text>
<circle cx="380" cy="376" r="11" fill="#ffffff" stroke="#2f8a4f" stroke-width="2"/><text x="380" y="380" font-size="12" font-weight="700" text-anchor="middle" fill="#1a2230">7</text>
<circle cx="432" cy="406" r="13" fill="#ffffff" stroke="#1a2230" stroke-width="2"/><text x="432" y="411" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2230">D</text>
<circle cx="192" cy="398" r="30" fill="#5a6577"/>
<text x="192" y="403" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">SB</text>
<circle cx="239" cy="349" r="11" fill="#ffffff" stroke="#5a6577" stroke-width="2"/><text x="239" y="353" font-size="12" font-weight="700" text-anchor="middle" fill="#1a2230">8</text>
<circle cx="92" cy="293" r="30" fill="#5a6577"/>
<text x="92" y="298" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">BB</text>
<circle cx="163" cy="282" r="11" fill="#ffffff" stroke="#5a6577" stroke-width="2"/><text x="163" y="286" font-size="12" font-weight="700" text-anchor="middle" fill="#1a2230">9</text>
<circle cx="127" cy="173" r="30" fill="#2f6fed"/>
<text x="127" y="178" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">UTG</text>
<circle cx="189" cy="205" r="11" fill="#ffffff" stroke="#2f6fed" stroke-width="2"/><text x="189" y="209" font-size="12" font-weight="700" text-anchor="middle" fill="#1a2230">1</text>
<circle cx="280" cy="95" r="30" fill="#2f6fed"/>
<text x="280" y="100" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">UTG+1</text>
<circle cx="305" cy="155" r="11" fill="#ffffff" stroke="#2f6fed" stroke-width="2"/><text x="305" y="159" font-size="12" font-weight="700" text-anchor="middle" fill="#1a2230">2</text>
<circle cx="480" cy="95" r="30" fill="#8a5cd6"/>
<text x="480" y="100" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">MP</text>
<circle cx="455" cy="155" r="11" fill="#ffffff" stroke="#8a5cd6" stroke-width="2"/><text x="455" y="159" font-size="12" font-weight="700" text-anchor="middle" fill="#1a2230">3</text>
<circle cx="633" cy="173" r="30" fill="#8a5cd6"/>
<text x="633" y="178" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">LJ</text>
<circle cx="571" cy="205" r="11" fill="#ffffff" stroke="#8a5cd6" stroke-width="2"/><text x="571" y="209" font-size="12" font-weight="700" text-anchor="middle" fill="#1a2230">4</text>
<circle cx="668" cy="293" r="30" fill="#8a5cd6"/>
<text x="668" y="298" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">HJ</text>
<circle cx="597" cy="282" r="11" fill="#ffffff" stroke="#8a5cd6" stroke-width="2"/><text x="597" y="286" font-size="12" font-weight="700" text-anchor="middle" fill="#1a2230">5</text>
<circle cx="568" cy="398" r="30" fill="#2f8a4f"/>
<text x="568" y="403" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">CO</text>
<circle cx="521" cy="349" r="11" fill="#ffffff" stroke="#2f8a4f" stroke-width="2"/><text x="521" y="353" font-size="12" font-weight="700" text-anchor="middle" fill="#1a2230">6</text>
<rect x="24" y="486" width="16" height="16" rx="3" fill="#2f6fed"/><text x="46" y="499" font-size="13" fill="#1a2230">early</text>
<rect x="144" y="486" width="16" height="16" rx="3" fill="#8a5cd6"/><text x="166" y="499" font-size="13" fill="#1a2230">middle</text>
<rect x="264" y="486" width="16" height="16" rx="3" fill="#2f8a4f"/><text x="286" y="499" font-size="13" fill="#1a2230">late</text>
<rect x="384" y="486" width="16" height="16" rx="3" fill="#5a6577"/><text x="406" y="499" font-size="13" fill="#1a2230">blinds</text>
<text x="736" y="34" font-size="13" text-anchor="end" fill="#5a6577">After the flop the SB acts first and the BTN last.</text>
</svg>
