<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Verilog-A source compiled by OpenVAF into an .osdi library, loaded by ngspice with pre_osdi or osdi, and used in the netlist through a .model line with the module name and N instance lines</title>
<rect width="760" height="350" fill="#ffffff"/>
<text x="24" y="30" font-size="17" text-anchor="start" fill="#1a2230" font-weight="600">From Verilog-A source to a simulated device</text>
<rect x="24" y="60" width="170" height="110" rx="8" fill="#eef1f6" stroke="#5a6577" stroke-width="1.5"/>
<text x="109.0" y="82" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">model.va</text>
<text x="109.0" y="102" font-size="12" text-anchor="middle" fill="#5a6577">Verilog-A source</text>
<text x="109.0" y="119" font-size="12" text-anchor="middle" fill="#5a6577">module name(ports)</text>
<text x="109.0" y="136" font-size="12" text-anchor="middle" fill="#5a6577">parameters, analog block</text>
<rect x="234" y="60" width="150" height="110" rx="8" fill="#eef1f6" stroke="#5a6577" stroke-width="1.5"/>
<text x="309.0" y="82" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">OpenVAF</text>
<text x="309.0" y="102" font-size="12" text-anchor="middle" fill="#5a6577">openvaf-r model.va</text>
<text x="309.0" y="119" font-size="12" text-anchor="middle" fill="#5a6577">-I  -D  -o</text>
<text x="309.0" y="136" font-size="12" text-anchor="middle" fill="#5a6577">--target​_cpu</text>
<rect x="424" y="60" width="140" height="110" rx="8" fill="#eef1f6" stroke="#5a6577" stroke-width="1.5"/>
<text x="494.0" y="82" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">model.osdi</text>
<text x="494.0" y="102" font-size="12" text-anchor="middle" fill="#5a6577">shared library</text>
<text x="494.0" y="119" font-size="12" text-anchor="middle" fill="#5a6577">OSDI 0.3 / 0.4</text>
<rect x="604" y="60" width="136" height="110" rx="8" fill="#eef1f6" stroke="#5a6577" stroke-width="1.5"/>
<text x="672.0" y="82" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">ngspice</text>
<text x="672.0" y="102" font-size="12" text-anchor="middle" fill="#5a6577">pre​_osdi model.osdi</text>
<text x="672.0" y="119" font-size="12" text-anchor="middle" fill="#5a6577">or osdi in</text>
<text x="672.0" y="136" font-size="12" text-anchor="middle" fill="#5a6577">.spiceinit / spinit</text>
<path d="M194 115 L232 115" fill="none" stroke="#1a2230" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M232 115 L223.7 118.5 L223.7 111.5 Z" fill="#1a2230"/>
<path d="M384 115 L422 115" fill="none" stroke="#1a2230" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M422 115 L413.7 118.5 L413.7 111.5 Z" fill="#1a2230"/>
<path d="M564 115 L602 115" fill="none" stroke="#1a2230" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M602 115 L593.7 118.5 L593.7 111.5 Z" fill="#1a2230"/>
<rect x="150" y="220" width="460" height="110" rx="8" fill="#ffffff" stroke="#5a6577" stroke-width="1.5"/>
<text x="380.0" y="242" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">Netlist</text>
<text x="380.0" y="262" font-size="12" text-anchor="middle" fill="#5a6577">.model mymod (module name) param=value ...</text>
<text x="380.0" y="279" font-size="12" text-anchor="middle" fill="#5a6577">N1 node1 node2 ... mymod [instance params]</text>
<text x="380.0" y="296" font-size="12" text-anchor="middle" fill="#5a6577">print @n1[opvar]   show n1   showmod mymod</text>
<path d="M672 170 L560 218" fill="none" stroke="#1a2230" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M560 218 L566.2 211.5 L569.0 218.0 Z" fill="#1a2230"/>

</svg>
