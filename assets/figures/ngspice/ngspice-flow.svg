<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Block diagram of ngspice: input files go through the front end to the simulator core, which uses device models and writes result vectors that the control language processes</title>
<rect width="760" height="390" fill="#ffffff"/>
<text x="24" y="30" font-size="17" text-anchor="start" fill="#1a2230" font-weight="600">How ngspice turns a netlist into results</text>
<rect x="24" y="60" width="190" height="110" rx="8" fill="#eef1f6" stroke="#5a6577" stroke-width="1.5"/>
<text x="119.0" y="82" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">Input files</text>
<text x="119.0" y="102" font-size="12" text-anchor="middle" fill="#5a6577">netlist .cir</text>
<text x="119.0" y="119" font-size="12" text-anchor="middle" fill="#5a6577">.include / .lib models</text>
<text x="119.0" y="136" font-size="12" text-anchor="middle" fill="#5a6577">.spiceinit, spinit</text>
<rect x="264" y="60" width="210" height="110" rx="8" fill="#eef1f6" stroke="#5a6577" stroke-width="1.5"/>
<text x="369.0" y="82" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">Front end</text>
<text x="369.0" y="102" font-size="12" text-anchor="middle" fill="#5a6577">parse, .param, braces</text>
<text x="369.0" y="119" font-size="12" text-anchor="middle" fill="#5a6577">expand .subckt</text>
<text x="369.0" y="136" font-size="12" text-anchor="middle" fill="#5a6577">compatibility translation</text>
<rect x="524" y="60" width="212" height="110" rx="8" fill="#eef1f6" stroke="#5a6577" stroke-width="1.5"/>
<text x="630.0" y="82" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">Simulator core</text>
<text x="630.0" y="102" font-size="12" text-anchor="middle" fill="#5a6577">MNA equations</text>
<text x="630.0" y="119" font-size="12" text-anchor="middle" fill="#5a6577">Newton-Raphson</text>
<text x="630.0" y="136" font-size="12" text-anchor="middle" fill="#5a6577">op dc ac tran noise ...</text>
<rect x="524" y="220" width="212" height="110" rx="8" fill="#ffffff" stroke="#5a6577" stroke-width="1.5"/>
<text x="630.0" y="242" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">Device models</text>
<text x="630.0" y="262" font-size="12" text-anchor="middle" fill="#5a6577">built-in (BSIM4, VBIC ...)</text>
<text x="630.0" y="279" font-size="12" text-anchor="middle" fill="#5a6577">XSPICE code models .cm</text>
<text x="630.0" y="296" font-size="12" text-anchor="middle" fill="#5a6577">Verilog-A via .osdi</text>
<rect x="264" y="220" width="210" height="110" rx="8" fill="#eef1f6" stroke="#5a6577" stroke-width="1.5"/>
<text x="369.0" y="242" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">Result vectors</text>
<text x="369.0" y="262" font-size="12" text-anchor="middle" fill="#5a6577">plots: op1, ac1, tran1 ...</text>
<text x="369.0" y="279" font-size="12" text-anchor="middle" fill="#5a6577">v(out), i(V1), @m1[gm]</text>
<text x="369.0" y="296" font-size="12" text-anchor="middle" fill="#5a6577">frequency, time scales</text>
<rect x="24" y="220" width="190" height="110" rx="8" fill="#eef1f6" stroke="#5a6577" stroke-width="1.5"/>
<text x="119.0" y="242" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">Control language</text>
<text x="119.0" y="262" font-size="12" text-anchor="middle" fill="#5a6577">meas, let, print</text>
<text x="119.0" y="279" font-size="12" text-anchor="middle" fill="#5a6577">loops, alter, reset</text>
<text x="119.0" y="296" font-size="12" text-anchor="middle" fill="#5a6577">wrdata, write, plot</text>
<path d="M214 115 L262 115" fill="none" stroke="#1a2230" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M262 115 L253.7 118.5 L253.7 111.5 Z" fill="#1a2230"/>
<path d="M474 115 L522 115" fill="none" stroke="#1a2230" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M522 115 L513.7 118.5 L513.7 111.5 Z" fill="#1a2230"/>
<path d="M630 170 L630 218" fill="none" stroke="#1a2230" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M630 218 L626.5 209.7 L633.5 209.7 Z" fill="#1a2230"/>
<path d="M630 218 L630 170" fill="none" stroke="#1a2230" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M630 170 L633.5 178.3 L626.5 178.3 Z" fill="#1a2230"/>
<path d="M522 275 L476 275" fill="none" stroke="#1a2230" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M476 275 L484.3 271.5 L484.3 278.5 Z" fill="#1a2230"/>
<path d="M262 275 L216 275" fill="none" stroke="#1a2230" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M216 275 L224.3 271.5 L224.3 278.5 Z" fill="#1a2230"/>
<path d="M119 220 C119 195 340 190 369 172" fill="none" stroke="#2f6fed" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/>
<path d="M366 176 L369 171" fill="none" stroke="#1a2230" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M369 171 L367.7 179.9 L361.7 176.3 Z" fill="#1a2230"/>
<text x="380" y="196" font-size="12" text-anchor="start" fill="#2f6fed">alter, alterparam, reset, run again</text>
<text x="380" y="365" font-size="13" text-anchor="middle" fill="#5a6577">Output: printed values, rawfiles, data files, plots, Touchstone .s2p</text>

</svg>
