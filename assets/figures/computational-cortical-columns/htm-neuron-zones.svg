<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>The three input zones of a pyramidal neuron and how the HTM neuron models them</title>
<defs>
<marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1a2230"/></marker>
</defs>
<rect width="800" height="540" fill="#ffffff"/>
<text x="24" y="32" font-size="18" font-weight="600" fill="#1a2230">One neuron, three kinds of input</text>
<text x="24" y="74" font-size="14" font-weight="600" fill="#1a2230">A pyramidal neuron</text>
<text x="434" y="74" font-size="14" font-weight="600" fill="#1a2230">The HTM neuron</text>
<line x1="402" y1="60" x2="402" y2="520" stroke="#d6dbe3" stroke-width="1.5"/>

<!-- left: a pyramidal cell -->
<!-- apical tuft (purple) -->
<g stroke="#b659d6" stroke-width="3" fill="none" stroke-linecap="round">
<path d="M190 150 L150 110 L120 96"/>
<path d="M150 110 L140 88"/>
<path d="M190 150 L200 100 L192 84"/>
<path d="M200 100 L214 86"/>
<path d="M190 150 L236 112 L262 100"/>
<path d="M236 112 L244 90"/>
</g>
<!-- apical trunk -->
<path d="M190 300 L190 150" stroke="#5a6577" stroke-width="5" fill="none" stroke-linecap="round"/>
<!-- basal distal (green) -->
<g stroke="#2a9d5c" stroke-width="3" fill="none" stroke-linecap="round">
<path d="M150 352 L110 380 L80 384"/>
<path d="M110 380 L96 410"/>
<path d="M160 366 L140 420 L128 446"/>
<path d="M140 420 L162 448"/>
<path d="M222 366 L246 420 L240 450"/>
<path d="M246 420 L276 436"/>
<path d="M232 350 L276 370 L300 360"/>
<path d="M276 370 L296 396"/>
</g>
<!-- proximal (blue) -->
<g stroke="#2f6fed" stroke-width="5" fill="none" stroke-linecap="round">
<path d="M172 336 L150 352"/>
<path d="M180 346 L160 366"/>
<path d="M202 346 L222 366"/>
<path d="M208 334 L232 350"/>
<path d="M190 300 L190 270"/>
</g>
<!-- soma -->
<path d="M190 296 L214 346 L166 346 Z" fill="#1a2230"/>
<!-- axon -->
<path d="M190 346 L190 500" stroke="#5a6577" stroke-width="2" stroke-dasharray="4 3" fill="none" marker-end="url(#a-ink)"/>
<text x="198" y="496" font-size="12" fill="#5a6577">axon (output)</text>
<!-- left labels -->
<text x="282" y="104" font-size="13" font-weight="600" fill="#b659d6">apical tuft</text>
<text x="282" y="121" font-size="12" fill="#5a6577">in L1, feedback</text>
<text x="282" y="136" font-size="12" fill="#5a6577">from higher areas</text>
<text x="226" y="262" font-size="13" font-weight="600" fill="#2f6fed">proximal</text>
<text x="226" y="279" font-size="12" fill="#5a6577">near the soma,</text>
<text x="226" y="294" font-size="12" fill="#5a6577">feedforward input</text>
<text x="24" y="470" font-size="13" font-weight="600" fill="#2a9d5c">basal distal</text>
<text x="24" y="487" font-size="12" fill="#5a6577">far branches, context</text>
<text x="24" y="502" font-size="12" fill="#5a6577">from the same layer</text>

<!-- right: the HTM neuron -->
<g transform="translate(20,0)">
<!-- apical segments -->
<g font-size="12">
<rect x="430" y="96" width="140" height="22" rx="11" fill="#ffffff" stroke="#b659d6" stroke-width="2"/>
<rect x="430" y="128" width="140" height="22" rx="11" fill="#ffffff" stroke="#b659d6" stroke-width="2"/>
<line x1="570" y1="107" x2="600" y2="190" stroke="#b659d6" stroke-width="2"/>
<line x1="570" y1="139" x2="600" y2="190" stroke="#b659d6" stroke-width="2"/>
<text x="590" y="104" fill="#b659d6" font-weight="600" font-size="13">apical segments</text>
<text x="590" y="121" fill="#5a6577">feedback; can only</text>
<text x="590" y="136" fill="#5a6577">make the cell predictive</text>
</g>
<!-- basal segments -->
<g>
<rect x="430" y="214" width="140" height="22" rx="11" fill="#ffffff" stroke="#2a9d5c" stroke-width="2"/>
<rect x="430" y="246" width="140" height="22" rx="11" fill="#ffffff" stroke="#2a9d5c" stroke-width="2"/>
<rect x="430" y="278" width="140" height="22" rx="11" fill="#e6f5ec" stroke="#2a9d5c" stroke-width="2.5"/>
<line x1="570" y1="225" x2="594" y2="270" stroke="#2a9d5c" stroke-width="2"/>
<line x1="570" y1="257" x2="594" y2="270" stroke="#2a9d5c" stroke-width="2"/>
<line x1="570" y1="289" x2="594" y2="275" stroke="#2a9d5c" stroke-width="3.5"/>
</g>
<!-- synapse dots on segments: filled = active presynaptic cell -->
<g fill="#d6dbe3">
<circle cx="446" cy="107" r="4"/><circle cx="466" cy="107" r="4"/><circle cx="486" cy="107" r="4"/><circle cx="506" cy="107" r="4"/><circle cx="526" cy="107" r="4"/><circle cx="546" cy="107" r="4"/>
<circle cx="446" cy="139" r="4"/><circle cx="466" cy="139" r="4"/><circle cx="486" cy="139" r="4"/><circle cx="506" cy="139" r="4"/><circle cx="526" cy="139" r="4"/><circle cx="546" cy="139" r="4"/>
<circle cx="446" cy="225" r="4"/><circle cx="466" cy="225" r="4"/><circle cx="486" cy="225" r="4"/><circle cx="506" cy="225" r="4"/><circle cx="526" cy="225" r="4"/><circle cx="546" cy="225" r="4"/>
<circle cx="446" cy="257" r="4"/><circle cx="466" cy="257" r="4"/><circle cx="486" cy="257" r="4"/><circle cx="506" cy="257" r="4"/><circle cx="526" cy="257" r="4"/><circle cx="546" cy="257" r="4"/>
</g>
<g fill="#1a2230">
<circle cx="466" cy="107" r="4"/>
<circle cx="506" cy="225" r="4"/><circle cx="446" cy="257" r="4"/><circle cx="526" cy="257" r="4"/>
<circle cx="446" cy="289" r="4"/><circle cx="466" cy="289" r="4"/><circle cx="486" cy="289" r="4"/><circle cx="506" cy="289" r="4"/><circle cx="546" cy="289" r="4"/>
</g>
<circle cx="526" cy="289" r="4" fill="#d6dbe3"/>
<text x="430" y="320" font-size="12" fill="#2a9d5c">5 of 6 active:</text><text x="430" y="335" font-size="12" fill="#2a9d5c">segment fires</text>
<!-- cell body -->
<path d="M600 190 L640 300 L560 300 Z" fill="#fff7e0" stroke="#d9a000" stroke-width="2"/>
<text x="600" y="276" font-size="12" text-anchor="middle" fill="#1a2230">cell</text>
<text x="652" y="236" font-size="13" font-weight="600" fill="#2a9d5c">basal segments</text>
<text x="652" y="253" font-size="12" fill="#5a6577">context; a firing</text>
<text x="652" y="268" font-size="12" fill="#5a6577">segment makes the</text>
<text x="652" y="283" font-size="12" fill="#5a6577">cell predictive</text>
<!-- proximal input -->
<rect x="540" y="380" width="120" height="28" rx="6" fill="#e6efff" stroke="#2f6fed" stroke-width="2"/>
<text x="600" y="399" font-size="12" text-anchor="middle" fill="#1d57cc">proximal zone</text>
<line x1="600" y1="380" x2="600" y2="306" stroke="#2f6fed" stroke-width="3" marker-end="url(#a-ink)"/>
<g stroke="#2f6fed" stroke-width="1.5">
<line x1="470" y1="460" x2="560" y2="410"/><line x1="530" y1="460" x2="580" y2="410"/><line x1="590" y1="460" x2="600" y2="410"/><line x1="650" y1="460" x2="620" y2="410"/><line x1="710" y1="460" x2="640" y2="410"/>
</g>
<g fill="#2f6fed"><circle cx="470" cy="466" r="5"/><circle cx="530" cy="466" r="5"/><circle cx="590" cy="466" r="5"/><circle cx="650" cy="466" r="5"/><circle cx="710" cy="466" r="5"/></g>
<text x="590" y="494" font-size="12" text-anchor="middle" fill="#1d57cc">feedforward input: enough active bits make the cell fire</text>
<text x="590" y="512" font-size="12" text-anchor="middle" fill="#5a6577">(shared by all cells in the minicolumn)</text>
<line x1="640" y1="300" x2="700" y2="340" stroke="#1a2230" stroke-width="2" marker-end="url(#a-ink)"/>
<text x="704" y="350" font-size="12" fill="#1a2230">output</text>
</g>
</svg>
