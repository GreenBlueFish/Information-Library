<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Column voting: three columns sense different parts of a mug and agree on the object</title>
<defs><marker id="a-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b659d6"/></marker><marker id="a-i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5a6577"/></marker></defs>
<rect width="760" height="540" fill="#ffffff"/>
<text x="24" y="32" font-size="18" font-weight="600" fill="#1a2230">Columns vote on what the object is</text>
<text x="24" y="54" font-size="13" fill="#5a6577">Three fingertips touch one mug at once. Each column alone is unsure; together only one object fits.</text>
<path d="M300 90 L312 210 Q380 226 448 210 L460 90" fill="#eef1f6" stroke="#5a6577" stroke-width="2.5"/>
<ellipse cx="380" cy="90" rx="80" ry="14" fill="#ffffff" stroke="#5a6577" stroke-width="2.5"/>
<path d="M456 120 Q515 120 510 160 Q505 195 450 190" fill="none" stroke="#5a6577" stroke-width="9"/>
<circle cx="330" cy="82" r="9" fill="#d9a000" stroke="#ffffff" stroke-width="2"/>
<text x="330" y="86" font-size="11" font-weight="600" text-anchor="middle" fill="#1a2230">1</text>
<line x1="330" y1="92" x2="110" y2="262" stroke="#5a6577" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#a-i)"/>
<circle cx="370" cy="170" r="9" fill="#d9a000" stroke="#ffffff" stroke-width="2"/>
<text x="370" y="174" font-size="11" font-weight="600" text-anchor="middle" fill="#1a2230">2</text>
<line x1="370" y1="180" x2="380" y2="262" stroke="#5a6577" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#a-i)"/>
<circle cx="509" cy="158" r="9" fill="#d9a000" stroke="#ffffff" stroke-width="2"/>
<text x="509" y="162" font-size="11" font-weight="600" text-anchor="middle" fill="#1a2230">3</text>
<line x1="509" y1="168" x2="650" y2="262" stroke="#5a6577" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#a-i)"/>
<rect x="15" y="268" width="190" height="150" rx="10" fill="#ffffff" stroke="#5a6577" stroke-width="1.5"/>
<text x="110" y="290" font-size="14" font-weight="600" text-anchor="middle" fill="#1a2230">Column 1</text>
<text x="110" y="308" font-size="12" text-anchor="middle" fill="#5a6577">senses the rim; could be</text>
<rect x="50" y="320" width="120" height="24" rx="12" fill="#e6efff" stroke="#2f6fed" stroke-width="2"/>
<text x="110" y="336" font-size="12" text-anchor="middle" fill="#1d57cc">mug</text>
<rect x="50" y="350" width="120" height="24" rx="12" fill="#eef1f6" stroke="#d6dbe3" stroke-width="1"/>
<text x="110" y="366" font-size="12" text-anchor="middle" fill="#5a6577" text-decoration="line-through">bowl</text>
<line x1="86" y1="362" x2="134" y2="362" stroke="#5a6577" stroke-width="1.2"/>
<rect x="50" y="380" width="120" height="24" rx="12" fill="#eef1f6" stroke="#d6dbe3" stroke-width="1"/>
<text x="110" y="396" font-size="12" text-anchor="middle" fill="#5a6577" text-decoration="line-through">can</text>
<line x1="86" y1="392" x2="134" y2="392" stroke="#5a6577" stroke-width="1.2"/>
<rect x="285" y="268" width="190" height="150" rx="10" fill="#ffffff" stroke="#5a6577" stroke-width="1.5"/>
<text x="380" y="290" font-size="14" font-weight="600" text-anchor="middle" fill="#1a2230">Column 2</text>
<text x="380" y="308" font-size="12" text-anchor="middle" fill="#5a6577">senses the side; could be</text>
<rect x="320" y="320" width="120" height="24" rx="12" fill="#e6efff" stroke="#2f6fed" stroke-width="2"/>
<text x="380" y="336" font-size="12" text-anchor="middle" fill="#1d57cc">mug</text>
<rect x="320" y="350" width="120" height="24" rx="12" fill="#eef1f6" stroke="#d6dbe3" stroke-width="1"/>
<text x="380" y="366" font-size="12" text-anchor="middle" fill="#5a6577" text-decoration="line-through">can</text>
<line x1="356" y1="362" x2="404" y2="362" stroke="#5a6577" stroke-width="1.2"/>
<rect x="320" y="380" width="120" height="24" rx="12" fill="#eef1f6" stroke="#d6dbe3" stroke-width="1"/>
<text x="380" y="396" font-size="12" text-anchor="middle" fill="#5a6577" text-decoration="line-through">vase</text>
<line x1="356" y1="392" x2="404" y2="392" stroke="#5a6577" stroke-width="1.2"/>
<rect x="555" y="268" width="190" height="150" rx="10" fill="#ffffff" stroke="#5a6577" stroke-width="1.5"/>
<text x="650" y="290" font-size="14" font-weight="600" text-anchor="middle" fill="#1a2230">Column 3</text>
<text x="650" y="308" font-size="12" text-anchor="middle" fill="#5a6577">senses the handle; could be</text>
<rect x="590" y="320" width="120" height="24" rx="12" fill="#e6efff" stroke="#2f6fed" stroke-width="2"/>
<text x="650" y="336" font-size="12" text-anchor="middle" fill="#1d57cc">mug</text>
<rect x="590" y="350" width="120" height="24" rx="12" fill="#eef1f6" stroke="#d6dbe3" stroke-width="1"/>
<text x="650" y="366" font-size="12" text-anchor="middle" fill="#5a6577" text-decoration="line-through">jug</text>
<line x1="626" y1="362" x2="674" y2="362" stroke="#5a6577" stroke-width="1.2"/>
<rect x="590" y="380" width="120" height="24" rx="12" fill="#eef1f6" stroke="#d6dbe3" stroke-width="1"/>
<text x="650" y="396" font-size="12" text-anchor="middle" fill="#5a6577" text-decoration="line-through">teapot</text>
<line x1="626" y1="392" x2="674" y2="392" stroke="#5a6577" stroke-width="1.2"/>
<line x1="209" y1="345" x2="281" y2="345" stroke="#b659d6" stroke-width="2.5" marker-start="url(#a-p)" marker-end="url(#a-p)"/>
<line x1="479" y1="345" x2="551" y2="345" stroke="#b659d6" stroke-width="2.5" marker-start="url(#a-p)" marker-end="url(#a-p)"/>
<path d="M110 418 Q110 452 380 452 Q650 452 650 418" fill="none" stroke="#b659d6" stroke-width="2.5" marker-start="url(#a-p)" marker-end="url(#a-p)"/>
<text x="380" y="472" font-size="12" text-anchor="middle" fill="#b659d6">long-range lateral connections in L2/3 carry each column’s hypotheses (the votes)</text>
<rect x="140" y="488" width="480" height="36" rx="18" fill="#e6efff" stroke="#2f6fed" stroke-width="2"/>
<text x="380" y="511" font-size="14" font-weight="600" text-anchor="middle" fill="#1d57cc">Only “mug” fits all three: every column settles on it</text>
</svg>
