<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 612" width="760" height="612" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Thalamocortical loops: drivers and modulators between the thalamus and two cortical areas</title>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1d57cc"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2a9d5c"/></marker>
<marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5a6577"/></marker>
<marker id="bar-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M5 0 L5 10" stroke="#e5533c" stroke-width="3"/></marker>
</defs>
<rect width="760" height="612" fill="#ffffff"/>
<text x="24" y="32" font-size="18" font-weight="600" fill="#1a2230">Two loops through the thalamus</text>
<text x="24" y="54" font-size="13" fill="#5a6577">Solid blue: drivers (carry the message). Dashed green: modulators (set gain and mode).</text>

<!-- cortical areas -->
<g stroke="#d6dbe3" stroke-width="1.2">
<rect x="140" y="90" width="180" height="60" fill="#eef1f6"/><rect x="140" y="150" width="180" height="50" fill="#e6efff"/><rect x="140" y="200" width="180" height="50" fill="#eef1f6"/><rect x="140" y="250" width="180" height="50" fill="#ffffff"/>
<rect x="480" y="90" width="180" height="60" fill="#eef1f6"/><rect x="480" y="150" width="180" height="50" fill="#e6efff"/><rect x="480" y="200" width="180" height="50" fill="#eef1f6"/><rect x="480" y="250" width="180" height="50" fill="#ffffff"/>
</g>
<rect x="140" y="90" width="180" height="210" fill="none" stroke="#5a6577" stroke-width="1.5"/>
<rect x="480" y="90" width="180" height="210" fill="none" stroke="#5a6577" stroke-width="1.5"/>
<text x="230" y="82" font-size="14" font-weight="600" text-anchor="middle" fill="#1a2230">Area A (e.g. V1)</text>
<text x="570" y="82" font-size="14" font-weight="600" text-anchor="middle" fill="#1a2230">Area B (higher area)</text>
<g font-size="12" fill="#1a2230">
<text x="196" y="124">L2/3</text><text x="196" y="180">L4</text><text x="196" y="230">L5</text><text x="196" y="280">L6</text>
<text x="536" y="124">L2/3</text><text x="536" y="180">L4</text><text x="536" y="230">L5</text><text x="536" y="280">L6</text>
</g>

<!-- direct cortico-cortical -->
<line x1="320" y1="112" x2="474" y2="112" stroke="#5a6577" stroke-width="1.5" marker-end="url(#a-grey)"/>
<text x="397" y="104" font-size="12" text-anchor="middle" fill="#5a6577">direct cortico-cortical</text>

<!-- thalamus -->
<rect x="60" y="390" width="660" height="120" rx="14" fill="#fff7e0" stroke="#d9a000" stroke-width="1.5"/>
<rect x="60" y="362" width="660" height="18" rx="9" fill="#fde6e1" stroke="#e5533c" stroke-width="1.2"/>
<text x="310" y="375" font-size="12" fill="#1a2230">TRN: inhibitory shell</text>
<text x="76" y="500" font-size="13" font-weight="600" fill="#1a2230">Thalamus</text>
<rect x="110" y="420" width="190" height="56" rx="8" fill="#ffffff" stroke="#5a6577" stroke-width="1.2"/>
<text x="205" y="443" font-size="13" font-weight="600" text-anchor="middle" fill="#1a2230">First-order nucleus</text>
<text x="205" y="461" font-size="12" text-anchor="middle" fill="#5a6577">e.g. LGN</text>
<rect x="470" y="420" width="190" height="56" rx="8" fill="#ffffff" stroke="#5a6577" stroke-width="1.2"/>
<text x="565" y="443" font-size="13" font-weight="600" text-anchor="middle" fill="#1a2230">Higher-order nucleus</text>
<text x="565" y="461" font-size="12" text-anchor="middle" fill="#5a6577">e.g. pulvinar</text>

<!-- senses into first-order -->
<line x1="205" y1="556" x2="205" y2="482" stroke="#1d57cc" stroke-width="3" marker-end="url(#a-blue)"/>
<text x="215" y="550" font-size="12" fill="#1d57cc">from the senses (e.g. retina)</text>

<!-- loop 1: first-order to L4, L6 back -->
<line x1="160" y1="420" x2="160" y2="182" stroke="#1d57cc" stroke-width="3" marker-end="url(#a-blue)"/>
<path d="M290 280 L290 414" stroke="#2a9d5c" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#a-green)"/>
<line x1="250" y1="381" x2="250" y2="416" stroke="#e5533c" stroke-width="2" marker-end="url(#bar-red)"/>
<text x="298" y="338" font-size="12" fill="#2a9d5c">L6 feedback</text>

<!-- loop 2: L5 driver to higher-order, on to area B -->
<polyline points="320,225 400,225 400,330 520,330 520,414" fill="none" stroke="#1d57cc" stroke-width="3" marker-end="url(#a-blue)"/>
<text x="410" y="322" font-size="12" fill="#1d57cc">L5 driver</text>
<polyline points="140,225 40,225" fill="none" stroke="#1d57cc" stroke-width="3" marker-end="url(#a-blue)"/>
<text x="40" y="200" font-size="12" fill="#1d57cc">to motor</text>
<text x="40" y="215" font-size="12" fill="#1d57cc">centres</text>
<line x1="600" y1="420" x2="600" y2="182" stroke="#1d57cc" stroke-width="3" marker-end="url(#a-blue)"/>
<path d="M640 280 L640 414" stroke="#2a9d5c" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#a-green)"/>

<!-- loop labels -->
<text x="24" y="584" font-size="12" fill="#1a2230">Loop 1 (left): senses → first-order nucleus → L4; L6 feeds back to tune its own input, with TRN inhibition (red bar).</text>
<text x="24" y="601" font-size="12" fill="#1a2230">Loop 2 (right): L5 → higher-order nucleus → the next area; the same L5 axons also reach motor centres.</text>
</svg>
