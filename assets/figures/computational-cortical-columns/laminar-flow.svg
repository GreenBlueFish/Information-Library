<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>The canonical flow of signals through the layers of a cortical column</title>
<defs>
<marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1d57cc"/></marker>
<marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1a2230"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2a9d5c"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#e5533c"/></marker>
<marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b659d6"/></marker>
</defs>
<rect width="760" height="620" fill="#ffffff"/>
<text x="24" y="32" font-size="18" font-weight="600" fill="#1a2230">Where signals enter and leave a cortical column</text>
<text x="24" y="54" font-size="13" fill="#5a6577">The textbook path in primary sensory cortex: thalamus → L4 → L2/3 → L5 → L6 → thalamus</text>

<!-- the column, layer by layer -->
<g stroke="#d6dbe3" stroke-width="1.5">
<rect x="220" y="80" width="240" height="50" fill="#ffffff"/>
<rect x="220" y="130" width="240" height="110" fill="#eef1f6"/>
<rect x="220" y="240" width="240" height="70" fill="#e6efff"/>
<rect x="220" y="310" width="240" height="100" fill="#eef1f6"/>
<rect x="220" y="410" width="240" height="80" fill="#ffffff"/>
</g>
<rect x="220" y="80" width="240" height="410" fill="none" stroke="#5a6577" stroke-width="1.5"/>
<g font-size="14" font-weight="600" fill="#1a2230">
<text x="230" y="102">L1</text>
<text x="230" y="152">L2/3</text>
<text x="230" y="262">L4</text>
<text x="230" y="332">L5</text>
<text x="230" y="432">L6</text>
</g>
<g font-size="12" fill="#5a6577">
<text x="230" y="120">few cells, apical tufts</text>
<text x="230" y="170">sparse, cortico-cortical</text>
<text x="230" y="280">main thalamic input</text>
<text x="230" y="350">main output</text>
<text x="230" y="450">feedback to thalamus</text>
</g>

<!-- inside the column: L4 to L2/3 to L5 to L6 -->
<g stroke="#1a2230" stroke-width="2.5" fill="none">
<line x1="360" y1="290" x2="360" y2="190" marker-end="url(#a-ink)"/>
<line x1="410" y1="195" x2="410" y2="375" marker-end="url(#a-ink)"/>
<line x1="430" y1="385" x2="430" y2="470" marker-end="url(#a-ink)"/>
</g>
<g font-size="12" fill="#1a2230">
<text x="352" y="235" text-anchor="end">L4 → L2/3</text>
<text x="402" y="385" text-anchor="end">L2/3 → L5</text>
</g>
<text x="422" y="468" font-size="12" fill="#1a2230" text-anchor="end">L5 → L6</text>

<!-- thalamus -->
<rect x="220" y="540" width="240" height="56" rx="8" fill="#fff7e0" stroke="#d9a000" stroke-width="1.5"/>
<text x="340" y="564" font-size="14" font-weight="600" text-anchor="middle" fill="#1a2230">Thalamus</text>
<text x="340" y="584" font-size="12" text-anchor="middle" fill="#5a6577">relays the senses (LGN for vision)</text>
<line x1="180" y1="580" x2="215" y2="580" stroke="#1d57cc" stroke-width="3"/>
<polyline points="180,580 180,275 214,275" fill="none" stroke="#1d57cc" stroke-width="3" marker-end="url(#a-accent)"/>
<text x="172" y="420" font-size="12" fill="#1d57cc" text-anchor="end">sensory</text>
<text x="172" y="436" font-size="12" fill="#1d57cc" text-anchor="end">drive to L4</text>
<polyline points="200,580 200,440 214,440" fill="none" stroke="#1d57cc" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-accent)"/>
<text x="172" y="500" font-size="12" fill="#1d57cc" text-anchor="end">also straight</text>
<text x="172" y="516" font-size="12" fill="#1d57cc" text-anchor="end">to deep layers</text>
<line x1="180" y1="580" x2="200" y2="580" stroke="#1d57cc" stroke-width="1.5"/>
<line x1="445" y1="490" x2="445" y2="536" stroke="#2a9d5c" stroke-width="2.5" marker-end="url(#a-green)"/>
<text x="472" y="512" font-size="12" fill="#2a9d5c">L6 feedback</text>
<text x="472" y="528" font-size="12" fill="#2a9d5c">(modulates the relay)</text>

<!-- feedback from higher areas into L1 -->
<rect x="20" y="80" width="160" height="50" rx="8" fill="#eef1f6" stroke="#5a6577" stroke-width="1.2"/>
<text x="100" y="101" font-size="13" font-weight="600" text-anchor="middle" fill="#1a2230">Higher areas</text>
<text x="100" y="119" font-size="12" text-anchor="middle" fill="#5a6577">top-down feedback</text>
<line x1="180" y1="105" x2="300" y2="105" stroke="#b659d6" stroke-width="2.5" marker-end="url(#a-purple)"/>

<!-- outputs -->
<rect x="540" y="140" width="200" height="60" rx="8" fill="#eef1f6" stroke="#5a6577" stroke-width="1.2"/>
<text x="640" y="165" font-size="13" font-weight="600" text-anchor="middle" fill="#1a2230">Other cortical areas</text>
<text x="640" y="184" font-size="12" text-anchor="middle" fill="#5a6577">feedforward, up the hierarchy</text>
<line x1="420" y1="170" x2="534" y2="170" stroke="#e5533c" stroke-width="2.5" marker-end="url(#a-red)"/>
<rect x="540" y="320" width="200" height="76" rx="8" fill="#eef1f6" stroke="#5a6577" stroke-width="1.2"/>
<text x="640" y="344" font-size="13" font-weight="600" text-anchor="middle" fill="#1a2230">Below the cortex</text>
<text x="640" y="363" font-size="12" text-anchor="middle" fill="#5a6577">brainstem, spinal cord,</text>
<text x="640" y="380" font-size="12" text-anchor="middle" fill="#5a6577">striatum, higher thalamus</text>
<line x1="420" y1="355" x2="534" y2="355" stroke="#e5533c" stroke-width="2.5" marker-end="url(#a-red)"/>
<text x="478" y="162" font-size="12" text-anchor="middle" fill="#e5533c">output</text>
<text x="478" y="347" font-size="12" text-anchor="middle" fill="#e5533c">output</text>
</svg>
