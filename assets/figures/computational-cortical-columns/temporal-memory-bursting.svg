<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Temporal memory: a surprising input makes minicolumns burst, a predicted input activates only the predicted cells</title>
<rect width="760" height="430" fill="#ffffff"/>
<text x="24" y="32" font-size="18" font-weight="600" fill="#1a2230">Same minicolumns, different cells</text>
<text x="24" y="54" font-size="13" fill="#5a6577">Input “C” always turns on the same 3 of these 6 minicolumns; which cells fire inside them carries the context.</text>
<text x="24" y="92" font-size="14" font-weight="600" fill="#1a2230">Not predicted: the minicolumns burst</text>
<text x="24" y="110" font-size="12" fill="#5a6577">nothing was depolarised, so every cell fires</text>
<rect x="26" y="128" width="36" height="200" rx="8" fill="#eef1f6" stroke="#d6dbe3" stroke-width="1"/>
<circle cx="44" cy="158" r="12" fill="#ffffff" stroke="#5a6577" stroke-width="1.5"/>
<circle cx="44" cy="204" r="12" fill="#ffffff" stroke="#5a6577" stroke-width="1.5"/>
<circle cx="44" cy="250" r="12" fill="#ffffff" stroke="#5a6577" stroke-width="1.5"/>
<circle cx="44" cy="296" r="12" fill="#ffffff" stroke="#5a6577" stroke-width="1.5"/>
<rect x="80" y="128" width="36" height="200" rx="8" fill="#fff7e0" stroke="#d9a000" stroke-width="2"/>
