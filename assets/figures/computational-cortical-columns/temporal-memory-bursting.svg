<circle cx="532" cy="204" r="12" fill="#ffffff" stroke="#5a6577" stroke-width="1.5"/>
<circle cx="532" cy="250" r="12" fill="#ffffff" stroke="#5a6577" stroke-width="1.5"/>
<circle cx="532" cy="296" r="12" fill="#ffffff" stroke="#5a6577" stroke-width="1.5"/>
<rect x="568" y="128" width="36" height="200" rx="8" fill="#fff7e0" stroke="#d9a000" stroke-width="2"/>
<circle cx="586" cy="158" r="15" fill="none" stroke="#1d57cc" stroke-width="2.5" stroke-dasharray="4 3"/>
<circle cx="586" cy="158" r="12" fill="#2f6fed"/>
<circle cx="586" cy="204" r="12" fill="#ffffff" stroke="#5a6577" stroke-width="1.5"/>
<circle cx="586" cy="250" r="12" fill="#ffffff" stroke="#5a6577" stroke-width="1.5"/>
<circle cx="586" cy="296" r="12" fill="#ffffff" stroke="#5a6577" stroke-width="1.5"/>
<rect x="622" y="128" width="36" height="200" rx="8" fill="#fff7e0" stroke="#d9a000" stroke-width="2"/>
<circle cx="640" cy="158" r="12" fill="#ffffff" stroke="#5a6577" stroke-width="1.5"/>
<circle cx="640" cy="204" r="12" fill="#ffffff" stroke="#5a6577" stroke-width="1.5"/>
<circle cx="640" cy="250" r="12" fill="#ffffff" stroke="#5a6577" stroke-width="1.5"/>
<circle cx="640" cy="296" r="15" fill="none" stroke="#1d57cc" stroke-width="2.5" stroke-dasharray="4 3"/>
<circle cx="640" cy="296" r="12" fill="#2f6fed"/>
<rect x="676" y="128" width="36" height="200" rx="8" fill="#eef1f6" stroke="#d6dbe3" stroke-width="1"/>
<circle cx="694" cy="158" r="12" fill="#ffffff" stroke="#5a6577" stroke-width="1.5"/>
<circle cx="694" cy="204" r="12" fill="#ffffff" stroke="#5a6577" stroke-width="1.5"/>
<circle cx="694" cy="250" r="12" fill="#ffffff" stroke="#5a6577" stroke-width="1.5"/>
<circle cx="694" cy="296" r="12" fill="#ffffff" stroke="#5a6577" stroke-width="1.5"/>
<text x="406" y="350" font-size="12" fill="#1a2230">3 cells fire: “C, coming after A-B”</text>
<text x="406" y="366" font-size="12" fill="#5a6577">a sparse code that also says where in the</text>
<text x="406" y="382" font-size="12" fill="#5a6577">sequence we are, so D can be predicted next</text>
<rect x="24" y="399" width="14" height="14" rx="3" fill="#fff7e0" stroke="#d9a000" stroke-width="1.5"/><text x="44" y="410" font-size="12" fill="#1a2230">minicolumn driven by the input</text>
<circle cx="256" cy="406" r="7" fill="#e5533c"/><text x="268" y="410" font-size="12" fill="#1a2230">bursting cell</text>
<circle cx="376" cy="406" r="7" fill="#2f6fed"/><circle cx="376" cy="406" r="10" fill="none" stroke="#1d57cc" stroke-width="1.5" stroke-dasharray="3 2"/><text x="392" y="410" font-size="12" fill="#1a2230">cell that was predictive (dashed ring) and fires</text>
</svg>
