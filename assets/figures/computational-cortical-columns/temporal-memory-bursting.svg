<circle cx="152" cy="158" r="12" fill="#ffffff" stroke="#5a6577" stroke-width="1.5"/>
<circle cx="152" cy="204" r="12" fill="#ffffff" stroke="#5a6577" stroke-width="1.5"/>
<circle cx="152" cy="250" r="12" fill="#ffffff" stroke="#5a6577" stroke-width="1.5"/>
<circle cx="152" cy="296" r="12" fill="#ffffff" stroke="#5a6577" stroke-width="1.5"/>
<rect x="188" y="128" width="36" height="200" rx="8" fill="#fff7e0" stroke="#d9a000" stroke-width="2"/>
<circle cx="206" cy="158" r="12" fill="#e5533c"/>
<circle cx="206" cy="204" r="12" fill="#e5533c"/>
<circle cx="206" cy="250" r="12" fill="#e5533c"/>
<circle cx="206" cy="296" r="12" fill="#e5533c"/>
<rect x="242" y="128" width="36" height="200" rx="8" fill="#fff7e0" stroke="#d9a000" stroke-width="2"/>
<circle cx="260" cy="158" r="12" fill="#e5533c"/>
<circle cx="260" cy="204" r="12" fill="#e5533c"/>
<circle cx="260" cy="250" r="12" fill="#e5533c"/>
<circle cx="260" cy="296" r="12" fill="#e5533c"/>
<rect x="296" y="128" width="36" height="200" rx="8" fill="#eef1f6" stroke="#d6dbe3" stroke-width="1"/>
<circle cx="314" cy="158" r="12" fill="#ffffff" stroke="#5a6577" stroke-width="1.5"/>
<circle cx="314" cy="204" r="12" fill="#ffffff" stroke="#5a6577" stroke-width="1.5"/>
<circle cx="314" cy="250" r="12" fill="#ffffff" stroke="#5a6577" stroke-width="1.5"/>
<circle cx="314" cy="296" r="12" fill="#ffffff" stroke="#5a6577" stroke-width="1.5"/>
<text x="26" y="350" font-size="12" fill="#1a2230">12 cells fire: “this is C, but which C?”</text>
<text x="26" y="366" font-size="12" fill="#5a6577">the burst flags surprise and lets new</text>
<text x="26" y="382" font-size="12" fill="#5a6577">segments learn from a broad pattern</text>
<text x="404" y="92" font-size="14" font-weight="600" fill="#1a2230">Predicted: only the primed cells fire</text>
<text x="404" y="110" font-size="12" fill="#5a6577">one cell per minicolumn was depolarised</text>
<rect x="406" y="128" width="36" height="200" rx="8" fill="#eef1f6" stroke="#d6dbe3" stroke-width="1"/>
<circle cx="424" cy="158" r="12" fill="#ffffff" stroke="#5a6577" stroke-width="1.5"/>
