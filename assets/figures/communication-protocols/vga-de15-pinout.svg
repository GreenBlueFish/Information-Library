<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>DE-15 (VGA) connector pinout</title>
<rect width="760" height="380" fill="#ffffff"/>
<text x="24" y="36" font-size="18" font-weight="600" fill="#1a2230">DE-15 plug, looking at the pins</text>
<path d="M40 90 H380 Q392 90 389 102 L357 262 Q355 272 343 272 H77 Q65 272 63 262 L31 102 Q28 90 40 90 Z" fill="#eef1f6" stroke="#5a6577" stroke-width="2"/>
<g font-size="14" font-weight="700" text-anchor="middle" stroke-width="4">
<circle cx="98" cy="118" r="17" fill="#e5533c" stroke="#e5533c"/><text x="98" y="123" fill="#ffffff" stroke="none">1</text>
<circle cx="154" cy="118" r="17" fill="#2a9d5c" stroke="#2a9d5c"/><text x="154" y="123" fill="#ffffff" stroke="none">2</text>
<circle cx="210" cy="118" r="17" fill="#2f6fed" stroke="#2f6fed"/><text x="210" y="123" fill="#ffffff" stroke="none">3</text>
<circle cx="266" cy="118" r="17" fill="#d6dbe3" stroke="#9aa4b2"/><text x="266" y="123" fill="#1a2230" stroke="none">4</text>
<circle cx="322" cy="118" r="17" fill="#243b53" stroke="#243b53"/><text x="322" y="123" fill="#ffffff" stroke="none">5</text>
<circle cx="70" cy="176" r="17" fill="#ffffff" stroke="#e5533c"/><text x="70" y="181" fill="#e5533c" stroke="none">6</text>
<circle cx="126" cy="176" r="17" fill="#ffffff" stroke="#2a9d5c"/><text x="126" y="181" fill="#2a9d5c" stroke="none">7</text>
<circle cx="182" cy="176" r="17" fill="#ffffff" stroke="#2f6fed"/><text x="182" y="181" fill="#2f6fed" stroke="none">8</text>
<circle cx="238" cy="176" r="17" fill="#b659d6" stroke="#b659d6"/><text x="238" y="181" fill="#ffffff" stroke="none">9</text>
<circle cx="294" cy="176" r="17" fill="#243b53" stroke="#243b53"/><text x="294" y="181" fill="#ffffff" stroke="none">10</text>
<circle cx="98" cy="234" r="17" fill="#d6dbe3" stroke="#9aa4b2"/><text x="98" y="239" fill="#1a2230" stroke="none">11</text>
<circle cx="154" cy="234" r="17" fill="#1aa3b3" stroke="#1aa3b3"/><text x="154" y="239" fill="#ffffff" stroke="none">12</text>
<circle cx="210" cy="234" r="17" fill="#d9a000" stroke="#d9a000"/><text x="210" y="239" fill="#1a2230" stroke="none">13</text>
<circle cx="266" cy="234" r="17" fill="#d9a000" stroke="#d9a000"/><text x="266" y="239" fill="#1a2230" stroke="none">14</text>
<circle cx="322" cy="234" r="17" fill="#1aa3b3" stroke="#1aa3b3"/><text x="322" y="239" fill="#ffffff" stroke="none">15</text>
</g>
<text x="210" y="306" font-size="13" text-anchor="middle" fill="#5a6577">Schematic, not to scale. Hollow pins are the</text>
<text x="210" y="324" font-size="13" text-anchor="middle" fill="#5a6577">colour returns. On the socket the order is mirrored.</text>
<g font-size="14" fill="#1a2230" stroke-width="2.5">
<text x="430" y="36" font-size="18" font-weight="600">Pin and signal</text>
<circle cx="438" cy="57" r="6" fill="#e5533c" stroke="#e5533c"/><text x="454" y="62"><tspan font-weight="600">1</tspan>  Red video (0 to 0.7 V)</text>
<circle cx="438" cy="78" r="6" fill="#2a9d5c" stroke="#2a9d5c"/><text x="454" y="83"><tspan font-weight="600">2</tspan>  Green video</text>
<circle cx="438" cy="99" r="6" fill="#2f6fed" stroke="#2f6fed"/><text x="454" y="104"><tspan font-weight="600">3</tspan>  Blue video</text>
<circle cx="438" cy="120" r="6" fill="#d6dbe3" stroke="#9aa4b2"/><text x="454" y="125"><tspan font-weight="600">4</tspan>  Reserved (was monitor ID bit 2)</text>
<circle cx="438" cy="141" r="6" fill="#243b53" stroke="#243b53"/><text x="454" y="146"><tspan font-weight="600">5</tspan>  Ground</text>
<circle cx="438" cy="162" r="6" fill="#ffffff" stroke="#e5533c"/><text x="454" y="167"><tspan font-weight="600">6</tspan>  Red return (ground)</text>
<circle cx="438" cy="183" r="6" fill="#ffffff" stroke="#2a9d5c"/><text x="454" y="188"><tspan font-weight="600">7</tspan>  Green return (ground)</text>
<circle cx="438" cy="204" r="6" fill="#ffffff" stroke="#2f6fed"/><text x="454" y="209"><tspan font-weight="600">8</tspan>  Blue return (ground)</text>
<circle cx="438" cy="225" r="6" fill="#b659d6" stroke="#b659d6"/><text x="454" y="230"><tspan font-weight="600">9</tspan>  +5 V for the DDC chip</text>
<circle cx="438" cy="246" r="6" fill="#243b53" stroke="#243b53"/><text x="454" y="251"><tspan font-weight="600">10</tspan>  Sync ground</text>
<circle cx="438" cy="267" r="6" fill="#d6dbe3" stroke="#9aa4b2"/><text x="454" y="272"><tspan font-weight="600">11</tspan>  Reserved (was monitor ID bit 0)</text>
<circle cx="438" cy="288" r="6" fill="#1aa3b3" stroke="#1aa3b3"/><text x="454" y="293"><tspan font-weight="600">12</tspan>  DDC data (I²C SDA)</text>
<circle cx="438" cy="309" r="6" fill="#d9a000" stroke="#d9a000"/><text x="454" y="314"><tspan font-weight="600">13</tspan>  HSYNC (digital, TTL level)</text>
<circle cx="438" cy="330" r="6" fill="#d9a000" stroke="#d9a000"/><text x="454" y="335"><tspan font-weight="600">14</tspan>  VSYNC (digital, TTL level)</text>
<circle cx="438" cy="351" r="6" fill="#1aa3b3" stroke="#1aa3b3"/><text x="454" y="356"><tspan font-weight="600">15</tspan>  DDC clock (I²C SCL)</text>
</g>
</svg>
