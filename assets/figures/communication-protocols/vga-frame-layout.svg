<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>A VGA frame: the visible area surrounded by blanking intervals</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1d57cc"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5a6577"/></marker>
</defs>
<rect width="760" height="560" fill="#ffffff"/>
<text x="24" y="30" font-size="18" font-weight="600" fill="#1a2230">One frame, 640×480 at 60 Hz: 800 × 525 clocks, drawn to scale</text>
<!-- whole frame -->
<rect x="60" y="60" width="640" height="420" fill="#eef1f6" stroke="#5a6577" stroke-width="1.5"/>
<!-- horizontal sync column and vertical sync row -->
<rect x="584.8" y="60" width="76.8" height="420" fill="#fff7e0"/>
<rect x="60" y="452" width="640" height="1.6" fill="#d9a000"/>
<rect x="584.8" y="60" width="76.8" height="420" fill="none" stroke="#d9a000" stroke-width="1"/>
<!-- visible area -->
<rect x="60" y="60" width="512" height="384" fill="#e6efff" stroke="#2f6fed" stroke-width="2"/>
<text x="316" y="250" font-size="18" font-weight="600" text-anchor="middle" fill="#1d57cc">Visible area</text>
<text x="316" y="274" font-size="14" text-anchor="middle" fill="#1d57cc">640 pixels × 480 lines</text>
<!-- scan path -->
<g stroke="#1d57cc" stroke-width="2" fill="none">
<line x1="72" y1="84" x2="556" y2="84" marker-end="url(#arrow)"/>
<line x1="72" y1="114" x2="556" y2="114" marker-end="url(#arrow)"/>
<line x1="72" y1="144" x2="556" y2="144" marker-end="url(#arrow)"/>
</g>
<g stroke="#5a6577" stroke-width="1.5" stroke-dasharray="6 4" fill="none">
<line x1="690" y1="88" x2="76" y2="110" marker-end="url(#arrow-muted)"/>
<line x1="690" y1="118" x2="76" y2="140" marker-end="url(#arrow-muted)"/>
<path d="M690 472 C 720 520, 30 520, 66 70" marker-end="url(#arrow-muted)"/>
</g>
<line x1="556" y1="84" x2="690" y2="84" stroke="#5a6577" stroke-width="1.5" stroke-dasharray="2 3"/>
<text x="316" y="76" font-size="12" text-anchor="middle" fill="#1d57cc">line 0, left to right</text>
<text x="316" y="176" font-size="12" text-anchor="middle" fill="#5a6577">dashed: the beam returning (retrace) while the signal is blanked</text>
<!-- horizontal blanking labels -->
<g font-size="12" fill="#1a2230" text-anchor="middle">
<text x="578" y="54">FP</text>
<text x="623" y="54">HSYNC</text>
<text x="681" y="54">BP</text>
</g>
<text x="642" y="300" font-size="13" text-anchor="middle" fill="#5a6577" transform="rotate(-90 642 300)">horizontal blanking: 16 + 96 + 48 clocks</text>
<!-- vertical blanking labels -->
<line x1="700" y1="448" x2="716" y2="448" stroke="#5a6577"/>
<line x1="700" y1="453" x2="716" y2="462" stroke="#d9a000"/>
<line x1="700" y1="467" x2="716" y2="476" stroke="#5a6577"/>
<g font-size="12" fill="#1a2230">
<text x="720" y="444">FP</text>
<text x="720" y="466">VSYNC</text>
<text x="720" y="488">BP</text>
</g>
<text x="316" y="470" font-size="13" text-anchor="middle" fill="#5a6577">vertical blanking: 10 + 2 + 33 lines</text>
<!-- dimension notes -->
<text x="380" y="530" font-size="12" text-anchor="middle" fill="#5a6577">vertical retrace back to the top-left corner, then the next frame starts</text>
<text x="380" y="550" font-size="12" text-anchor="middle" fill="#5a6577">800 × 525 = 420,000 clocks per frame; 25.175 MHz ÷ 420,000 ≈ 59.94 frames per second</text>
</svg>
