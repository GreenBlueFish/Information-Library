<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Timing of one VGA scanline at 640 by 480, 60 Hz</title>
<rect width="760" height="360" fill="#ffffff"/>
<text x="24" y="30" font-size="18" font-weight="600" fill="#1a2230">One scanline, 640×480 at 60 Hz (800 pixel clocks)</text>
<!-- porch labels with leaders -->
<g font-size="13" fill="#1a2230">
<text x="560" y="58" text-anchor="end">Front porch 16</text>
<line x1="563" y1="54" x2="594" y2="54" stroke="#5a6577"/><line x1="594" y1="54" x2="594" y2="74" stroke="#5a6577"/>
<text x="735" y="58" text-anchor="end">Back porch 48</text>
<line x1="700.2" y1="62" x2="700.2" y2="74" stroke="#5a6577"/>
</g>
<!-- region bar -->
<rect x="60" y="74" width="528" height="32" fill="#e6efff" stroke="#2f6fed" stroke-width="1.5"/>
<text x="324" y="95" font-size="14" font-weight="600" text-anchor="middle" fill="#1d57cc">Visible: 640 pixels drawn</text>
<rect x="588" y="74" width="13.2" height="32" fill="#eef1f6" stroke="#5a6577" stroke-width="1.5"/>
<rect x="601.2" y="74" width="79.2" height="32" fill="#fff7e0" stroke="#d9a000" stroke-width="1.5"/>
<rect x="680.4" y="74" width="39.6" height="32" fill="#eef1f6" stroke="#5a6577" stroke-width="1.5"/>
<text x="640.8" y="95" font-size="13" text-anchor="middle" fill="#1a2230">Sync 96</text>
<text x="660" y="125" font-size="12" text-anchor="middle" fill="#5a6577">horizontal blanking (160 clocks)</text>
<line x1="588" y1="114" x2="720" y2="114" stroke="#5a6577"/>
<!-- RGB waveform -->
<text x="60" y="140" font-size="13" fill="#1a2230"><tspan font-weight="600">RGB video</tspan> (analog, 0–0.7 V)</text>
<line x1="60" y1="200" x2="720" y2="200" stroke="#e4e8ee"/>
<polyline fill="none" stroke="#2a9d5c" stroke-width="2.5" stroke-linejoin="round" points="60,200 64,200 64,152 130,152 130,178 190,178 190,160 250,160 250,192 300,192 300,152 380,152 380,170 440,170 440,155 500,155 500,185 545,185 545,152 588,152 588,200 720,200"/>
<text x="654" y="192" font-size="12" text-anchor="middle" fill="#5a6577">held at 0 V (black)</text>
<!-- HSYNC -->
<text x="60" y="230" font-size="13" fill="#1a2230"><tspan font-weight="600">HSYNC</tspan> (digital, active low in this mode)</text>
<polyline fill="none" stroke="#d9a000" stroke-width="2.5" stroke-linejoin="round" points="60,240 601.2,240 601.2,280 680.4,280 680.4,240 720,240"/>
<text x="640.8" y="300" font-size="12" text-anchor="middle" fill="#5a6577">pulse: 3.81 µs</text>
<!-- axis -->
<line x1="60" y1="318" x2="720" y2="318" stroke="#5a6577"/>
<g stroke="#5a6577"><line x1="60" y1="314" x2="60" y2="322"/><line x1="588" y1="314" x2="588" y2="322"/><line x1="601.2" y1="314" x2="601.2" y2="322"/><line x1="680.4" y1="314" x2="680.4" y2="322"/><line x1="720" y1="314" x2="720" y2="322"/></g>
<g font-size="12" fill="#5a6577" text-anchor="middle">
<text x="60" y="338">0</text>
<text x="572" y="338">640</text>
<text x="608" y="352">656</text>
<text x="680.4" y="338">752</text>
<text x="726" y="352">800</text>
</g>
<text x="300" y="344" font-size="12" text-anchor="middle" fill="#5a6577">pixel clock count (25.175 MHz, one clock ≈ 39.7 ns; the line lasts 31.78 µs)</text>
</svg>
