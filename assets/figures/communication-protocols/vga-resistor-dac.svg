<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>A 4-bit resistor DAC driving the VGA red line from an FPGA</title>
<rect width="760" height="370" fill="#ffffff"/>
<text x="24" y="30" font-size="18" font-weight="600" fill="#1a2230">Making 0 to 0.7 V from digital pins: a 4-bit resistor DAC (red channel)</text>
<!-- FPGA -->
<rect x="40" y="70" width="120" height="180" rx="8" fill="#eef1f6" stroke="#5a6577" stroke-width="1.5"/>
<text x="100" y="270" font-size="14" font-weight="600" text-anchor="middle" fill="#1a2230">FPGA</text>
<text x="100" y="288" font-size="12" text-anchor="middle" fill="#5a6577">3.3 V outputs</text>
<g font-size="13" fill="#1a2230" text-anchor="end">
<text x="152" y="105">R[3]</text><text x="152" y="145">R[2]</text><text x="152" y="185">R[1]</text><text x="152" y="225">R[0]</text>
</g>
<!-- wires and resistors -->
<g stroke="#1a2230" stroke-width="2" fill="none">
<path d="M160 100 H230 l8 -8 l16 16 l16 -16 l16 16 l16 -16 l8 8 H420"/>
<path d="M160 140 H230 l8 -8 l16 16 l16 -16 l16 16 l16 -16 l8 8 H420"/>
<path d="M160 180 H230 l8 -8 l16 16 l16 -16 l16 16 l16 -16 l8 8 H420"/>
<path d="M160 220 H230 l8 -8 l16 16 l16 -16 l16 16 l16 -16 l8 8 H420"/>
<path d="M420 100 V220"/>
<path d="M420 160 H600"/>
<path d="M640 160 H680 V180 l-8 6 l16 10 l-16 10 l16 10 l-16 10 l8 6 V256"/>
<path d="M666 256 H694 M671 262 H689 M676 268 H684"/>
</g>
<circle cx="420" cy="160" r="4" fill="#1a2230"/>
<g font-size="13" fill="#1a2230" text-anchor="middle">
<text x="270" y="86">510 Ω  (MSB)</text><text x="270" y="126">1 kΩ</text><text x="270" y="166">2 kΩ</text><text x="270" y="206">4 kΩ  (LSB)</text>
</g>
<!-- connector and cable -->
<rect x="600" y="146" width="40" height="28" rx="4" fill="#e5533c"/>
<text x="620" y="140" font-size="12" text-anchor="middle" fill="#1a2230">pin 1</text>
<text x="520" y="152" font-size="12" text-anchor="middle" fill="#5a6577">to the DE-15 plug</text>
<text x="704" y="212" font-size="13" fill="#1a2230">75 Ω</text>
<text x="704" y="230" font-size="12" fill="#5a6577">inside the</text>
<text x="704" y="246" font-size="12" fill="#5a6577">monitor</text>
<!-- notes -->
<text x="40" y="314" font-size="12" fill="#5a6577">Each resistor is half the one below it, so each bit pushes twice the current of the bit beneath it.</text>
<text x="40" y="332" font-size="12" fill="#5a6577">All four bits high: the resistors in parallel (≈270 Ω) and the 75 Ω load divide 3.3 V to ≈0.72 V, full brightness.</text>
<text x="40" y="350" font-size="12" fill="#5a6577">That gives 16 levels per colour (4,096 colours in all); green and blue are wired the same way.</text>
</svg>
