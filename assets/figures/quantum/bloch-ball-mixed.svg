<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Cross-section of the Bloch ball: pure states on the circle, mixed states inside, the maximally mixed state at the centre</title>
<rect width="760" height="440" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a2230"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2a9d5c"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e5533c"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f6fed"/></marker></defs>
<text x="20.0" y="30.0" font-size="17" text-anchor="start" fill="#1a2230" font-weight="600">Pure and mixed states in the Bloch ball</text>
<circle cx="200.0" cy="235.0" r="140" fill="#eef1f6" stroke="#1a2230" stroke-width="2"/>
<line x1="200.0" y1="75.0" x2="200.0" y2="395.0" stroke="#5a6577" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/>
<line x1="40.0" y1="235.0" x2="360.0" y2="235.0" stroke="#5a6577" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/>
<text x="200.0" y="69.0" font-size="15" text-anchor="middle" fill="#1a2230" font-weight="600">|0⟩</text>
<text x="200.0" y="413.0" font-size="15" text-anchor="middle" fill="#1a2230" font-weight="600">|1⟩</text>
<text x="374.0" y="240.0" font-size="15" text-anchor="middle" fill="#1a2230" font-weight="600">|+⟩</text>
<text x="26.0" y="240.0" font-size="15" text-anchor="middle" fill="#1a2230" font-weight="600">|−⟩</text>
<circle cx="200" cy="235" r="6" fill="#e5533c"/>
<circle cx="200" cy="123.0" r="6" fill="#d9a000"/>
<circle cx="340" cy="235" r="6" fill="#2f6fed"/>
<circle cx="412" cy="115" r="6" fill="#2f6fed"/>
<text x="426.0" y="120.0" font-size="13" text-anchor="start" fill="#1a2230" font-weight="400">|+⟩⟨+|: pure, on the surface, |r| = 1</text>
<circle cx="412" cy="170" r="6" fill="#d9a000"/>
<text x="426.0" y="175.0" font-size="13" text-anchor="start" fill="#1a2230" font-weight="400">0.9|0⟩⟨0| + 0.1|1⟩⟨1|: |r| = 0.8</text>
<circle cx="412" cy="225" r="6" fill="#e5533c"/>
<text x="426.0" y="230.0" font-size="13" text-anchor="start" fill="#1a2230" font-weight="400">I/2: maximally mixed, at the centre</text>
<text x="426.0" y="193.0" font-size="13" text-anchor="start" fill="#5a6577" font-weight="400">(purity 0.82)</text>
<text x="412.0" y="300.0" font-size="14" text-anchor="start" fill="#1a2230" font-weight="600">Purity = (1 + |r|²)/2</text>
<text x="412.0" y="324.0" font-size="13" text-anchor="start" fill="#5a6577" font-weight="400">Noise and partial traces shorten r;</text>
<text x="412.0" y="344.0" font-size="13" text-anchor="start" fill="#5a6577" font-weight="400">unitaries only rotate it.</text>
</svg>
