<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" width="620" height="250" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Two-qubit basis states in order 00, 01, 10, 11, with qubit 1 as the most significant bit</title>
<rect width="620" height="250" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a2230"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2a9d5c"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e5533c"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f6fed"/></marker></defs>
<text x="20.0" y="30.0" font-size="17" text-anchor="start" fill="#1a2230" font-weight="600">Basis order for two qubits (qubit 1 = left factor)</text>
<rect x="60" y="70" width="110" height="90" rx="6" fill="#ffffff" stroke="#d6dbe3" stroke-width="2"/>
<text x="115.0" y="104.0" font-size="20" text-anchor="middle" fill="#1a2230" font-weight="600">|00⟩</text>
<text x="115.0" y="130.0" font-size="13" text-anchor="middle" fill="#5a6577" font-weight="400">index 0</text>
<text x="115.0" y="150.0" font-size="12" text-anchor="middle" fill="#5a6577" font-weight="400">q1 = 0, q2 = 0</text>
<rect x="195" y="70" width="110" height="90" rx="6" fill="#eef1f6" stroke="#d6dbe3" stroke-width="2"/>
<text x="250.0" y="104.0" font-size="20" text-anchor="middle" fill="#1a2230" font-weight="600">|01⟩</text>
<text x="250.0" y="130.0" font-size="13" text-anchor="middle" fill="#5a6577" font-weight="400">index 1</text>
<text x="250.0" y="150.0" font-size="12" text-anchor="middle" fill="#5a6577" font-weight="400">q1 = 0, q2 = 1</text>
<rect x="330" y="70" width="110" height="90" rx="6" fill="#ffffff" stroke="#d6dbe3" stroke-width="2"/>
<text x="385.0" y="104.0" font-size="20" text-anchor="middle" fill="#1a2230" font-weight="600">|10⟩</text>
<text x="385.0" y="130.0" font-size="13" text-anchor="middle" fill="#5a6577" font-weight="400">index 2</text>
<text x="385.0" y="150.0" font-size="12" text-anchor="middle" fill="#5a6577" font-weight="400">q1 = 1, q2 = 0</text>
<rect x="465" y="70" width="110" height="90" rx="6" fill="#eef1f6" stroke="#d6dbe3" stroke-width="2"/>
<text x="520.0" y="104.0" font-size="20" text-anchor="middle" fill="#1a2230" font-weight="600">|11⟩</text>
<text x="520.0" y="130.0" font-size="13" text-anchor="middle" fill="#5a6577" font-weight="400">index 3</text>
<text x="520.0" y="150.0" font-size="12" text-anchor="middle" fill="#5a6577" font-weight="400">q1 = 1, q2 = 1</text>
<text x="310.0" y="200.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="400">|a⟩ ⊗ |b⟩ = np.kron(a, b): the left factor varies slowest.</text>
<text x="310.0" y="224.0" font-size="13" text-anchor="middle" fill="#5a6577" font-weight="400">X on qubit 1 is X ⊗ I and swaps indices 0↔2, 1↔3.</text>
</svg>
