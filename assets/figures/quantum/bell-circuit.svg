<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Hadamard on qubit 1 then a CNOT from qubit 1 to qubit 2 turns |00> into the Bell state</title>
<rect width="640" height="250" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a2230"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2a9d5c"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e5533c"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f6fed"/></marker></defs>
<text x="20.0" y="30.0" font-size="17" text-anchor="start" fill="#1a2230" font-weight="600">Making a Bell state</text>
<text x="78.0" y="100.0" font-size="15" text-anchor="end" fill="#1a2230" font-weight="600">q1 |0⟩</text>
<line x1="90.0" y1="95.0" x2="560.0" y2="95.0" stroke="#1a2230" stroke-width="2" stroke-linecap="round"/>
<text x="78.0" y="170.0" font-size="15" text-anchor="end" fill="#1a2230" font-weight="600">q2 |0⟩</text>
<line x1="90.0" y1="165.0" x2="560.0" y2="165.0" stroke="#1a2230" stroke-width="2" stroke-linecap="round"/>
<rect x="177.0" y="73" width="46" height="44" rx="6" fill="#ffffff" stroke="#2f6fed" stroke-width="2"/>
<text x="200.0" y="101.0" font-size="16" text-anchor="middle" fill="#1a2230" font-weight="600">H</text>
<line x1="360.0" y1="95.0" x2="360.0" y2="179.0" stroke="#1a2230" stroke-width="2" stroke-linecap="round"/>
<circle cx="360" cy="95" r="7" fill="#1a2230"/>
<circle cx="360.0" cy="165.0" r="14" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<line x1="346.0" y1="165.0" x2="374.0" y2="165.0" stroke="#1a2230" stroke-width="2" stroke-linecap="round"/>
<line x1="360.0" y1="151.0" x2="360.0" y2="179.0" stroke="#1a2230" stroke-width="2" stroke-linecap="round"/>
<line x1="140.0" y1="60.0" x2="140.0" y2="200.0" stroke="#5a6577" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="140.0" y="225.0" font-size="14" text-anchor="middle" fill="#5a6577" font-weight="400">|00⟩</text>
<line x1="280.0" y1="60.0" x2="280.0" y2="200.0" stroke="#5a6577" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="280.0" y="225.0" font-size="14" text-anchor="middle" fill="#5a6577" font-weight="400">(|00⟩ + |10⟩)/√2</text>
<line x1="470.0" y1="60.0" x2="470.0" y2="200.0" stroke="#5a6577" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="470.0" y="225.0" font-size="14" text-anchor="middle" fill="#5a6577" font-weight="400">(|00⟩ + |11⟩)/√2</text>
</svg>
