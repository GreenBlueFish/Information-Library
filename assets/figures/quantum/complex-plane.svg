<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 560" width="620" height="560" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>The complex number 3+4i drawn as an arrow in the complex plane, with its length 5, angle 53.1 degrees, and the point i times z rotated by 90 degrees</title>
<rect width="620" height="560" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a2230"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f6fb0"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs>
<text x="20.0" y="30.0" font-size="17" text-anchor="start" fill="#1a2230" font-weight="600">The complex plane</text>
<line x1="50.0" y1="50.0" x2="50.0" y2="540.0" stroke="#e6e9ef" stroke-width="1"/>
