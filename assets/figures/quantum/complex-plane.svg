<text x="410.0" y="94.0" font-size="14" text-anchor="start" fill="#2f6fb0" font-weight="600">z = 3 + 4i</text>
<line x1="400.0" y1="100.0" x2="400.0" y2="300.0" stroke="#2f6fb0" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="250.0" y1="100.0" x2="400.0" y2="100.0" stroke="#2f6fb0" stroke-width="1" stroke-dasharray="4 3"/>
<text x="335.0" y="180.0" font-size="13" text-anchor="end" fill="#2f6fb0" font-weight="400">|z| = 5</text>
<path d="M 290 300 A 40 40 0 0 0 274.0 268.0" fill="none" stroke="#2f6fb0" stroke-width="1.5"/>
<text x="300.0" y="288.0" font-size="12" text-anchor="start" fill="#2f6fb0" font-weight="400">53.1°</text>
<line x1="250.0" y1="300.0" x2="50.0" y2="150.0" stroke="#2e8b57" stroke-width="2.5"/>
