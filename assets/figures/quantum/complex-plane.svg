<line x1="400.0" y1="50.0" x2="400.0" y2="540.0" stroke="#e6e9ef" stroke-width="1"/>
<line x1="450.0" y1="50.0" x2="450.0" y2="540.0" stroke="#e6e9ef" stroke-width="1"/>
<line x1="500.0" y1="50.0" x2="500.0" y2="540.0" stroke="#e6e9ef" stroke-width="1"/>
