<line x1="30.0" y1="50.0" x2="600.0" y2="50.0" stroke="#e6e9ef" stroke-width="1"/>
<line x1="30.0" y1="300.0" x2="600.0" y2="300.0" stroke="#1a2230" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="590.0" y="320.0" font-size="12" text-anchor="end" fill="#5a6577" font-weight="400">real</text>
<line x1="250.0" y1="540.0" x2="250.0" y2="50.0" stroke="#1a2230" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="258.0" y="62.0" font-size="12" text-anchor="start" fill="#5a6577" font-weight="400">imaginary</text>
<text x="300.0" y="318.0" font-size="11" text-anchor="middle" fill="#5a6577" font-weight="400">1</text>
