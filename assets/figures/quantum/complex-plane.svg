<text x="45.0" y="140.0" font-size="14" text-anchor="start" fill="#2e8b57" font-weight="600">i z = −4 + 3i</text>
<text x="140.0" y="325.0" font-size="12" text-anchor="middle" fill="#2e8b57" font-weight="400">i z: turned 90°, same length</text>
<line x1="250.0" y1="300.0" x2="400.0" y2="500.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrr)"/>
<circle cx="400" cy="500" r="4" fill="#c0392b"/>
<text x="410.0" y="504.0" font-size="14" text-anchor="start" fill="#c0392b" font-weight="600">z* = 3 − 4i</text>
<text x="410.0" y="522.0" font-size="12" text-anchor="start" fill="#c0392b" font-weight="400">(mirror image of z)</text>
