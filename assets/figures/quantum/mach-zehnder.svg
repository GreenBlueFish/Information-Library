<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>A Mach-Zehnder interferometer: a source, a first beam splitter, an upper and a lower arm with a phase shifter on the lower arm, mirrors, a second beam splitter and two detectors</title>
<rect width="660" height="400" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs>
<text x="20" y="30" font-size="17" font-weight="600" fill="#1a2230">The Mach–Zehnder interferometer</text>
<!-- beams -->
<g stroke="#c0392b" stroke-width="2.5" fill="none">
<line x1="70" y1="310" x2="170" y2="310" marker-end="url(#a)"/>
<line x1="180" y1="300" x2="180" y2="120" marker-end="url(#a)"/>
<line x1="190" y1="110" x2="470" y2="110" marker-end="url(#a)"/>
<line x1="190" y1="310" x2="470" y2="310" marker-end="url(#a)"/>
<line x1="480" y1="300" x2="480" y2="120" marker-end="url(#a)"/>
<line x1="490" y1="110" x2="570" y2="110" marker-end="url(#a)"/>
<line x1="480" y1="100" x2="480" y2="62" marker-end="url(#a)"/>
</g>
<!-- source -->
<rect x="20" y="292" width="50" height="36" rx="4" fill="#1a2230"/>
<text x="45" y="348" font-size="13" text-anchor="middle" fill="#1a2230">source</text>
<!-- beam splitters -->
<line x1="160" y1="330" x2="200" y2="290" stroke="#2c6fb7" stroke-width="5"/>
<text x="140" y="360" font-size="13" fill="#2c6fb7">BS1 (acts as H)</text>
<line x1="460" y1="130" x2="500" y2="90" stroke="#2c6fb7" stroke-width="5"/>
<text x="505" y="145" font-size="13" fill="#2c6fb7">BS2 (acts as H)</text>
<!-- mirrors -->
<line x1="160" y1="130" x2="200" y2="90" stroke="#5a6577" stroke-width="7"/>
<text x="120" y="85" font-size="13" fill="#5a6577">mirror</text>
<line x1="460" y1="330" x2="500" y2="290" stroke="#5a6577" stroke-width="7"/>
<text x="505" y="340" font-size="13" fill="#5a6577">mirror</text>
<!-- phase shifter -->
<rect x="305" y="290" width="40" height="40" rx="4" fill="#f3d9a4" stroke="#b07d1a" stroke-width="2"/>
<text x="325" y="316" font-size="16" text-anchor="middle" fill="#1a2230">φ</text>
<text x="325" y="352" font-size="13" text-anchor="middle" fill="#1a2230">phase shifter</text>
<!-- arm labels -->
<text x="330" y="98" font-size="14" text-anchor="middle" fill="#1a2230">upper arm: path state |0⟩</text>
<text x="325" y="380" font-size="14" text-anchor="middle" fill="#1a2230">lower arm: path state |1⟩</text>
<!-- detectors -->
<path d="M572 92 h28 a18 18 0 0 1 0 36 h-28 z" fill="#1a2230"/>
<text x="620" y="115" font-size="14" fill="#1a2230">D0</text>
<path d="M462 60 v-24 a18 18 0 0 1 36 0 v24 z" fill="#1a2230"/>
<text x="508" y="45" font-size="14" fill="#1a2230">D1</text>
<text x="330" y="200" font-size="13" text-anchor="middle" fill="#5a6577">D0 fires with probability cos²(φ/2),</text>
<text x="330" y="220" font-size="13" text-anchor="middle" fill="#5a6577">D1 with sin²(φ/2)</text>
</svg>
