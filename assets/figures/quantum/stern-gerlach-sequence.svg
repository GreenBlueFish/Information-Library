<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Sequential Stern-Gerlach experiment: Z, then X, then Z; the final Z magnet splits the atoms evenly again</title>
<rect width="800" height="320" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a2230"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f6fb0"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs>
<text x="20.0" y="30.0" font-size="17" text-anchor="start" fill="#1a2230" font-weight="600">Three Stern–Gerlach magnets in a row: 1000 atoms in</text>
<text x="60.0" y="110.0" font-size="13" text-anchor="middle" fill="#5a6577" font-weight="400">oven</text>
<rect x="30" y="125" width="60" height="50" rx="8" fill="#eef1f6" stroke="#9aa5b5" stroke-width="1.5"/>
<line x1="90.0" y1="150.0" x2="140.0" y2="150.0" stroke="#1a2230" stroke-width="2" marker-end="url(#arr)"/>
<text x="115.0" y="140.0" font-size="12" text-anchor="middle" fill="#5a6577" font-weight="400">1000</text>
<rect x="140" y="115" width="90" height="70" rx="8" fill="#dfe8f3" stroke="#2f6fb0" stroke-width="1.5"/>
<text x="185.0" y="155.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">Z magnet</text>
<line x1="230.0" y1="138.0" x2="290.0" y2="95.0" stroke="#2f6fb0" stroke-width="2" marker-end="url(#arrb)"/>
<text x="290.0" y="85.0" font-size="13" text-anchor="middle" fill="#2f6fb0" font-weight="400">up: 500</text>
<line x1="230.0" y1="162.0" x2="290.0" y2="205.0" stroke="#c0392b" stroke-width="2" marker-end="url(#arrr)"/>
<text x="290.0" y="225.0" font-size="13" text-anchor="middle" fill="#c0392b" font-weight="400">down: 500 (blocked)</text>
<line x1="290.0" y1="95.0" x2="360.0" y2="150.0" stroke="#2f6fb0" stroke-width="2" marker-end="url(#arrb)" stroke-dasharray="5 4"/>
<rect x="360" y="115" width="90" height="70" rx="8" fill="#dfe8f3" stroke="#2f6fb0" stroke-width="1.5"/>
<text x="405.0" y="155.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">X magnet</text>
<line x1="450.0" y1="138.0" x2="510.0" y2="95.0" stroke="#2f6fb0" stroke-width="2" marker-end="url(#arrb)"/>
<text x="510.0" y="85.0" font-size="13" text-anchor="middle" fill="#2f6fb0" font-weight="400">+x: 250</text>
<line x1="450.0" y1="162.0" x2="510.0" y2="205.0" stroke="#c0392b" stroke-width="2" marker-end="url(#arrr)"/>
<text x="510.0" y="225.0" font-size="13" text-anchor="middle" fill="#c0392b" font-weight="400">−x: 250 (blocked)</text>
<line x1="510.0" y1="95.0" x2="580.0" y2="150.0" stroke="#2f6fb0" stroke-width="2" marker-end="url(#arrb)" stroke-dasharray="5 4"/>
<rect x="580" y="115" width="90" height="70" rx="8" fill="#dfe8f3" stroke="#2f6fb0" stroke-width="1.5"/>
<text x="625.0" y="155.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">Z magnet</text>
<line x1="670.0" y1="138.0" x2="730.0" y2="95.0" stroke="#2f6fb0" stroke-width="2" marker-end="url(#arrb)"/>
<text x="730.0" y="85.0" font-size="13" text-anchor="middle" fill="#2f6fb0" font-weight="400">up: 125</text>
<line x1="670.0" y1="162.0" x2="730.0" y2="205.0" stroke="#c0392b" stroke-width="2" marker-end="url(#arrr)"/>
<text x="730.0" y="225.0" font-size="13" text-anchor="middle" fill="#c0392b" font-weight="400">down: 125</text>
<text x="400.0" y="280.0" font-size="13" text-anchor="middle" fill="#5a6577" font-weight="400">The X magnet sits between two Z magnets. Without it, the second Z magnet would give 500 up and 0 down.</text>
<text x="400.0" y="300.0" font-size="13" text-anchor="middle" fill="#5a6577" font-weight="400">With it, the 'up' that the first magnet selected is forgotten: the last magnet splits 125 / 125.</text>
</svg>
