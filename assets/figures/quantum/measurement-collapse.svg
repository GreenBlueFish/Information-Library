<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>A Z measurement sends alpha|0> + beta|1> to |0> with probability |alpha|^2 or |1> with probability |beta|^2</title>
<rect width="640" height="280" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a2230"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2a9d5c"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e5533c"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f6fed"/></marker></defs>
<text x="20.0" y="30.0" font-size="17" text-anchor="start" fill="#1a2230" font-weight="600">Measuring in the computational basis</text>
<rect x="20" y="110" width="170" height="60" rx="6" fill="#eef1f6" stroke="#d6dbe3" stroke-width="2"/>
<text x="105.0" y="146.0" font-size="17" text-anchor="middle" fill="#1a2230" font-weight="600">α|0⟩ + β|1⟩</text>
<rect x="250" y="110" width="110" height="60" rx="6" fill="#ffffff" stroke="#1a2230" stroke-width="2"/>
<text x="305.0" y="137.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="400">measure</text>
<text x="305.0" y="157.0" font-size="15" text-anchor="middle" fill="#1a2230" font-weight="600" font-style="italic">Z</text>
<line x1="190.0" y1="140.0" x2="248.0" y2="140.0" stroke="#1a2230" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<path d="M360 140 C 400 140, 410 75, 470 75" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/>
<path d="M360 140 C 400 140, 410 205, 470 205" fill="none" stroke="#1a2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="415.0" y="70.0" font-size="13" text-anchor="middle" fill="#5a6577" font-weight="400">P = |α|²</text>
<text x="415.0" y="230.0" font-size="13" text-anchor="middle" fill="#5a6577" font-weight="400">P = |β|²</text>
<rect x="475" y="47" width="145" height="56" rx="6" fill="#ffffff" stroke="#2f6fed" stroke-width="2"/>
<text x="547.0" y="69.0" font-size="13" text-anchor="middle" fill="#5a6577" font-weight="400">outcome 0</text>
<text x="547.0" y="91.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">state now |0⟩</text>
<rect x="475" y="177" width="145" height="56" rx="6" fill="#ffffff" stroke="#e5533c" stroke-width="2"/>
<text x="547.0" y="199.0" font-size="13" text-anchor="middle" fill="#5a6577" font-weight="400">outcome 1</text>
<text x="547.0" y="221.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">state now |1⟩</text>
<text x="320.0" y="270.0" font-size="13" text-anchor="middle" fill="#5a6577" font-weight="400">The superposition is gone; measuring Z again repeats the same outcome.</text>
</svg>
