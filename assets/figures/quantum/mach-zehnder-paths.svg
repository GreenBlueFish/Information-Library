<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 345" width="920" height="345" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Mach-Zehnder interferometer: two beam splitters and two mirrors; with both paths open all photons reach detector D1</title>
<rect width="920" height="345" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a2230"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f6fb0"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs>
<text x="20.0" y="30.0" font-size="17" text-anchor="start" fill="#1a2230" font-weight="600">A Mach–Zehnder interferometer, one photon at a time</text>
<g transform="translate(0,45)">
<rect x="20" y="210" width="70" height="40" rx="8" fill="#eef1f6" stroke="#9aa5b5" stroke-width="1.5"/>
<text x="55.0" y="235.0" font-size="12" text-anchor="middle" fill="#1a2230" font-weight="400">source</text>
<line x1="90.0" y1="230.0" x2="140.0" y2="230.0" stroke="#c0392b" stroke-width="2.5"/>
<line x1="128" y1="252" x2="172" y2="208" stroke="#7fa7d3" stroke-width="6" opacity="0.8"/>
<text x="150.0" y="275.0" font-size="12" text-anchor="middle" fill="#5a6577" font-weight="400">beam splitter 1</text>
<line x1="128" y1="102" x2="172" y2="58" stroke="#5a6577" stroke-width="6" opacity="0.8"/>
<text x="150.0" y="55.0" font-size="12" text-anchor="middle" fill="#5a6577" font-weight="400">mirror</text>
<line x1="428" y1="252" x2="472" y2="208" stroke="#5a6577" stroke-width="6" opacity="0.8"/>
<text x="450.0" y="275.0" font-size="12" text-anchor="middle" fill="#5a6577" font-weight="400">mirror</text>
<line x1="428" y1="102" x2="472" y2="58" stroke="#7fa7d3" stroke-width="6" opacity="0.8"/>
<text x="500.0" y="125.0" font-size="12" text-anchor="start" fill="#5a6577" font-weight="400">beam splitter 2</text>
<line x1="160.0" y1="230.0" x2="440.0" y2="230.0" stroke="#c0392b" stroke-width="2.5"/>
<text x="300.0" y="222.0" font-size="12" text-anchor="middle" fill="#5a6577" font-weight="400">lower path</text>
<line x1="150.0" y1="220.0" x2="150.0" y2="90.0" stroke="#c0392b" stroke-width="2.5"/>
<text x="140.0" y="160.0" font-size="12" text-anchor="end" fill="#5a6577" font-weight="400">upper path</text>
<line x1="160.0" y1="80.0" x2="440.0" y2="80.0" stroke="#c0392b" stroke-width="2.5"/>
<line x1="450.0" y1="220.0" x2="450.0" y2="90.0" stroke="#c0392b" stroke-width="2.5"/>
<line x1="460.0" y1="80.0" x2="560.0" y2="80.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrr)"/>
<rect x="560" y="60" width="60" height="40" rx="8" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.5"/>
<text x="590.0" y="85.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">D1</text>
<line x1="450.0" y1="70.0" x2="450.0" y2="50.0" stroke="#5a6577" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="420" y="10" width="60" height="36" rx="8" fill="#f3f4f6" stroke="#9aa5b5" stroke-width="1.5"/>
<text x="450.0" y="33.0" font-size="14" text-anchor="middle" fill="#1a2230" font-weight="600">D2</text>
<text x="640.0" y="160.0" font-size="13" text-anchor="start" fill="#1a2230" font-weight="600">Both paths open:</text>
<text x="640.0" y="180.0" font-size="13" text-anchor="start" fill="#1a2230" font-weight="400">every photon reaches D1, none D2.</text>
<text x="640.0" y="215.0" font-size="13" text-anchor="start" fill="#1a2230" font-weight="600">Block either path:</text>
<text x="640.0" y="235.0" font-size="13" text-anchor="start" fill="#1a2230" font-weight="400">half the photons are absorbed,</text>
<text x="640.0" y="255.0" font-size="13" text-anchor="start" fill="#1a2230" font-weight="400">the rest split 1/4 to D1, 1/4 to D2.</text>
</g>
</svg>
