<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>Asset classes placed by typical risk and long-run expected return</title>
<rect width="760" height="440" fill="#ffffff"/>
<text x="24" y="34" font-size="18" font-weight="600" fill="#1a2230">Asset classes by risk and expected return (rough, long run)</text>
<line x1="90" y1="380" x2="730" y2="380" stroke="#1a2230"/><line x1="90" y1="380" x2="90" y2="60" stroke="#1a2230"/>
<text x="410.0" y="414" font-size="13" text-anchor="middle" fill="#1a2230">risk: how much the value swings, and how badly it can fall →</text>
<text x="30" y="220.0" font-size="13" text-anchor="middle" fill="#1a2230" transform="rotate(-90 30 220.0)">expected return over decades →</text>
<path d="M109.2 344.44444444444446 Q 410.0 252.0 614.8 116.88888888888891" fill="none" stroke="#d6dbe3" stroke-width="10" stroke-linecap="round"/>
<circle cx="109" cy="344" r="8" fill="#5a6577"/>
<text x="121" y="348" font-size="13" text-anchor="start" fill="#1a2230">Cash, T-bills</text>
<circle cx="205" cy="302" r="8" fill="#2f6fed"/>
<text x="217" y="306" font-size="13" text-anchor="start" fill="#1a2230">Government bonds</text>
<circle cx="256" cy="277" r="8" fill="#2f6fed"/>
<text x="268" y="281" font-size="13" text-anchor="start" fill="#1a2230">Investment-grade corporates</text>
<circle cx="359" cy="231" r="8" fill="#2f6fed"/>
<text x="371" y="235" font-size="13" text-anchor="start" fill="#1a2230">High-yield bonds</text>
<circle cx="474" cy="188" r="8" fill="#1f9d6b"/>
<text x="486" y="192" font-size="13" text-anchor="start" fill="#1a2230">Real estate (REITs)</text>
<circle cx="512" cy="149" r="8" fill="#c2410c"/>
<text x="524" y="153" font-size="13" text-anchor="start" fill="#1a2230">Large-company stocks</text>
<circle cx="615" cy="117" r="8" fill="#c2410c"/>
<text x="603" y="121" font-size="13" text-anchor="end" fill="#1a2230">Small-cap and emerging stocks</text>
<circle cx="538" cy="273" r="8" fill="#8a5a00"/>
<text x="550" y="277" font-size="13" text-anchor="start" fill="#1a2230">Commodities</text>
<circle cx="685" cy="220" r="8" fill="#8a5a00"/>
<text x="673" y="224" font-size="13" text-anchor="end" fill="#1a2230">Single stocks, options, crypto</text>
<text x="448" y="323" font-size="12" fill="#5a6577">Brown: high risk with no dependable</text>
<text x="448" y="339" font-size="12" fill="#5a6577">reward for bearing it (as a whole)</text>
<text x="116" y="85" font-size="12" fill="#5a6577">Grey band: the trade-off the market pays for broad, undiversifiable risk</text>
</svg>
