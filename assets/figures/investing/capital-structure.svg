<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>The capital structure: who is paid first in a bankruptcy</title>
<rect width="760" height="380" fill="#ffffff"/>
<text x="24" y="34" font-size="18" font-weight="600" fill="#1a2230">The capital structure: who is paid first</text>
<rect x="24" y="60" width="380" height="46" rx="6" fill="#1e40af"/>
<text x="40" y="89" font-size="15" fill="#ffffff" font-weight="600">Secured debt (loans, secured bonds)</text>
<text x="420" y="89" font-size="14" fill="#1a2230">typical recovery: 60 to 80%</text>
<rect x="24" y="116" width="380" height="46" rx="6" fill="#2f6fed"/>
<text x="40" y="145" font-size="15" fill="#ffffff" font-weight="600">Senior unsecured bonds</text>
<text x="420" y="145" font-size="14" fill="#1a2230">typical recovery: about 40%</text>
<rect x="24" y="172" width="380" height="46" rx="6" fill="#6b9bf5"/>
<text x="40" y="201" font-size="15" fill="#ffffff" font-weight="600">Subordinated (junior) bonds</text>
<text x="420" y="201" font-size="14" fill="#1a2230">typical recovery: about 25%</text>
<rect x="24" y="228" width="380" height="46" rx="6" fill="#c2410c"/>
<text x="40" y="257" font-size="15" fill="#ffffff" font-weight="600">Preferred stock</text>
<text x="420" y="257" font-size="14" fill="#1a2230">typical recovery: little</text>
<rect x="24" y="284" width="380" height="46" rx="6" fill="#e8590c"/>
<text x="40" y="313" font-size="15" fill="#ffffff" font-weight="600">Common stock</text>
<text x="420" y="313" font-size="14" fill="#1a2230">typical recovery: usually nothing</text>
<line x1="700" y1="66" x2="700" y2="330" stroke="#5a6577" stroke-width="2" marker-end="url(#d)"/>
<defs><marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs>
<text x="712" y="200" font-size="12" fill="#5a6577" transform="rotate(90 712 200)" text-anchor="middle">paid later · more risk · higher expected return</text>
<text x="24" y="362" font-size="12" fill="#5a6577">Recoveries are rough long-run averages for US defaults; any single case can differ widely.</text>
</svg>
