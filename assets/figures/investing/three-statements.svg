<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>How the income statement, cash flow statement and balance sheet connect</title>
<rect width="760" height="400" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f6fed"/></marker></defs>
<text x="24" y="34" font-size="18" font-weight="600" fill="#1a2230">How the three statements connect</text>
<rect x="24" y="60" width="220" height="230" rx="8" fill="#f6f8fb" stroke="#d6dbe3"/>
<text x="38" y="86" font-size="15" font-weight="600" fill="#1a2230">Income statement</text>
<text x="40" y="112" font-size="13" fill="#1a2230">Revenue</text>
<text x="40" y="134" font-size="13" fill="#1a2230">− costs and expenses</text>
<text x="40" y="156" font-size="13" fill="#1a2230">− depreciation</text>
<text x="40" y="178" font-size="13" fill="#1a2230">− interest, − tax</text>
<rect x="32" y="185" width="204" height="21" rx="4" fill="#dbe7fd"/>
<text x="40" y="200" font-size="13" fill="#1a2230">= Net income</text>
<text x="40" y="222" font-size="13" fill="#1a2230">(over a period)</text>
<rect x="270" y="60" width="220" height="300" rx="8" fill="#f6f8fb" stroke="#d6dbe3"/>
<text x="284" y="86" font-size="15" font-weight="600" fill="#1a2230">Cash flow statement</text>
<rect x="278" y="97" width="204" height="21" rx="4" fill="#dbe7fd"/>
<text x="286" y="112" font-size="13" fill="#1a2230">Net income</text>
<text x="286" y="134" font-size="13" fill="#1a2230">+ depreciation, stock pay</text>
<text x="286" y="156" font-size="13" fill="#1a2230">± working capital</text>
<text x="286" y="178" font-size="13" fill="#1a2230">= Operating cash flow</text>
<text x="286" y="200" font-size="13" fill="#1a2230">− capex, acquisitions</text>
<text x="286" y="222" font-size="13" fill="#1a2230">± debt, shares, dividends</text>
<text x="286" y="244" font-size="13" fill="#1a2230">= Change in cash</text>
<text x="286" y="266" font-size="13" fill="#1a2230">+ cash at start</text>
<rect x="278" y="273" width="204" height="21" rx="4" fill="#dbe7fd"/>
<text x="286" y="288" font-size="13" fill="#1a2230">= Cash at end</text>
<rect x="516" y="60" width="220" height="300" rx="8" fill="#f6f8fb" stroke="#d6dbe3"/>
<text x="530" y="86" font-size="15" font-weight="600" fill="#1a2230">Balance sheet</text>
<text x="532" y="112" font-size="13" fill="#1a2230">Assets</text>
<rect x="524" y="119" width="204" height="21" rx="4" fill="#dbe7fd"/>
<text x="532" y="134" font-size="13" fill="#1a2230">  Cash</text>
<text x="532" y="156" font-size="13" fill="#1a2230">  Receivables, inventory</text>
<text x="532" y="178" font-size="13" fill="#1a2230">  Property, equipment</text>
<text x="532" y="200" font-size="13" fill="#1a2230">Liabilities</text>
<text x="532" y="222" font-size="13" fill="#1a2230">  Payables, debt</text>
<text x="532" y="244" font-size="13" fill="#1a2230">Equity</text>
<text x="532" y="266" font-size="13" fill="#1a2230">  Paid-in capital</text>
<rect x="524" y="273" width="204" height="21" rx="4" fill="#dbe7fd"/>
<text x="532" y="288" font-size="13" fill="#1a2230">  Retained earnings</text>
<line x1="236" y1="152" x2="280" y2="108" stroke="#2f6fed" stroke-width="2" marker-end="url(#a)"/>
<line x1="482" y1="284" x2="524" y2="130" stroke="#2f6fed" stroke-width="2" marker-end="url(#a)"/>
<path d="M140 290 C 140 385, 600 395, 640 312" fill="none" stroke="#2f6fed" stroke-width="2" marker-end="url(#a)"/>
<text x="300" y="384" font-size="12" fill="#5a6577">net income less dividends adds to retained earnings</text>
</svg>
